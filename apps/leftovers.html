<title>The Larder Ledger</title>
<link rel="stylesheet" href="design.css">
<style>
  /* The ledger keeps its own component CSS and takes every colour, size and duration from design.css role tokens (audit
     batch 1, CONS-TOK-1: the old --ledger / --ledger-ink / --ledger-press vocabulary is gone, split by what reads it).
     Meaning is semantic: the Log button is the success solid with its -on label, the mic and ✓ glyphs are success ink,
     the freshness ramp is --fresh / --aging / --use-soon (graphics) and the chips are success / warning / danger fill
     with their -ink label (VIS-LEFTOVERS-2, -3). Nothing here keys off a colour scheme.
     Layout is list-first: the grouped list reads top-down, oldest first, and the add bar is a glass pane
     fixed above the safe area so the list and the bar are both on screen at once. */
  :root { --addbar-h: 150px; }   /* layout plumbing: the add bar's measured height (set by the script below) */
  body { min-height: 100vh; font-family: var(--font-ui);
         padding: 32px max(16px, var(--safe-right)) calc(var(--addbar-h) + 24px + var(--safe-bottom)) max(16px, var(--safe-left)); }
  :root[data-kind="kiosk"] body { padding-bottom: max(64px, var(--safe-bottom)); }
  .wrap { max-width: var(--col-narrow); margin: 0 auto; }   /* CONS-SHAPE-2: the forms-and-lists column (560) */
  .sans { font-family: var(--font-ui); }

  /* type: every size is a role, so the iPad tier, the person's text size and the kid scale reach the Larder
     (CONS-TYPE-4, CONS-TYPE-7, GAP-TOK-4, GAP-TYPE-1) */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: var(--fs-title1); font-weight: var(--fw-title1); letter-spacing: var(--ls-title1); margin: 0; }
  .tally { font-family: var(--font-mono); font-size: var(--fs-caption1); color: var(--text-3); letter-spacing: var(--ls-caps); text-transform: uppercase; white-space: nowrap; }
  .lede { color: var(--text-2); font-size: var(--fs-subheadline); margin: 0 0 6px; }
  .mode { font-size: var(--fs-caption1); color: var(--text-3); margin: 0 0 16px; }
  .mode.warn { color: var(--warning-ink); }

  .alert { display: flex; align-items: center; gap: 8px; background: var(--danger-fill); color: var(--danger-ink);
           padding: 12px 14px; border-radius: var(--r-control); font-size: var(--fs-footnote); margin: 0 0 16px; }

  /* ── the add bar: one glass pane over the list, the house recipe from the tokens (CONS-GLASS-1): the sheen, the person's
        colour caught in the pane (painted in place, no drift), the edge/ring/inner shadow and the saturated blur ── */
  form { position: fixed; z-index: var(--z-bar);
         left: max(12px, var(--safe-left)); right: max(12px, var(--safe-right)); bottom: max(12px, var(--safe-bottom));
         max-width: var(--col-narrow); margin: 0 auto;
         background: var(--glass-bg-strong-tinted);
         border: 1px solid var(--glass-edge); border-radius: var(--r); padding: 12px;
         box-shadow: var(--glass-shadow);
         -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
         display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }   /* minmax(0,…): rows shrink instead of overflowing on a narrow phone */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { form { background: var(--glass-strong-solid); } }
  .namerow { display: flex; align-items: stretch; gap: 8px; min-width: 0; }
  /* fields: a >= 3:1 boundary and the house placeholder ink (P4-COLOR-05), never under 16 px so iOS does not zoom (P4-TELL-02) */
  #name { flex: 1; min-width: 0; border: 1px solid var(--field-border); border-radius: var(--r-control); padding: 0 14px; font-size: var(--fs-field);
          background: var(--surface); color: var(--text); min-height: var(--tap-row); }
  #name:focus, #name:focus-visible { outline: none; border-color: var(--focus-ring-color); box-shadow: var(--focus-ring); }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; min-width: 0; }
  select, #date { border: 1px solid var(--field-border); border-radius: var(--r-control); padding: 0 12px; font-size: var(--fs-field);
                  background: var(--surface); color: var(--text); min-height: var(--tap); width: 100%; min-width: 0; }
  /* Log: the success solid with its own label colour (the pairing rule, GAP-TOK-2); the press is the house .pressable */
  .log { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--success-strong); flex: none;
         color: var(--success-on); border: none; border-radius: var(--r-control); min-height: var(--tap-row); min-width: 88px; padding: 0 16px;
         font-size: var(--fs-callout); font-weight: var(--fw-semibold); cursor: pointer;
         box-shadow: inset 0 1px 0 var(--hi-3), var(--elev-control); }
  .mic { width: var(--tap-row); min-height: var(--tap-row); flex: none; border: 1px solid var(--field-border); border-radius: var(--r-control); background: var(--surface);
         color: var(--success-ink); display: grid; place-items: center; cursor: pointer; }
  .mic[hidden] { display: none; }
  .mic.on { background: var(--danger-fill); color: var(--danger-ink); border-color: var(--danger-graphic); animation: pulse var(--dur-pulse) infinite; }
  @keyframes pulse { 50% { transform: scale(var(--pulse-scale)); } }   /* --pulse-scale is 1 under Reduce Motion */
  .err { color: var(--danger-ink); font-size: var(--fs-footnote); }   /* P3-LEFTOVERS-15: the danger ink at footnote size */
  .wait { color: var(--text-2); font-size: var(--fs-footnote); }

  /* ── loading: until this device has pulled the list once, placeholder cards with the real card's geometry stand in for
        it (never "0" or "Nothing logged"), and what sits below the list waits, so nothing moves when it lands (GAP-MOTION-1) ── */
  .loading { font-size: var(--fs-footnote); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps); text-transform: uppercase; line-height: var(--lh-tight);
             color: var(--text-3); margin: 0 0 8px 2px; }
  .skel .nm i, .skel .meta i { display: inline-block; vertical-align: middle; height: .7em; border-radius: var(--r-full); background: var(--surface-2); }
  .skel .nm i { width: 42%; } .skel .meta i { width: 64%; height: .55em; }
  .skel:nth-child(2) { opacity: .75; } .skel:nth-child(3) { opacity: .5; }
  #list[aria-busy="true"] ~ .donelist, #list[aria-busy="true"] ~ .hearth { display: none; }
  .copy:disabled { opacity: var(--op-disabled); cursor: default; }

  /* ── the grouped list: Use it up · Aging · Fresh, oldest first ── */
  .group { margin-bottom: 18px; }
  .group h2 { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-footnote); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps); text-transform: uppercase;
              color: var(--group-ink); margin: 0 0 8px 2px; }
  .group h2 small { font-family: var(--font-mono); font-weight: var(--fw-medium); font-size: var(--fs-caption2); color: var(--text-3); letter-spacing: var(--ls-caps); }
  .list { display: grid; gap: 10px; }
  /* a content card is solid (CONS-SHAPE-1: --material-solid-bg, --elev-card) */
  .item, .skel { display: flex; align-items: stretch; background: var(--material-solid-bg); border: 1px solid var(--separator); border-radius: var(--r-control);
                 overflow: hidden; box-shadow: var(--elev-card); }
  .stripe { width: 5px; flex: none; background: var(--tint); }
  .skel .stripe, :root[data-kind="kid"] .skel .pic { background: var(--surface-2); }
  .body { flex: 1; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  .info { flex: 1; min-width: 0; }
  .nm { font-size: var(--fs-callout); font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: var(--fs-footnote); color: var(--text-3); margin-top: 2px; }
  /* freshness bar: --fresh / --aging / --use-soon, graphics >= 3:1 against the --surface-2 track in every palette
     (VIS-LEFTOVERS-2; a solid fill, no lighter left end); --p = days/10 */
  .bar { height: 6px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; margin-top: 8px; max-width: 220px; }
  .bar > i { display: block; height: 100%; width: calc(100% * var(--p, 0)); border-radius: inherit;
             background: var(--tint); transition: width var(--dur-progress) var(--spring-gentle); }
  .right { display: flex; align-items: center; gap: 10px; flex: none; }
  /* the state chip: the state's fill with its -ink label (lifted >= 1.5:1 off the card in the dark palettes, VIS-LEFTOVERS-3)
     and the state's glyph, so the three states differ without colour (VIS-LEFTOVERS-2) */
  .status { font-size: var(--fs-caption1); font-weight: var(--fw-semibold); padding: 6px 11px; border-radius: var(--r-full); background: var(--chip); color: var(--chip-text); white-space: nowrap; }
  .status::before { content: var(--chip-glyph); display: inline-block; margin-right: .35em; font-weight: var(--fw-heavy); }
  .item.finishing .status::before, .item.gone .status::before { content: none; }
  /* ✓: a lit control, the success ink glyph on the success fill, never a dark well (VIS-LEFTOVERS-10) */
  .done { border: 1px solid transparent; background: var(--success-fill); border-radius: var(--r-control); width: max(48px, var(--tap)); height: max(48px, var(--tap));
          display: flex; align-items: center; justify-content: center; color: var(--success-ink); flex: none; cursor: pointer; }

  .empty { text-align: center; padding: 32px 0 40px; color: var(--text-3); }
  .empty p { margin: 0; }
  /* the empty-state art sits on the art plate (VIS-LEFTOVERS-7: transparent in light, a raised surface in dark) */
  .empty img { width: 176px; max-width: 70%; margin: 0 auto 14px; padding: 12px; background: var(--art-plate); border-radius: var(--r-card); }

  .hearth { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .hearth p { font-size: var(--fs-footnote); color: var(--text-2); margin: 0 0 12px; }
  .copy { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2);
          border-radius: var(--r-control); padding: 0 18px; min-height: var(--tap-row); font-size: var(--fs-subheadline); color: var(--text); cursor: pointer; }
  /* a ✓ keeps the card in place for six seconds, struck through, with its own Undo (batch 0h) */
  /* a finishing or finished card reads as past by its ink and its strike-through, never by fading the text (CONS-COLOR-1);
     the picture and the chip lose their colour instead */
  .item.finishing .info, .item.finishing .info *, .item.gone .info, .item.gone .info * { color: var(--text-3); }
  .item.finishing .pic, .item.gone .pic, .item.gone .status { filter: saturate(0); }
  .item.finishing .nm, .item.gone .nm { text-decoration: line-through; }
  .status { min-width: 7.5em; text-align: center; box-sizing: border-box; }   /* one width for every label, so no card changes width */
  .undo { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-control); width: max(48px, var(--tap)); height: max(48px, var(--tap)); padding: 0;
          font: inherit; font-size: var(--fs-footnote); font-weight: var(--fw-bold); color: var(--success-ink); cursor: pointer; flex: none; }
  .slot { width: max(48px, var(--tap)); height: max(48px, var(--tap)); flex: none; }
  .newpill { position: fixed; z-index: var(--z-pill); top: max(12px, var(--safe-top)); left: 50%; transform: translateX(-50%);
             min-height: var(--tap); padding: 0 18px; border-radius: var(--r-full); border: 1px solid var(--glass-edge); background: var(--glass-bg-strong-tinted);
             -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter); box-shadow: var(--glass-shadow);
             font: inherit; font-size: var(--fs-subheadline); font-weight: var(--fw-semibold); color: var(--text); cursor: pointer; }
  .newpill[hidden] { display: none; }
  .newpill.pressable:active { transform: translateX(-50%) scale(var(--press-scale)); }   /* keep the centring while pressed */
  .donelist { margin-top: 18px; }
  .donelist summary { cursor: pointer; font-size: var(--fs-footnote); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-3);
                      min-height: var(--tap); display: flex; align-items: center; }
  .donelist .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--separator); }
  .donelist .row.back .t { color: var(--text-3); }
  .donelist .row .t { min-width: 0; font-size: var(--fs-subheadline); } .donelist .row .t small { display: block; color: var(--text-3); font-size: var(--fs-caption1); }
  .putback { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-control); min-height: var(--tap); width: 96px; padding: 0 8px;
             font: inherit; font-size: var(--fs-footnote); font-weight: var(--fw-semibold); color: var(--text); cursor: pointer; flex: none; box-sizing: border-box; }
  .putback.tag { display: inline-flex; align-items: center; justify-content: center; cursor: default; background: transparent; color: var(--text-3); }
  /* kids: a picture view, no controls (P5-D2) — a food picture, the name in big type, how old it is and the freshness colour.
     The roles already carry the kid scale (16 px floor); only the name steps up a role. */
  .pic { display: none; }
  :root[data-kind="kid"] .pic { display: grid; place-items: center; flex: none; width: var(--tap); height: var(--tap); font-size: var(--fs-large-title); line-height: var(--lh-tight);
                                border-radius: var(--r-control); background: var(--chip); }
  :root[data-kind="kid"] .body { gap: 14px; padding: 14px 16px; }
  :root[data-kind="kid"] .nm { font-size: var(--fs-headline); white-space: normal; }
  /* at a large text size the name wraps to two lines instead of shrinking to a few letters (review, batch 1) */
  :root:is([data-text-size="l"], [data-text-size="xl"], [data-text-size="xxl"]) .nm { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  :root[data-kind="kid"] .status { padding: 8px 13px; }
  :root[data-kind="kid"] body { padding-bottom: max(40px, var(--safe-bottom)); }
  :root[data-kind="kid"] .hearth, :root[data-kind="kid"] form[id="add"], :root[data-kind="kid"] .donelist { display: none; }
  /* kid minimum targets outside .ds (P4-SHAPE-01, proposal SHAPE-9): anything a kid can tap is at least --tap (64 px) */
  :root[data-kind="kid"] :is(button, a[href], [role="button"], input:not([type="hidden"]), select, summary, label[for]) { min-width: var(--tap); min-height: var(--tap); }
  :root[data-kind="kiosk"] .hearth, :root[data-kind="kiosk"] form[id="add"] { display: none; }   /* the form id is written as an attribute selector so hex-colour linting does not misread it */
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>The Larder Ledger</h1>
    <span class="tally" id="tally"></span>
  </div>
  <p class="lede">Log it when you put it away. Cross it off when it's gone.</p>
  <p class="mode sans" id="mode" hidden></p>

  <!-- the "at a week or older" alert is drawn at the top of the list itself (GAP-MOTION-1), so the list never moves when it lands -->
  <div id="list" class="sans" aria-busy="true">
    <p class="loading">Loading the fridge…</p>
    <div class="list" aria-hidden="true">
      <div class="skel"><div class="stripe"></div><div class="body"><span class="pic"></span><div class="info"><div class="nm"><i></i>&nbsp;</div><div class="meta"><i></i>&nbsp;</div><div class="bar"></div></div></div></div>
      <div class="skel"><div class="stripe"></div><div class="body"><span class="pic"></span><div class="info"><div class="nm"><i></i>&nbsp;</div><div class="meta"><i></i>&nbsp;</div><div class="bar"></div></div></div></div>
      <div class="skel"><div class="stripe"></div><div class="body"><span class="pic"></span><div class="info"><div class="nm"><i></i>&nbsp;</div><div class="meta"><i></i>&nbsp;</div><div class="bar"></div></div></div></div>
    </div>
  </div>

  <div id="donelist" class="donelist sans"></div>

  <div class="hearth sans">
    <p>Want this week's warnings on the Hearth wall display? Copy the list below and tell Claude
       "push my leftovers to Hearth" — it'll add them straight to the Hearth Calendar.</p>
    <button type="button" class="copy pressable" id="copy" disabled aria-disabled="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Copy list for Hearth</button>
  </div>
</div>

<button type="button" id="newpill" class="newpill sans pressable" hidden></button>

<form id="add" class="sans" aria-label="Log a leftover">
  <div class="namerow">
    <input id="name" placeholder="What is it? e.g. Chicken alfredo" autocomplete="off" enterkeyhint="done" aria-label="Leftover name">
    <button type="button" class="mic pressable is-small" id="mic" aria-label="Say the name" hidden></button>
    <button type="submit" class="log pressable"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Log</button>
  </div>
  <div class="pair">
    <select id="size" aria-label="Container size"><option>Small</option><option selected>Medium</option><option>Large</option><option>Family-size</option></select>
    <input type="date" id="date" aria-label="Date logged">
  </div>
  <span class="wait" id="wait" role="status" hidden></span>
  <span class="err" id="err" hidden></span>
</form>
<script>
  // From the first byte a Log tap or Enter only raises a flag: the browser's own submit (no action, so a GET of this page)
  // would reload the frame and lose the typed name. The app below takes the entry over and logs it once the list has loaded.
  document.getElementById('add').onsubmit = e => {
    e.preventDefault();
    const n = document.getElementById('name').value.trim(); if (!n) return;
    window.__larderHeld = true;
    const w = document.getElementById('wait'); w.textContent = 'Logging “' + n + '” as soon as the list has loaded…'; w.hidden = false;
  };
</script>

<script src="hub.js" data-app="leftovers" data-scope="family"></script>
<script>
(async () => {
  const SIZES = ['Small', 'Medium', 'Large', 'Family-size'];
  const WARN_DAYS = 7, AGING_DAYS = 4, FULL_BAR_DAYS = 10;   // the freshness bar fills over ten days, like the Home fridge card
  // Each state's roles (audit batch 1, migration table; VIS-LEFTOVERS-2, -3): the stripe and freshness bar are graphics
  // (--fresh / --aging / --use-soon, >= 3:1), the chip is the state's fill with its -ink label and its glyph, the group
  // heading is the -ink.
  const TONES = {
    fresh:  { tint: 'var(--fresh)',    chip: 'var(--success-fill)', chipText: 'var(--success-ink)', ink: 'var(--success-ink)', glyph: 'var(--success-glyph)' },
    warn:   { tint: 'var(--aging)',    chip: 'var(--warning-fill)', chipText: 'var(--warning-ink)', ink: 'var(--warning-ink)', glyph: 'var(--warning-glyph)' },
    urgent: { tint: 'var(--use-soon)', chip: 'var(--danger-fill)',  chipText: 'var(--danger-ink)',  ink: 'var(--danger-ink)',  glyph: 'var(--danger-glyph)' },
  };
  const GROUPS = [
    { tone: 'urgent', title: 'Use it up', sub: 'a week or older' },
    { tone: 'warn',   title: 'Aging',     sub: 'eat soon' },
    { tone: 'fresh',  title: 'Fresh',     sub: 'this week' },
  ];
  // Lucide glyphs, inlined — no icon library on a static host. Lucide (https://lucide.dev), ISC licence,
  // copyright (c) Lucide Contributors; derived from Feather, copyright (c) 2013-2023 Cole Bemis (GAP-ICON-2).
  const ICON = {
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',

  }

  // Voice: tap, say the name, it lands in the box.
  const mic = $('mic');
  if (hub.voiceSupported && canEdit) {
    mic.hidden = false; mic.append(svg('mic', 22));
    let rec = null;
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = hub.voiceInput(text => { $('name').value = text; $('name').focus(); }, {
        onEnd: () => { rec = null; mic.classList.remove('on'); },
        onError: () => { rec = null; mic.classList.remove('on'); setErr("Couldn't hear that — try again or type it."); },
      });
      if (rec) { mic.classList.add('on'); setErr(''); }
    };
  }

  function buildHearthText() {
    const due = items().sort((a, b) => daysBetween(b.dateLogged) - daysBetween(a.dateLogged))
      .filter(i => daysBetween(i.dateLogged) >= AGING_DAYS);
    if (!due.length) return "Nothing aging right now — fridge's in good shape.";
    const lines = due.map(i => {
      const d = daysBetween(i.dateLogged);
      return `• ${i.name} (${i.size}) — ${d === Infinity ? 'date unknown, check it' : 'logged ' + d + 'd ago, ' + (d >= WARN_DAYS ? 'use it up' : 'eat soon')}`;
    });
    return 'Push these to the Hearth Calendar:\n' + lines.join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    try { // Safari in an iframe can refuse the async API; fall back to a selection copy.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }

  const copyBtn = $('copy');
  function setCopy(state) {
    copyBtn.textContent = '';
    copyBtn.append(svg('refresh', 15), document.createTextNode(
      state === 'copied' ? ' Copied!' : state === 'failed' ? ' Copy failed — select manually' : ' Copy list for Hearth'));
  }
  copyBtn.onclick = async () => {
    if (!hub.isLoaded()) return;   // an empty cache would copy "Nothing aging"
    setCopy(await copyText(buildHearthText()) ? 'copied' : 'failed');
    setTimeout(() => setCopy('idle'), 2000);
  };

  // Midnight rollover: "Nd ago", the groups and the date box's default/max all key off the household's date, so when
  // the day changes while the page is open (an iPad left on the counter overnight) everything is recomputed.
  // hub.onDay checks every 20 s and on wake; a Log tap re-keys too (submit, above).
  function rollover() {
    const now = hub.today();
    if (now === dayKey) return false;
    const wasToday = $('date').value === dayKey;
    dayKey = now;
    $('date').max = now;
    if (wasToday || !$('date').value) $('date').value = now;
    render();
    return true;
  }
  hub.onDay(rollover);
  window.__larder = { render, rollover, today: () => dayKey };   // test hook (scripts/test-leftovers.mjs)

  hub.onChange(refresh);   // someone else logged or finished something: cards update where they stand
  render();
  // The first pull has answered on this device: paint the real list, and log an entry that was waiting for it.
  hub.loaded().then(() => { rollover(); render(); if (held) submit(); });
})();
</script>
</body>
</html>
