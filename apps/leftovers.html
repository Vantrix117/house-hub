<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Larder Ledger</title>
<link rel="stylesheet" href="design.css">
<style>
  /* The ledger keeps its own look (serif, paper, olive) and takes every colour from design.css tokens.
     The ledger green is the olive ink of whichever theme is on: deep green on paper, pale green in the dark
     themes — the fill/text pair flips with it, so nothing here keys off a colour scheme.
     Layout is list-first: the grouped list reads top-down, oldest first, and the add bar is a glass pane
     fixed above the safe area so the list and the bar are both on screen at once. */
  :root { --ledger: var(--olive-ink); --ledger-ink: var(--surface); --ledger-press: color-mix(in srgb, var(--olive-ink) 82%, var(--text));
          --addbar-h: 150px; }
  body { min-height: 100vh; font-family: var(--font-display);
         padding: 32px max(16px, var(--safe-right)) calc(var(--addbar-h) + 24px + var(--safe-bottom)) max(16px, var(--safe-left)); }
  :root[data-kind="kiosk"] body { padding-bottom: max(64px, var(--safe-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  .sans { font-family: var(--font-sans); }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .tally { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .lede { color: var(--text-2); font-size: 14px; margin: 0 0 6px; }
  .mode { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .mode.warn { color: var(--warn-ink); }

  .alert { display: flex; align-items: center; gap: 8px; background: var(--danger-soft); color: var(--danger-ink);
           padding: 12px 14px; border-radius: var(--r-sm); font-size: 13px; margin: 8px 0 16px; }

  /* ── the add bar: one glass pane, fixed above the safe area (design.css liquid-glass recipe, strong variant) ── */
  form { --g: var(--glass-strong);
         position: fixed; z-index: 20;
         left: max(12px, var(--safe-left)); right: max(12px, var(--safe-right)); bottom: max(12px, var(--safe-bottom));
         max-width: 560px; margin: 0 auto;
         background:
           linear-gradient(to bottom, var(--glass-spec) 0, transparent 34%),
           radial-gradient(90% 70% at var(--sheen-x) -10%, color-mix(in srgb, var(--accent) var(--glass-pickup), transparent), transparent 62%),
           var(--g);
         border: 1px solid var(--glass-edge); border-radius: var(--r); padding: 12px;
         box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e2);
         -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02); backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02);
         display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }   /* minmax(0,…): rows shrink instead of overflowing on a narrow phone */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { form { --g: color-mix(in srgb, var(--surface) 96%, transparent); } }
  .namerow { display: flex; align-items: stretch; gap: 8px; min-width: 0; }
  #name { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 14px; font-size: 17px;
          outline: none; background: var(--surface); color: var(--text); min-height: 52px; }
  #name:focus { border-color: var(--ledger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ledger) 22%, transparent); }
  #name::placeholder { color: var(--muted); }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; min-width: 0; }
  select, #date { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 12px; font-size: 15px;
                  background: var(--surface); color: var(--text); min-height: 44px; width: 100%; min-width: 0; }
  .log { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--ledger); flex: none;
         color: var(--ledger-ink); border: none; border-radius: var(--r-sm); min-height: 52px; min-width: 88px; padding: 0 16px; font-size: 16px; font-weight: 600; cursor: pointer;
         box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ledger-ink) 22%, transparent), var(--e1); }
  .log:active { background: var(--ledger-press); }
  .mic { width: 52px; min-height: 52px; flex: none; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
         color: var(--ledger); display: grid; place-items: center; cursor: pointer; }
  .mic[hidden] { display: none; }
  .mic.on { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(.94); } }
  .err { color: var(--danger); font-size: 12px; }
  .wait { color: var(--text-2); font-size: 13px; }

  /* ── loading: until this device has pulled the list once, grey cards stand in for it (never "0" or "Nothing logged") ── */
  .loading { font-size: 13px; color: var(--muted); margin: 0 0 10px 2px; }
  .skel { position: relative; height: 74px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line-soft); }
  .skel::before, .skel::after { content: ""; position: absolute; left: 19px; height: 12px; border-radius: var(--r-full); background: var(--surface-2); }
  .skel::before { top: 20px; width: 42%; } .skel::after { top: 42px; width: 64%; height: 8px; }
  .skel:nth-child(2) { opacity: .75; } .skel:nth-child(3) { opacity: .5; }
  .copy:disabled { opacity: .55; cursor: default; }

  /* ── the grouped list: Use it up · Aging · Fresh, oldest first ── */
  .group { margin-bottom: 18px; }
  .group h2 { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
              color: var(--group-ink); margin: 0 0 8px 2px; }
  .group h2 small { font-family: var(--font-mono); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .list { display: grid; gap: 10px; }
  .item { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-sm); overflow: hidden; box-shadow: var(--e1); }
  .stripe { width: 5px; flex: none; background: var(--tint); }
  .body { flex: 1; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  .info { flex: 1; min-width: 0; }
  .nm { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  /* freshness bar — the design.css .bar recipe (tokens only), --p = days/10, --tint by age; body has no .ds so it lives here */
  .bar { height: 6px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; margin-top: 8px; max-width: 220px; }
  .bar > i { display: block; height: 100%; width: calc(100% * var(--p, 0)); border-radius: inherit;
             background: linear-gradient(90deg, color-mix(in srgb, var(--tint) 75%, white), var(--tint)); transition: width .8s var(--ease-out); }
  .right { display: flex; align-items: center; gap: 10px; flex: none; }
  .status { font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--chip); color: var(--chip-text); white-space: nowrap; }
  .done { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); width: 48px; height: 48px;
          display: flex; align-items: center; justify-content: center; color: var(--ledger); flex: none; cursor: pointer; }
  .done:active { background: var(--hover); }

  .empty { text-align: center; padding: 32px 0 40px; color: var(--muted); }
  .empty p { margin: 0; }
  .empty img { width: 176px; max-width: 70%; margin: 0 auto 14px; }

  .hearth { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .hearth p { font-size: 13px; color: var(--text-2); margin: 0 0 12px; }
  .copy { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2);
          border-radius: var(--r-sm); padding: 0 18px; min-height: 52px; font-size: 14px; color: var(--text); cursor: pointer; }
  .copy:active { background: var(--hover); }
  /* a ✓ keeps the card in place for six seconds, struck through, with its own Undo (batch 0h) */
  .item.finishing .info, .item.finishing .pic, .item.gone .info, .item.gone .pic, .item.gone .status { opacity: .55; }
  .item.finishing .nm, .item.gone .nm { text-decoration: line-through; }
  .status { min-width: 84px; text-align: center; box-sizing: border-box; }
  :root[data-kind="kid"] .status { min-width: 104px; }
  .undo { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); width: 48px; height: 48px; padding: 0;
          font: inherit; font-size: 13px; font-weight: 700; color: var(--ledger); cursor: pointer; flex: none; }
  .slot { width: 48px; height: 48px; flex: none; }
  .newpill { position: fixed; z-index: 25; top: max(12px, var(--safe-top)); left: 50%; transform: translateX(-50%);
             min-height: 44px; padding: 0 18px; border-radius: var(--r-full); border: 1px solid var(--glass-edge); background: var(--glass-strong);
             -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); box-shadow: var(--e2);
             font: inherit; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; }
  .newpill[hidden] { display: none; }
  .donelist { margin-top: 18px; }
  .donelist summary { cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
                      min-height: 44px; display: flex; align-items: center; }
  .donelist .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line-soft); }
  .donelist .row.back .t { opacity: .55; }
  .donelist .row .t { min-width: 0; font-size: 14px; } .donelist .row .t small { display: block; color: var(--muted); font-size: 12px; }
  .putback { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); min-height: 44px; width: 96px; padding: 0 8px;
             font: inherit; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; flex: none; box-sizing: border-box; }
  .putback.tag { display: inline-flex; align-items: center; justify-content: center; cursor: default; background: transparent; color: var(--muted); }
  /* kids: a picture view, no controls (P5-D2) — a food picture, the name in big type, how old it is and the freshness colour */
  .pic { display: none; }
  :root[data-kind="kid"] .pic { display: grid; place-items: center; flex: none; width: 60px; height: 60px; font-size: 36px; border-radius: var(--r-sm);
                                background: color-mix(in srgb, var(--tint) 22%, var(--surface)); }
  :root[data-kind="kid"] .body { gap: 14px; padding: 14px 16px; }
  :root[data-kind="kid"] .nm { font-size: 21px; white-space: normal; }
  :root[data-kind="kid"] .meta { font-size: 15px; }
  :root[data-kind="kid"] .status { font-size: 14px; padding: 8px 13px; }
  :root[data-kind="kid"] body { padding-bottom: max(40px, var(--safe-bottom)); }
  :root[data-kind="kid"] .hearth, :root[data-kind="kid"] form[id="add"], :root[data-kind="kid"] .donelist { display: none; }
  :root[data-kind="kiosk"] .hearth, :root[data-kind="kiosk"] form[id="add"] { display: none; }   /* the form id is written as an attribute selector so hex-colour linting does not misread it */
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>The Larder Ledger</h1>
    <span class="tally" id="tally"></span>
  </div>
  <p class="lede">Log it when you put it away. Cross it off when it's gone.</p>
  <p class="mode sans" id="mode" hidden></p>

  <div id="alert"></div>

  <div id="list" class="sans" aria-busy="true">
    <p class="loading">Loading the fridge…</p>
    <div class="list" aria-hidden="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div>

  <div id="donelist" class="donelist sans"></div>

  <div class="hearth sans">
    <p>Want this week's warnings on the Hearth wall display? Copy the list below and tell Claude
       "push my leftovers to Hearth" — it'll add them straight to the Hearth Calendar.</p>
    <button type="button" class="copy" id="copy" disabled aria-disabled="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Copy list for Hearth</button>
  </div>
</div>

<button type="button" id="newpill" class="newpill sans" hidden></button>

<form id="add" class="sans" aria-label="Log a leftover">
  <div class="namerow">
    <input id="name" placeholder="What is it? e.g. Chicken alfredo" autocomplete="off" enterkeyhint="done" aria-label="Leftover name">
    <button type="button" class="mic" id="mic" aria-label="Say the name" hidden></button>
    <button type="submit" class="log"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Log</button>
  </div>
  <div class="pair">
    <select id="size" aria-label="Container size"><option>Small</option><option selected>Medium</option><option>Large</option><option>Family-size</option></select>
    <input type="date" id="date" aria-label="Date logged">
  </div>
  <span class="wait" id="wait" role="status" hidden></span>
  <span class="err" id="err" hidden></span>
</form>
<script>
  // From the first byte a Log tap or Enter only raises a flag: the browser's own submit (no action, so a GET of this page)
  // would reload the frame and lose the typed name. The app below takes the entry over and logs it once the list has loaded.
  document.getElementById('add').onsubmit = e => {
    e.preventDefault();
    const n = document.getElementById('name').value.trim(); if (!n) return;
    window.__larderHeld = true;
    const w = document.getElementById('wait'); w.textContent = 'Logging “' + n + '” as soon as the list has loaded…'; w.hidden = false;
  };
</script>

<script src="hub.js" data-app="leftovers" data-scope="family"></script>
<script>
(async () => {
  const SIZES = ['Small', 'Medium', 'Large', 'Family-size'];
  const WARN_DAYS = 7, AGING_DAYS = 4, FULL_BAR_DAYS = 10;   // the freshness bar fills over ten days, like the Home fridge card
  const TONES = {
    fresh:  { tint: 'var(--ok)',     chip: 'var(--ok-soft)',     chipText: 'var(--ok-ink)',     ink: 'var(--ok-ink)' },
    warn:   { tint: 'var(--warn)',   chip: 'var(--warn-soft)',   chipText: 'var(--warn-ink)',   ink: 'var(--warn-ink)' },
    urgent: { tint: 'var(--danger)', chip: 'var(--danger-soft)', chipText: 'var(--danger-ink)', ink: 'var(--danger-ink)' },
  };
  const GROUPS = [
    { tone: 'urgent', title: 'Use it up', sub: 'a week or older' },
    { tone: 'warn',   title: 'Aging',     sub: 'eat soon' },
    { tone: 'fresh',  title: 'Fresh',     sub: 'this week' },
  ];
  // Lucide glyphs, inlined — no icon library on a static host.
  const ICON = {
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  };
  function svg(name, size, stroke) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', stroke || 2); s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICON[name];
    return s;
  }

  // One household day: dates are New York's (as the Worker and the 8 am push), whatever zone this device is in, and an age
  // is a count of calendar days — a millisecond division comes up an hour short across spring-forward and floors a day low.
  const $ = id => document.getElementById(id);
  let dayKey = hub.today();
  $('date').value = $('date').max = dayKey;   // before the first await, so the box is never blank while loading
  const daysBetween = s => hub.daysBetween(s, dayKey);
  const statusFor = d => d >= WARN_DAYS ? { label: 'Use it up', tone: 'urgent' }
                       : d >= AGING_DAYS ? { label: 'Aging', tone: 'warn' }
                       : { label: 'Fresh', tone: 'fresh' };

  await hub.ready();
  // Family data lives on the server already; this only rescues an item cached on a device that never synced. Async: it
  // waits for a fresh pull, and its change event re-renders.
  hub.migrate([{ from: 'leftovers.items', scope: 'family', to: v => (Array.isArray(v) ? v : []).filter(i => i && i.id).map(i => ['item:' + i.id, i]) }]).catch(console.error);

  const items = () => hub.list('item:').map(r => r.value);
  const errEl = $('err'), waitEl = $('wait'), listEl = $('list'), alertEl = $('alert'), tallyEl = $('tally'), modeEl = $('mode'), form = $('add');
  const setErr = m => { errEl.textContent = m; errEl.hidden = !m; };
  const setWait = m => { waitEl.textContent = m; waitEl.hidden = !m; };
  const canEdit = hub.canWrite && !hub.isKid;   // P5-D2: kids only look at the Larder (the Worker refuses their writes); their picture view comes in batch 8

  // Only speak up when sync ISN'T working — silence means the house list is fine.
  hub.onSync(s => {
    if (s.state === 'offline') { modeEl.textContent = (hub.isLoaded() ? "Can't reach the house list — showing the last copy saved here." : "Can't reach the house list yet — the fridge shows up once it connects.") + (s.pending ? ' Your changes will send when it is back.' : ''); modeEl.className = 'mode sans warn'; modeEl.hidden = false; }
    else if (s.state === 'error') { modeEl.textContent = 'The house list had a problem: ' + (s.lastError || 'unknown') + '.'; modeEl.className = 'mode sans warn'; modeEl.hidden = false; }
    else modeEl.hidden = true;
  });

  // The page's bottom padding follows the real height of the bar (the mic slot and the error line change it).
  if (canEdit && 'ResizeObserver' in window) {
    new ResizeObserver(() => document.documentElement.style.setProperty('--addbar-h', Math.ceil(form.getBoundingClientRect().height) + 'px')).observe(form);
  }

  // ── one tap, one item (batch 0h: P3-LEFTOVERS-01, -12, UX-LEFTOVERS-1) ──
  // A ✓ marks its own item (by id) as finishing: the card stays where it is, struck through, with an Undo on it and on a
  // toast. The item is taken off the house list only after six seconds (or when the page is left), so a second tap
  // lands on the same card's Undo, never on the next item, and a mistaken tap costs nothing. Finished items are kept
  // for seven days under "Recently finished" (finished:<id>, with their size and date), where they can be put back.
  const FINISH_MS = 6000, KEEP_DAYS = 7, OPENED = Date.now();
  const pending = new Map();   // id -> { it, t }
  // A change never moves a card under a finger (P3-LEFTOVERS-12). The list is laid out (sorted and grouped) only when it
  // opens, on this device's own Log or Put back, at midnight, when the app comes back into view, or on "Show" in the
  // "N new" pill. Everything else updates cards where they stand: an item finished on another device (or this one's
  // own ✓ after its six seconds) stays in its place, dimmed and marked Finished, with nothing to tap; an item added
  // elsewhere waits behind the pill. Nothing in a card changes width, so no card changes height either.
  let laidOut = false;
  const seen = new Map();   // id -> the item as last shown, so a card finished elsewhere keeps its name
  const pillEl = $('newpill');
  pillEl.onclick = () => render();
  // An item finishing here that someone else finished (or that went some other way) is no longer finishing here.
  function dropStale() { for (const [id, p] of pending) if (!hub.get('item:' + id)) { clearTimeout(p.t); pending.delete(id); } }
  function refresh() {
    if (!hub.isLoaded()) return;
    if (!laidOut || !listEl.querySelector('.item')) { render(); return; }   // nothing on screen to aim at
    dropStale();
    const live = new Map(items().map(i => [i.id, i]));
    const act = document.activeElement, focusCard = act && act.closest && act.closest('.item'), focusSel = act && act.classList.contains('undo') ? '.undo' : '.done';
    for (const card of [...listEl.querySelectorAll('.item')]) {
      const id = card.dataset.id, it = live.get(id) || seen.get(id);
      if (!it) continue;
      if (live.has(id)) seen.set(id, it);
      const next = itemCard(it, !live.has(id));
      if (next.dataset.sig === card.dataset.sig) continue;               // unchanged: left alone (focus, a tap in progress)
      card.replaceWith(next);
      if (focusCard === card) {                                          // focus stays with its card, or moves on from a finished one
        const b = next.querySelector(focusSel) || next.querySelector('button');
        if (b) b.focus();
        else {
          const all = [...listEl.querySelectorAll('.item:not(.gone) .done')];
          const after = all.find(x => next.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING);
          const before = all.reverse().find(x => next.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_PRECEDING);
          const to = after || before || document.querySelector('#hub-toast .toast-act'); if (to) to.focus();
        }
      }
    }
    const shown = new Set([...listEl.querySelectorAll('.item')].map(c => c.dataset.id));
    const added = [...live.keys()].filter(id => !shown.has(id)).length;
    pillEl.textContent = added + ' new in the fridge · Show'; pillEl.hidden = !added;
    tallyEl.textContent = [...live.keys()].filter(id => !pending.has(id)).length + ' in the fridge';
    renderDone(false);
  }
  const FOOD = [[/pizza/i, '\u{1F355}'], [/chicken|wing|nugget|turkey/i, '\u{1F357}'], [/soup|stew|chili|broth|gumbo/i, '\u{1F372}'],
    [/pasta|spaghetti|alfredo|lasagn|mac|noodle/i, '\u{1F35D}'], [/rice|risotto/i, '\u{1F35A}'], [/salad/i, '\u{1F957}'], [/taco|burrito|enchilada|quesadilla/i, '\u{1F32E}'],
    [/burger|sandwich|sub\b|wrap/i, '\u{1F96A}'], [/cake|pie|cookie|brownie|dessert|pudding/i, '\u{1F370}'], [/fish|salmon|shrimp|tuna/i, '\u{1F41F}'],
    [/beef|steak|roast|pork|ham|meatloaf|ribs/i, '\u{1F356}'], [/egg/i, '\u{1F95A}'], [/bread|roll|biscuit|muffin/i, '\u{1F35E}'], [/potato|fries/i, '\u{1F954}'],
    [/veg|broccoli|beans|carrot|corn/i, '\u{1F966}']];
  const foodPic = name => { for (const [re, e] of FOOD) if (re.test(name || '')) return e; return '\u{1F371}'; };

  function render() {
    // Until this device has pulled the list once, the cache is empty, not the fridge: keep the markup's grey cards and
    // leave the tally, the alert and "Nothing logged yet" for real data (hub.loaded() below re-renders).
    if (!hub.isLoaded()) return;
    listEl.removeAttribute('aria-busy');
    copyBtn.disabled = false; copyBtn.removeAttribute('aria-disabled');
    laidOut = true; pillEl.hidden = true; seen.clear();
    dropStale();
    const sorted = items().sort((a, b) => daysBetween(b.dateLogged) - daysBetween(a.dateLogged));
    renderDone();
    tallyEl.textContent = sorted.filter(i => !pending.has(i.id)).length + ' in the fridge';

    const warnCount = sorted.filter(i => daysBetween(i.dateLogged) >= WARN_DAYS).length;
    alertEl.textContent = '';
    if (warnCount) {
      const d = document.createElement('div');
      d.className = 'alert sans';
      d.append(svg('alert', 16, 2.2),
        document.createTextNode(warnCount + ' item' + (warnCount > 1 ? 's' : '') + ' at a week or older'));
      alertEl.append(d);
    }

    listEl.textContent = '';
    if (!sorted.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      const p = document.createElement('p');
      p.textContent = 'Nothing logged yet.';
      const art = document.createElement('img');
      art.src = '../art/empty/fridge.svg'; art.alt = ''; art.decoding = 'async';
      e.append(art, p);
      listEl.append(e);
      return;
    }

    for (const g of GROUPS) {
      const rows = sorted.filter(i => statusFor(daysBetween(i.dateLogged)).tone === g.tone);
      if (!rows.length) continue;
      const t = TONES[g.tone];
      const group = document.createElement('section');
      group.className = 'group'; group.dataset.tone = g.tone;
      group.style.setProperty('--group-ink', t.ink);
      const h = document.createElement('h2');
      h.textContent = g.title;
      const small = document.createElement('small'); small.textContent = rows.length + ' · ' + g.sub;
      h.append(small);
      const grid = document.createElement('div');
      grid.className = 'list';
      for (const it of rows) { seen.set(it.id, it); grid.append(itemCard(it)); }
      group.append(h, grid);
      listEl.append(group);
    }
  }

  function itemCard(it, gone = false) {
    const days = daysBetween(it.dateLogged);
    const { label, tone } = statusFor(days);
    const t = TONES[tone];

    const card = document.createElement('div');
    const finishing = pending.has(it.id);
    card.className = 'item' + (finishing ? ' finishing' : '') + (gone ? ' gone' : ''); card.dataset.id = it.id; card.dataset.days = days; card.dataset.tone = tone;
    card.style.setProperty('--tint', t.tint);
    card.style.setProperty('--chip', t.chip);
    card.style.setProperty('--chip-text', t.chipText);

    const stripe = document.createElement('div'); stripe.className = 'stripe';
    const body = document.createElement('div'); body.className = 'body';
    const pic = document.createElement('span'); pic.className = 'pic'; pic.setAttribute('aria-hidden', 'true'); pic.textContent = foodPic(it.name);
    const info = document.createElement('div'); info.className = 'info';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = hub.isKid ? (days <= 0 ? 'Put in today' : days + (days === 1 ? ' day' : ' days') + ' in the fridge')
      : it.size + ' · logged ' + it.dateLogged + ' · ' + days + 'd ago' + (it.byName ? ' · ' + it.byName : '');
    const bar = document.createElement('div'); bar.className = 'bar';
    bar.style.setProperty('--p', Math.min(1, Math.max(0, days) / FULL_BAR_DAYS));
    bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', days + ' of ' + FULL_BAR_DAYS + ' days');
    bar.append(document.createElement('i'));
    info.append(nm, meta, bar);

    const right = document.createElement('div'); right.className = 'right';
    const chip = document.createElement('span'); chip.className = 'status'; chip.textContent = finishing || gone ? 'Finished' : label;
    right.append(chip);
    if (canEdit && gone) {
      const slot = document.createElement('span'); slot.className = 'slot'; slot.setAttribute('aria-hidden', 'true');   // where the ✓ was
      right.append(slot);
    } else if (canEdit && finishing) {
      const undo = document.createElement('button');
      undo.type = 'button'; undo.className = 'undo'; undo.textContent = 'Undo';
      undo.setAttribute('aria-label', 'Undo: keep ' + it.name + ' in the fridge');
      // the second tap of a double tap lands here: it is not an Undo (the toast's Undo and a later tap are)
      undo.onclick = () => { const p = pending.get(it.id); if (p && Date.now() - p.at < 700) return; undoFinish(it.id); };
      right.append(undo);
    } else if (canEdit) {
      const done = document.createElement('button');
      done.type = 'button'; done.className = 'done';
      done.title = 'Mark used up';
      done.setAttribute('aria-label', 'Mark ' + it.name + ' used up');
      done.append(svg('check', 18, 2.4));
      done.onclick = () => { done.disabled = true; removeItem(it.id); };
      right.append(done);
    }
    body.append(pic, info, right);
    card.append(stripe, body);
    card.dataset.sig = JSON.stringify([it.name, it.size, it.dateLogged, it.byName, days, finishing, gone]);   // what the card shows
    return card;
  }

  // An entry made before the list has loaded is held (the name stays in the box) and logged once it has.
  let held = !!window.__larderHeld;
  function submit() {
    const name = $('name').value.trim();
    if (!name) { held = false; setWait(''); return; }
    if (!canEdit) { held = false; setWait(''); hub.kioskNudge(); setErr('This profile can only look at the list.'); return; }
    if (!hub.isLoaded()) { held = true; setErr(''); setWait('Logging “' + name + '” as soon as the list has loaded…'); return; }
    held = false; setWait('');
    rollover();   // re-key the day first: in the minute after midnight the box can still hold yesterday
    const item = {
      id: hub.uid(), name, size: $('size').value, dateLogged: $('date').value || dayKey,
      by: hub.profile.id, byName: hub.profile.name,
    };
    try { hub.set('item:' + item.id, item); }
    catch (err) { setErr(err && err.error === 'not_loaded' ? 'Still loading — try again in a moment.' : "Couldn't log that — try again."); return; }
    $('name').value = ''; $('name').blur();
    $('size').value = SIZES[1];
    $('date').value = $('date').max = dayKey;   // value and max always agree
    hub.activity('Logged ' + item.name + ' (' + item.size + ') in the fridge');
    setErr(''); render();
  }
  form.onsubmit = e => { e.preventDefault(); submit(); };
  // The browser checks the date against max before submit fires, so the day is re-keyed on the tap / Enter itself.
  form.addEventListener('click', e => { if (e.target.closest && e.target.closest('.log')) rollover(); }, true);
  $('name').addEventListener('keydown', e => { if (e.key === 'Enter') rollover(); });

  // keyboard / VoiceOver: a rebuilt card gets the focus back on its own button
  const focusedIn = id => { const a = document.activeElement; return !!(a && a.closest && a.closest('.item') && a.closest('.item').dataset.id === id); };
  const refocus = (id, sel) => { const c = [...listEl.querySelectorAll('.item')].find(x => x.dataset.id === id); const b = c && c.querySelector(sel); if (b) b.focus(); };
  function removeItem(id) {
    if (pending.has(id) || !canEdit) return;                    // a second tap on the same card does nothing more
    const it = hub.get('item:' + id); if (!it) { refresh(); return; }
    const had = focusedIn(id);
    pending.set(id, { it, at: Date.now(), t: setTimeout(() => commitFinish(id), FINISH_MS) });
    refresh(); if (had) refocus(id, '.undo');
    // the toast's Undo still works a moment after the six seconds: then it puts the item back
    hub.toast('Finished the ' + it.name + '.', FINISH_MS, { action: 'Undo', onAction: () => { if (pending.has(id)) undoFinish(id); else { const f = hub.get('finished:' + id); if (f) putBack(f); } } });
  }
  function undoFinish(id) { const p = pending.get(id); if (!p) return; const had = focusedIn(id); clearTimeout(p.t); pending.delete(id); refresh(); if (had) refocus(id, '.done'); }
  function commitFinish(id) {
    const p = pending.get(id); if (!p) return;
    clearTimeout(p.t); pending.delete(id);
    const it = hub.get('item:' + id);
    if (!it) { refresh(); return; }                            // someone else finished it meanwhile
    try { hub.remove('item:' + id); } catch { refresh(); return; }   // the SDK's toast has said why
    if (it.id) try { hub.set('finished:' + id, { id: it.id, name: it.name, size: it.size, dateLogged: it.dateLogged, loggedBy: it.by, loggedByName: it.byName,
      finishedAt: dayKey, finishedBy: hub.profile.id, finishedByName: hub.profile.name }); } catch {}
    hub.activity('Finished the ' + it.name);
    refresh();
  }
  // Leaving the page finishes what is finishing (the queue sends it as usual).
  const commitAll = () => { for (const id of [...pending.keys()]) commitFinish(id); };
  if (typeof hub.onLeave === 'function') hub.onLeave(commitAll); else addEventListener('pagehide', commitAll);
  // hidden (the app put in the background, the phone locked): finish now and send while the page is still alive
  document.addEventListener('visibilitychange', () => { if (document.hidden && pending.size) { commitAll(); if (hub.flush) hub.flush().catch(() => {}); } });
  addEventListener('pageshow', e => { if (e.persisted) render(); });
  // back in view: nothing is being aimed at yet, so the list is laid out afresh (finished cards go, new ones take their place)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  // Recently finished: the last seven days' finished items, each with Put back (adults); older ones are cleared.
  // Recently finished follows the list's rule: laid out (newest first) with the list; between layouts a row never moves —
  // a row whose item is back in the fridge is dimmed with its button hidden (its place kept), a newly finished item is
  // added at the end, and only the count in the heading changes.
  function doneRow(v, back) {
    const row = document.createElement('div'); row.className = 'row' + (back ? ' back' : ''); row.dataset.id = v.id;
    const t = document.createElement('div'); t.className = 't'; t.textContent = v.name;
    const small = document.createElement('small');
    small.textContent = (v.size ? v.size + ' · ' : '') + 'logged ' + v.dateLogged + ' · finished ' + (v.finishedAt === dayKey ? 'today' : v.finishedAt) + (v.finishedByName ? ' · ' + v.finishedByName : '');
    t.append(small); row.append(t);
    if (canEdit && back) {                                              // the same box as the button, so the row keeps its size
      const tag = document.createElement('span'); tag.className = 'putback tag'; tag.textContent = 'Back ✓';
      tag.setAttribute('aria-label', v.name + ' is back in the fridge');
      row.append(tag);
    } else if (canEdit) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'putback'; b.textContent = 'Put back';
      b.setAttribute('aria-label', 'Put ' + v.name + ' back in the fridge');
      b.onclick = () => putBack(v);
      row.append(b);
    }
    row.dataset.sig = JSON.stringify([v.name, v.size, v.dateLogged, v.finishedAt, v.finishedByName, back]);
    return row;
  }
  function renderDone(full = true) {
    const el = $('donelist'); if (!el) return;
    const rows = hub.list('finished:').map(r => r.value).filter(v => v && v.id && v.name);
    const fresh = hub.sync && hub.sync.lastPull && hub.sync.lastPull >= OPENED;   // an old cache must not erase a newer row
    if (canEdit && fresh && full) for (const v of rows) if (hub.daysBetween(String(v.finishedAt || dayKey), dayKey) > KEEP_DAYS) { try { hub.remove('finished:' + v.id); } catch {} }
    const inWeek = v => hub.daysBetween(String(v.finishedAt || dayKey), dayKey) <= KEEP_DAYS;
    const recent = rows.filter(v => inWeek(v) && !hub.get('item:' + v.id)).sort((a, b) => String(b.finishedAt).localeCompare(String(a.finishedAt)));
    const det = el.querySelector('details');
    if (!full && det) {                                                 // in place
      const byId = new Map(rows.map(v => [v.id, v]));
      for (const row of [...det.querySelectorAll('.row')]) {
        const v = byId.get(row.dataset.id); if (!v) continue;
        const next = doneRow(v, !!hub.get('item:' + v.id));
        if (next.dataset.sig === row.dataset.sig) continue;
        const hadFocus = row.contains(document.activeElement);
        row.replaceWith(next);
        if (hadFocus) { const b = next.querySelector('button.putback') || [...det.querySelectorAll('button.putback')].find(x => next.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING); if (b) b.focus(); }
      }
      const have = new Set([...det.querySelectorAll('.row')].map(r => r.dataset.id));
      for (const v of recent) if (!have.has(v.id)) det.append(doneRow(v, false));
      det.querySelector('summary').textContent = 'Recently finished · ' + recent.length;
      return;
    }
    const open = det && det.open;
    el.textContent = '';
    if (!recent.length) return;
    const d = document.createElement('details'); d.open = !!open;
    const sm = document.createElement('summary'); sm.textContent = 'Recently finished · ' + recent.length;
    d.append(sm);
    for (const v of recent) d.append(doneRow(v, false));
    el.append(d);
  }
  function putBack(v) {
    const p = pending.get(v.id); if (p) { clearTimeout(p.t); pending.delete(v.id); }
    // the kitchen may credit only a current household member under their current name (the house refuses anything else)
    let by = v.loggedBy, byName = v.loggedByName;
    if (hub.profile && hub.profile.kind === 'kitchen') {
      const q = (hub.people ? hub.people() : []).find(x => x && x.id === by);
      const ok = by === hub.profile.id || (q && !q.is_guest && !q.isGuest && q.kind === 'adult' && q.name === byName);
      if (!ok) { by = undefined; byName = undefined; }
    }
    const item = { id: v.id, name: v.name, size: v.size, dateLogged: v.dateLogged }; if (by) { item.by = by; item.byName = byName; }
    try { hub.set('item:' + v.id, item); } catch { return; }
    hub.activity('Put the ' + v.name + ' back in the fridge');
    render();
  }

  // Voice: tap, say the name, it lands in the box.
  const mic = $('mic');
  if (hub.voiceSupported && canEdit) {
    mic.hidden = false; mic.append(svg('mic', 22));
    let rec = null;
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = hub.voiceInput(text => { $('name').value = text; $('name').focus(); }, {
        onEnd: () => { rec = null; mic.classList.remove('on'); },
        onError: () => { rec = null; mic.classList.remove('on'); setErr("Couldn't hear that — try again or type it."); },
      });
      if (rec) { mic.classList.add('on'); setErr(''); }
    };
  }

  function buildHearthText() {
    const due = items().sort((a, b) => daysBetween(b.dateLogged) - daysBetween(a.dateLogged))
      .filter(i => daysBetween(i.dateLogged) >= AGING_DAYS);
    if (!due.length) return "Nothing aging right now — fridge's in good shape.";
    const lines = due.map(i => {
      const d = daysBetween(i.dateLogged);
      return `• ${i.name} (${i.size}) — logged ${d}d ago, ${d >= WARN_DAYS ? 'use it up' : 'eat soon'}`;
    });
    return 'Push these to the Hearth Calendar:\n' + lines.join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    try { // Safari in an iframe can refuse the async API; fall back to a selection copy.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }

  const copyBtn = $('copy');
  function setCopy(state) {
    copyBtn.textContent = '';
    copyBtn.append(svg('refresh', 15), document.createTextNode(
      state === 'copied' ? ' Copied!' : state === 'failed' ? ' Copy failed — select manually' : ' Copy list for Hearth'));
  }
  copyBtn.onclick = async () => {
    if (!hub.isLoaded()) return;   // an empty cache would copy "Nothing aging"
    setCopy(await copyText(buildHearthText()) ? 'copied' : 'failed');
    setTimeout(() => setCopy('idle'), 2000);
  };

  // Midnight rollover: "Nd ago", the groups and the date box's default/max all key off the household's date, so when
  // the day changes while the page is open (an iPad left on the counter overnight) everything is recomputed.
  // hub.onDay checks every 20 s and on wake; a Log tap re-keys too (submit, above).
  function rollover() {
    const now = hub.today();
    if (now === dayKey) return false;
    const wasToday = $('date').value === dayKey;
    dayKey = now;
    $('date').max = now;
    if (wasToday || !$('date').value) $('date').value = now;
    render();
    return true;
  }
  hub.onDay(rollover);
  window.__larder = { render, rollover, today: () => dayKey };   // test hook (scripts/test-leftovers.mjs)

  hub.onChange(refresh);   // someone else logged or finished something: cards update where they stand
  render();
  // The first pull has answered on this device: paint the real list, and log an entry that was waiting for it.
  hub.loaded().then(() => { rollover(); render(); if (held) submit(); });
})();
</script>
</body>
</html>
