<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Larder Ledger</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: #F6F3EC; color: #2A2E28;
         font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
         padding: 32px max(16px, env(safe-area-inset-right)) max(64px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  .sans { font-family: system-ui, -apple-system, sans-serif; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .tally { font-family: 'Courier New', monospace; font-size: 12px; color: #8A8574;
           letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .lede { color: #6B6555; font-size: 14px; margin: 0 0 6px; }
  .mode { font-size: 12px; color: #A8A290; margin: 0 0 24px; }
  .mode[hidden] { display: none; }
  .mode.warn { color: #8A5A16; }
  .spacer { height: 18px; }

  .alert { display: flex; align-items: center; gap: 8px; background: #FBE7E3; color: #8A3327;
           padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; }

  form { background: #fff; border: 1px solid #E3DECF; border-radius: 14px; padding: 18px;
         margin-bottom: 28px; display: grid; gap: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select, button { font-family: inherit; }
  #name { border: none; border-bottom: 2px solid #E3DECF; padding: 14px 2px; font-size: 17px;
          outline: none; background: transparent; color: #2A2E28; min-height: 56px; width: 100%; }
  #name:focus { border-bottom-color: #3D5A3D; }
  #name::placeholder { color: #A8A290; }
  select, #date { border: 1px solid #E3DECF; border-radius: 8px; padding: 10px 12px; font-size: 16px;
                  background: #FBF9F4; color: #2A2E28; min-height: 56px; width: 100%; }
  .log { display: flex; align-items: center; justify-content: center; gap: 8px; background: #3D5A3D;
         color: #F6F3EC; border: none; border-radius: 8px; min-height: 60px; font-size: 17px; font-weight: 600; }
  .log:active { background: #32492F; }
  .err { color: #B14B3F; font-size: 12px; }

  .list { display: grid; gap: 10px; }
  .card { display: flex; align-items: stretch; background: #fff; border: 1px solid #E3DECF;
          border-radius: 12px; overflow: hidden; }
  .bar { width: 5px; flex: none; background: var(--bar); }
  .body { flex: 1; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  .nm { font-size: 16px; font-weight: 600; }
  .meta { font-size: 12.5px; color: #8A8574; margin-top: 3px; }
  .right { display: flex; align-items: center; gap: 10px; flex: none; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px;
          background: var(--chip); color: var(--chip-text); white-space: nowrap; }
  .done { border: 1px solid #D8D2C0; background: #FBF9F4; border-radius: 10px; width: 52px; height: 52px;
          display: flex; align-items: center; justify-content: center; color: #3D5A3D; flex: none; }
  .done:active { background: #EFEADC; }

  .empty { text-align: center; padding: 48px 0; color: #8A8574; }
  .empty p { margin: 0; }
  .empty svg { margin-bottom: 10px; opacity: .5; }

  .hearth { margin-top: 32px; padding-top: 20px; border-top: 1px solid #E3DECF; }
  .hearth p { font-size: 13px; color: #6B6555; margin: 0 0 12px; }
  .copy { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #D8D2C0; background: #FBF9F4;
          border-radius: 8px; padding: 0 18px; min-height: 52px; font-size: 14px; color: #2A2E28; }
  .copy:active { background: #EFEADC; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>The Larder Ledger</h1>
    <span class="tally" id="tally"></span>
  </div>
  <p class="lede">Log it when you put it away. Cross it off when it's gone.</p>
  <p class="mode sans" id="mode" hidden></p>

  <div id="alert"></div>

  <form id="add" class="sans">
    <input id="name" placeholder="What is it? e.g. Chicken alfredo" autocomplete="off" enterkeyhint="done">
    <div class="pair">
      <select id="size" aria-label="Container size"></select>
      <input type="date" id="date" aria-label="Date logged">
    </div>
    <button type="submit" class="log"></button>
    <span class="err" id="err" hidden></span>
  </form>

  <div id="list" class="sans"></div>

  <div class="hearth sans">
    <p>Want this week's warnings on the Hearth wall display? Copy the list below and tell Claude
       "push my leftovers to Hearth" — it'll add them straight to the Hearth Calendar.</p>
    <button type="button" class="copy" id="copy"></button>
  </div>
</div>

<script>
  // Paste the Worker URL here to share one list across the house.
  // Leave it empty and the app just saves to this device.
  const API = '';

  const POLL_MS = 20000;
  const KEY = 'leftovers.items';
  const SIZES = ['Small', 'Medium', 'Large', 'Family-size'];
  const WARN_DAYS = 7, AGING_DAYS = 4;

  const TONES = {
    fresh:  { bar: '#5C7A5C', chip: '#EAF1E7', chipText: '#3D5A3D' },
    warn:   { bar: '#C98A2E', chip: '#FBF0DC', chipText: '#8A5A16' },
    urgent: { bar: '#B14B3F', chip: '#FBE7E3', chipText: '#8A3327' },
  };

  // Lucide glyphs, inlined — no icon library on a static host.
  const ICON = {
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    utensils: '<path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/><path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/><path d="M2.1 21.8 13 11"/><path d="m9 11 3 3"/>',
  };
  function svg(name, size, stroke) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', stroke || 2); s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICON[name];
    return s;
  }

  // localStorage is the offline cache when API is set, and the only store when it isn't.
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch { return []; } };
  const cache = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} };

  async function api(path, opts) {
    const r = await fetch(API.replace(/\/$/, '') + path,
      Object.assign({ headers: { 'Content-Type': 'application/json' }, cache: 'no-store' }, opts));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d || !Array.isArray(d.items)) throw new Error('Bad response');
    return d.items;
  }

  const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const daysBetween = s => { const then = new Date(s + 'T00:00:00'); const now = new Date(); now.setHours(0, 0, 0, 0); return Math.floor((now - then) / 86400000); };
  const statusFor = d => d >= WARN_DAYS ? { label: 'Use it up', tone: 'urgent' }
                       : d >= AGING_DAYS ? { label: 'Aging', tone: 'warn' }
                       : { label: 'Fresh', tone: 'fresh' };

  let items = load();

  const $ = id => document.getElementById(id);
  const errEl = $('err'), listEl = $('list'), alertEl = $('alert'), tallyEl = $('tally'), modeEl = $('mode');
  const setErr = m => { errEl.textContent = m; errEl.hidden = !m; };

  // Only speak up when sync ISN'T working — silence means the house list is fine.
  function setMode(state) {
    if (!API) { modeEl.textContent = 'Saved on this iPad only.'; modeEl.className = 'mode sans'; modeEl.hidden = false; }
    else if (state === 'offline') { modeEl.textContent = "Can't reach the house list — showing the last copy saved here."; modeEl.className = 'mode sans warn'; modeEl.hidden = false; }
    else { modeEl.hidden = true; }
  }

  SIZES.forEach(s => { const o = document.createElement('option'); o.value = o.textContent = s; $('size').append(o); });
  $('size').value = SIZES[1];
  $('date').value = todayStr();
  $('date').max = todayStr();

  const logBtn = document.querySelector('.log');
  logBtn.textContent = '';
  logBtn.append(svg('plus', 18), document.createTextNode(' Log leftover'));

  function render() {
    const sorted = [...items].sort((a, b) => daysBetween(b.dateLogged) - daysBetween(a.dateLogged));
    tallyEl.textContent = sorted.length + ' in the fridge';

    const warnCount = sorted.filter(i => daysBetween(i.dateLogged) >= WARN_DAYS).length;
    alertEl.textContent = '';
    if (warnCount) {
      const d = document.createElement('div');
      d.className = 'alert sans';
      d.append(svg('alert', 16, 2.2),
        document.createTextNode(warnCount + ' item' + (warnCount > 1 ? 's' : '') + ' at a week or older'));
      alertEl.append(d);
    }

    listEl.textContent = '';
    if (!sorted.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      const p = document.createElement('p');
      p.textContent = 'Nothing logged yet.';
      e.append(svg('utensils', 28), p);
      listEl.append(e);
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'list';
    for (const it of sorted) {
      const days = daysBetween(it.dateLogged);
      const { label, tone } = statusFor(days);
      const t = TONES[tone];

      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--bar', t.bar);
      card.style.setProperty('--chip', t.chip);
      card.style.setProperty('--chip-text', t.chipText);

      const bar = document.createElement('div'); bar.className = 'bar';

      const body = document.createElement('div'); body.className = 'body';
      const info = document.createElement('div');
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = it.size + ' · logged ' + it.dateLogged + ' · ' + days + 'd ago';
      info.append(nm, meta);

      const right = document.createElement('div'); right.className = 'right';
      const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = label;
      const done = document.createElement('button');
      done.type = 'button'; done.className = 'done';
      done.title = 'Mark used up';
      done.setAttribute('aria-label', 'Mark ' + it.name + ' used up');
      done.append(svg('check', 18, 2.4));
      done.onclick = () => removeItem(it.id);
      right.append(chip, done);

      body.append(info, right);
      card.append(bar, body);
      grid.append(card);
    }
    listEl.append(grid);
  }

  $('add').onsubmit = async e => {
    e.preventDefault();
    const name = $('name').value.trim();
    if (!name) return;
    const item = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      name, size: $('size').value, dateLogged: $('date').value || todayStr(),
    };

    $('name').value = ''; $('name').blur();
    $('size').value = SIZES[1];
    $('date').value = todayStr();

    items.push(item); cache(); render();          // show it straight away
    if (!API) return;
    try {
      items = await api('/items', { method: 'POST', body: JSON.stringify(item) });
      cache(); render(); setErr(''); setMode('ok');
    } catch {
      items = items.filter(i => i.id !== item.id); cache(); render();
      setErr("Couldn't save — try again.");
    }
  };

  async function removeItem(id) {
    const prev = items;
    items = items.filter(x => x.id !== id); cache(); render();
    if (!API) return;
    try {
      items = await api('/items/' + encodeURIComponent(id), { method: 'DELETE' });
      cache(); render(); setErr(''); setMode('ok');
    } catch {
      items = prev; cache(); render();
      setErr("Couldn't remove — try again.");
    }
  }

  async function refresh() {
    if (!API) return;
    try { items = await api('/items'); cache(); render(); setMode('ok'); }
    catch { setMode('offline'); }
  }

  function buildHearthText() {
    const due = [...items].sort((a, b) => daysBetween(b.dateLogged) - daysBetween(a.dateLogged))
      .filter(i => daysBetween(i.dateLogged) >= AGING_DAYS);
    if (!due.length) return "Nothing aging right now — fridge's in good shape.";
    const lines = due.map(i => {
      const d = daysBetween(i.dateLogged);
      return `• ${i.name} (${i.size}) — logged ${d}d ago, ${d >= WARN_DAYS ? 'use it up' : 'eat soon'}`;
    });
    return 'Push these to the Hearth Calendar:\n' + lines.join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    try { // Safari in an iframe can refuse the async API; fall back to a selection copy.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }

  const copyBtn = $('copy');
  function setCopy(state) {
    copyBtn.textContent = '';
    copyBtn.append(svg('refresh', 15), document.createTextNode(
      state === 'copied' ? ' Copied!' : state === 'failed' ? ' Copy failed — select manually' : ' Copy list for Hearth'));
  }
  copyBtn.onclick = async () => {
    setCopy(await copyText(buildHearthText()) ? 'copied' : 'failed');
    setTimeout(() => setCopy('idle'), 2000);
  };
  setCopy('idle');

  // "Nd ago" rolls over at midnight; re-render even with no new data.
  setInterval(render, 60000);
  // Pick up what everyone else logged.
  if (API) setInterval(refresh, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); refresh(); } });

  setMode('ok');
  render();      // paint the cached list immediately, then reconcile with the house
  refresh();
</script>
</body>
</html>
