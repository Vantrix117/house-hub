<title>The Larder Ledger</title>
<link rel="stylesheet" href="design.css">
<style>
  /* The ledger keeps its own component CSS and takes every colour, size, space and duration from design.css role tokens
     (audit batch 1, CONS-TOK-1; batch 8, CONS-SHAPE-3 / GAP-TOK-4: no px spacing). Meaning is semantic: the freshness ramp is
     --fresh / --aging / --use-soon (graphics) and the chips are success / warning / danger fill with their -ink label; the
     person's colour is the Log button, the mic and the little face on every card (CONS-ACCENT-4, VIS-LEFTOVERS-4). Nothing
     here keys off a colour scheme. Layout is list-first: the grouped list reads top-down, oldest first, and the add bar is a
     glass pane fixed above the safe area; the page's bottom padding is that bar's measured height (VIS-LEFTOVERS-6).
     Recorded exceptions (GAP-TOK-4): --addbar-h's first guess, the skeleton's two opacities, saturate(0) on a finished card. */
  :root { --addbar-h: 150px; }   /* layout plumbing: the add bar's measured height (set by the script below) */
  /* anything scrolled into view (a focused card, the copy box, a new card) stops above the add bar, never under it */
  html { scroll-padding-bottom: calc(var(--addbar-h) + max(var(--sp-3), var(--safe-bottom)) + var(--sp-4)); }
  :root[data-kind="kid"], :root[data-kind="kiosk"] { scroll-padding-bottom: 0; }
  body { min-height: 100vh; font-family: var(--font-ui);
         padding: var(--sp-8) max(var(--margin), var(--safe-right)) calc(var(--addbar-h) + max(var(--sp-3), var(--safe-bottom)) + var(--sp-4)) max(var(--margin), var(--safe-left)); }
  :root[data-kind="kiosk"] body { padding-bottom: max(var(--sp-16), var(--safe-bottom)); }
  .wrap { max-width: var(--col-narrow); margin: 0 auto; }   /* CONS-SHAPE-2: the forms-and-lists column (560) */
  .sans { font-family: var(--font-ui); }

  /* type: every size is a role, so the iPad tier, the person's text size and the kid scale reach the Larder */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-1); }
  h1 { font-size: var(--fs-large-title); font-weight: var(--fw-large-title); line-height: var(--lh-large-title); letter-spacing: var(--ls-large-title); margin: 0; }
  /* inside the hub the viewer bar already names the app (CONS-TYPE-1): html.framed is set before first paint; the h1 stays for screen readers */
  .framed h1 { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  /* the subtitle's row: the count sits on it, and its space is held from the first paint (nothing moves when the count lands) */
  .sub { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--sp-1) var(--sp-3); margin: 0 0 var(--sp-2); }
  .sub .lede { flex: 1 1 20em; margin: 0; }
  .tally { margin-left: auto; display: inline-block; min-width: 9em; min-height: calc(var(--fs-caption1) * var(--lh-caption1)); text-align: right; font-family: var(--font-mono); font-size: var(--fs-caption1); color: var(--text-3); letter-spacing: var(--ls-caps); text-transform: uppercase; white-space: nowrap; }
  .lede { color: var(--text-2); font-size: var(--fs-subheadline); margin: 0 0 var(--sp-2); }

  /* the sync notice (UX-LEFTOVERS-8): plain words, and Retry when there is something to retry */
  .mode { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-footnote); color: var(--text-3); margin: 0 0 var(--sp-4); }
  .mode[hidden] { display: none; }
  .mode.warn { font-size: var(--fs-subheadline); color: var(--warning-ink); background: var(--warning-fill); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-control); }
  .retry { flex: none; min-height: var(--tap); padding: 0 var(--sp-4); border: 0; border-radius: var(--r-control); background: var(--warning-strong); color: var(--warning-on);
           font: inherit; font-size: var(--fs-subheadline); font-weight: var(--fw-semibold); cursor: pointer; }

  /* the banner: names the oldest item, and a tap goes to its card (UX-LEFTOVERS-9) */
  .alert { display: flex; align-items: center; gap: var(--sp-2); width: 100%; text-align: left; background: var(--danger-fill); color: var(--danger-ink);
           min-height: var(--tap); padding: var(--sp-3) var(--sp-4); border: 0; border-radius: var(--r-control); font: inherit; font-size: var(--fs-subheadline);
           font-weight: var(--fw-semibold); margin: 0 0 var(--sp-4); cursor: pointer; }
  .alert .alert-text { flex: 1; min-width: 0; }
  /* the card the banner points at: a static ring (no motion to reduce), taken off by the script after a moment */
  .item.hl { box-shadow: 0 0 0 var(--focus-ring-w, 3px) var(--danger-graphic), var(--elev-card); }
  .item { transition: box-shadow var(--dur-slow) var(--ease-standard); }
  .item, .skel { container-type: inline-size; }   /* a card knows its own width: from 480 px the chip sits beside the check button (shorter cards) */

  /* ── the add bar: one glass pane over the list, the house recipe from the tokens (CONS-GLASS-1). Its corner is concentric
        with its fields: radius = the field's + the padding (VIS-SHAPE-1). Solid glass (Reduce Transparency) makes it opaque. ── */
  form[id="add"] { position: fixed; z-index: var(--z-bar);
         left: max(var(--sp-3), var(--safe-left)); right: max(var(--sp-3), var(--safe-right)); bottom: max(var(--sp-3), var(--safe-bottom));
         max-width: var(--col-narrow); margin: 0 auto;
         background: var(--glass-bg-strong-tinted);
         border: 1px solid var(--glass-edge); border-radius: var(--r-card); padding: var(--pad-card);
         box-shadow: var(--glass-shadow);
         -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
         display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }   /* minmax(0,…): rows shrink instead of overflowing on a narrow phone */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { form[id="add"] { background: var(--glass-strong-solid); } }
  .namerow { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
  /* fields: a >= 3:1 boundary and the house placeholder ink (P4-COLOR-05), never under 16 px so iOS does not zoom (P4-TELL-02);
     one recipe for the name, the size and the date (VIS-LEFTOVERS-5: no native grey) */
  #name, form[id="add"] select, #date { border: 1px solid var(--field-border); border-radius: var(--r-control); padding: 0 var(--sp-4); font: inherit; font-size: var(--fs-field);
          background-color: var(--surface); color: var(--text); min-height: var(--tap-row); box-shadow: inset 0 1px 2px var(--shade-1); width: 100%; min-width: 0;
          -webkit-appearance: none; appearance: none; text-align: left; }
  #name { flex: 1; width: auto; }
  #name:focus, #name:focus-visible, form[id="add"] select:focus-visible, #date:focus-visible { outline: none; border-color: var(--focus-ring-color); box-shadow: var(--focus-ring); }
  form[id="add"] select { padding-right: var(--sp-10);
          background-image: linear-gradient(45deg, transparent 50%, var(--chevron-colour) 50%), linear-gradient(135deg, var(--chevron-colour) 50%, transparent 50%);
          background-size: var(--sp-2) var(--sp-2), var(--sp-2) var(--sp-2); background-repeat: no-repeat;
          background-position: right calc(var(--sp-4) + var(--sp-2)) center, right var(--sp-4) center; }
  #date::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }
  /* at the largest text sizes the name takes its own row, so it never shrinks to a few letters */
  :root:is([data-text-size="xl"], [data-text-size="xxl"]) .namerow { flex-wrap: wrap; }
  :root:is([data-text-size="xl"], [data-text-size="xxl"]) #name { flex: 1 1 100%; }
  :root:is([data-text-size="xl"], [data-text-size="xxl"]) .log { flex: 1; min-height: var(--tap-row); }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-2); min-width: 0; }
  .fielderr { margin: calc(var(--sp-1) * -1) 0 0 var(--sp-1); color: var(--danger-ink); font-size: var(--fs-footnote); font-weight: var(--fw-semibold); }
  /* Log: the house primary, a capsule at --btn-h-lg in the person's own solid (CONS-SHAPE-4, CONS-ACCENT-4); the press is the house .pressable */
  .log { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); background: var(--accent-strong); flex: none;
         color: var(--accent-on); border: none; border-radius: var(--r-button); min-height: var(--btn-h-lg); padding: 0 var(--sp-5);
         font-size: var(--fs-callout); font-weight: var(--fw-semibold); cursor: pointer; }
  /* the mic: its space is held from the first paint (visibility), so the name field never shrinks when it appears (VIS-LEFTOVERS-11);
     where speech is not supported at all the page's first script marks html.nomic and the mic is not laid out */
  .mic { width: var(--tap-row); min-height: var(--tap-row); flex: none; border: 1px solid var(--field-border); border-radius: var(--r-control); background: var(--surface);
         color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .mic.mic-off { visibility: hidden; }
  .nomic .mic { display: none; }
  .mic.on { background: var(--danger-fill); color: var(--danger-ink); border-color: var(--danger-graphic); animation: pulse var(--dur-pulse) infinite; }
  @keyframes pulse { 50% { transform: scale(var(--pulse-scale)); } }   /* --pulse-scale is 1 under Reduce Motion */
  .err { color: var(--danger-ink); font-size: var(--fs-footnote); }
  .wait { color: var(--text-2); font-size: var(--fs-footnote); }

  /* ── loading: until this device has pulled the list once, placeholder cards with the real card's geometry stand in for
        it (never "0" or "Nothing logged"), and what sits below the list waits, so nothing moves when it lands (GAP-MOTION-1) ── */
  .loading { font-size: var(--fs-footnote); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps); text-transform: uppercase; line-height: var(--lh-tight);
             color: var(--text-3); margin: 0 0 var(--sp-2) var(--sp-1); }
  .skel .nm i, .skel .meta i, .skel .right i { display: inline-block; vertical-align: middle; height: .7em; border-radius: var(--r-full); background: var(--surface-2); }
  .skel .nm i { width: 42%; } .skel .meta i { width: 64%; height: .55em; }
  .skel .right .chipph { width: 7.5em; height: calc(var(--fs-caption1) + var(--sp-4)); }
  .skel .right .btnph { width: max(var(--sp-12), var(--tap)); height: max(var(--sp-12), var(--tap)); border-radius: var(--r-control); }
  .skel:nth-child(2) { opacity: .75; } .skel:nth-child(3) { opacity: .5; }
  #list[aria-busy="true"] ~ .donelist, #list[aria-busy="true"] ~ .hearth { display: none; }
  .copy:disabled { opacity: var(--op-disabled); cursor: default; }

  /* ── the grouped list: Use it up · Aging · Fresh, oldest first ── */
  .group { margin-bottom: var(--sp-5); }
  .group h2 { display: flex; align-items: baseline; gap: var(--sp-2); font-size: var(--fs-footnote); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps); text-transform: uppercase;
              color: var(--group-ink); margin: 0 0 var(--sp-2) var(--sp-1); }
  .group h2 small { font-family: var(--font-mono); font-weight: var(--fw-medium); font-size: var(--fs-caption2); color: var(--text-3); letter-spacing: var(--ls-caps); }
  .list { display: grid; gap: var(--sp-3); }
  /* a content card is solid: the house card (CONS-SHAPE-1: --r-card, --material-solid-bg, a hairline, --elev-card). The swipe
     layer (Finish, Some left) sits behind the face, which slides over it (IMP-LEFTOVERS-I1). */
  .item, .skel { position: relative; background: var(--material-solid-bg); border: 1px solid var(--separator); border-radius: var(--r-card);
                 overflow: hidden; box-shadow: var(--elev-card); }
  .swipe-face { position: relative; z-index: var(--z-raised); display: flex; align-items: stretch; background: var(--material-solid-bg);
                transform: translateX(var(--sx, 0px)); transition: transform var(--dur-snappy) var(--spring-snappy); touch-action: pan-y; }
  .item.swiping .swipe-face { transition: none; }
  /* the stripe is an inset pill, concentric with the card's corner */
  .stripe { width: var(--sp-1); flex: none; align-self: stretch; margin: var(--sp-3) 0 var(--sp-3) var(--sp-3); border-radius: var(--r-full); background: var(--tint); }
  .skel .stripe, :root[data-kind="kid"] .skel .pic { background: var(--surface-2); }
  .body { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--pad-card) var(--sp-3) var(--sp-3); }
  .info { flex: 1; min-width: 0; }
  .nm[role="button"] { cursor: pointer; border-radius: var(--r-control); }
  /* the name wraps to two lines (P3-LEFTOVERS-11); the edit sheet shows all of it */
  .nm { font-size: var(--fs-callout); font-weight: var(--fw-semibold); line-height: var(--lh-callout); overflow: hidden; overflow-wrap: break-word;
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  .meta { display: flex; align-items: flex-start; gap: var(--sp-2); font-size: var(--fs-footnote); color: var(--text-3); margin-top: var(--sp-1); }
  .meta .mt { flex: 1; min-width: 0; }
  .useby { display: block; }
  .age { display: none; }
  /* who logged it: the person's own face, in their own colour (VIS-LEFTOVERS-4); design.css's .avatar is scoped to .ds, so the Larder carries its small one */
  .logger { flex: none; display: block; padding: var(--sp-1); margin: calc(var(--sp-1) * -1) 0 calc(var(--sp-1) * -1) calc(var(--sp-1) * -1); }
  .avatar { --size: calc(var(--icon-sm) * var(--ts-user, 1)); width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; overflow: hidden;
            font-size: calc(var(--size) * .56); line-height: 1; background: var(--accent-fill); color: var(--accent-ink);
            box-shadow: 0 0 0 var(--sp-1) var(--material-solid-bg), 0 0 0 calc(var(--sp-1) + 1px) var(--accent-graphic); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  /* "Some left" (IMP-LEFTOVERS-I1): the half circle and the words */
  .portion { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-1); font-size: var(--fs-footnote); font-weight: var(--fw-semibold); color: var(--text-2); }
  /* freshness bar: --fresh / --aging / --use-soon, graphics >= 3:1 against the --surface-2 track in every palette
     (VIS-LEFTOVERS-2; a solid fill, no lighter left end); --p = days/10 */
  .bar { height: var(--sp-2); border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; margin-top: var(--sp-2); max-width: calc(var(--sp-16) * 3); }
  .bar > i { display: block; height: 100%; width: calc(100% * var(--p, 0)); border-radius: inherit;
             background: var(--tint); transition: width var(--dur-progress) var(--spring-gentle); }
  /* the right column: the state chip over the check button (one width, so no card changes size) */
  .right { display: grid; justify-items: center; gap: var(--sp-2); flex: none; }
  @container (min-width: 480px) { :root:not([data-kind="kitchen"]) .right { display: flex; align-items: center; gap: var(--sp-3); } }
  /* the state chip: the state's fill with its -ink label (lifted >= 1.5:1 off the card in the dark palettes, VIS-LEFTOVERS-3)
     and the state's sprite icon, so the three states differ without colour (VIS-LEFTOVERS-2) */
  .status { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1); box-sizing: border-box; min-width: 7.5em;
            font-size: var(--fs-caption1); font-weight: var(--fw-semibold); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-full); background: var(--chip); color: var(--chip-text); white-space: nowrap; }
  /* the check button: a lit control, the success ink glyph on the success fill, never a dark well (VIS-LEFTOVERS-10; the accepted deviation, CONS-ACCENT-4) */
  .done { border: 1px solid transparent; background: var(--success-fill); border-radius: var(--r-control); width: max(var(--sp-12), var(--tap)); height: max(var(--sp-12), var(--tap));

  .copybox-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
  /* a check keeps the card in place for six seconds, struck through, with its own Undo (batch 0h) */
  /* a finishing or finished card reads as past by its ink and its strike-through, never by fading the text (CONS-COLOR-1);
     the picture and the chip lose their colour instead */
  .item.finishing .info, .item.finishing .info *, .item.gone .info, .item.gone .info * { color: var(--text-3); }
  .item.finishing .pic, .item.gone .pic, .item.gone .status { filter: saturate(0); }
  .item.finishing .nm, .item.gone .nm { text-decoration: line-through; }
  /* a finished card settles in place (a short fade on the motion tokens, 150 ms under Reduce Motion); it keeps its box (P3-LEFTOVERS-12) */
  .item.gone .swipe-face { animation: settle var(--dur-gentle) var(--spring-gentle) both; }
  @keyframes settle { from { opacity: 1; } to { opacity: .72; } }
  .undo { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-control); width: max(var(--sp-12), var(--tap)); height: max(var(--sp-12), var(--tap)); padding: 0;
          font: inherit; font-size: var(--fs-footnote); font-weight: var(--fw-bold); color: var(--success-ink); cursor: pointer; flex: none; }
  .slot { width: max(var(--sp-12), var(--tap)); height: max(var(--sp-12), var(--tap)); flex: none; }
  /* swipe to finish (IMP-LEFTOVERS-I1): the layer behind the face, trailing side */
  .swipe-act { position: absolute; z-index: 0; top: 0; bottom: 0; right: 0; display: flex; width: var(--swipe-w, calc(var(--tap-lg) * 2.6)); visibility: hidden; }
  .item.swiping .swipe-act, .item.swipe-open .swipe-act { visibility: visible; }
  .swipe-act button { flex: 1; min-width: 0; display: grid; place-content: center; justify-items: center; gap: var(--sp-1); border: 0; padding: 0 var(--sp-2); font: inherit;
          font-size: var(--fs-footnote); font-weight: var(--fw-semibold); cursor: pointer; }
  .sw-some { background: var(--warning-strong); color: var(--warning-on); }
  .sw-fin { background: var(--success-strong); color: var(--success-on); }

  // Friendly dates (VIS-LEFTOVERS-5): "Mon 14 Sep", with the year only when it is not this year.

  function friendlyDate(iso) {

  function itemCard(it, gone = false) {

    const info = document.createElement('div'); info.className = 'info';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
    const meta = document.createElement('div'); meta.className = 'meta';
    const mt = document.createElement('span'); mt.className = 'mt';
    if (hub.isKid) mt.textContent = days === Infinity ? 'Date unknown' : days <= 0 ? 'Put in today' : days + (days === 1 ? ' day' : ' days') + ' in the fridge';
    else {
      const mtext = metaText(it, f), tail = f.days === Infinity ? '' : ' · ' + f.age, at = tail ? mtext.indexOf(tail) : -1;
      if (at >= 0) { mt.append(document.createTextNode(mtext.slice(0, at))); const ma = document.createElement('span'); ma.className = 'mage'; ma.textContent = tail; mt.append(ma, document.createTextNode(mtext.slice(at + tail.length))); }   // the age is its own span: the Kitchen shows it once, large

    info.append(nm);

    }

  // an empty Log says what is missing and puts the cursor there (UX-LEFTOVERS-5)
  function nameErr(on) { const e = $('name-err'), n = $('name'); e.hidden = !on; if (on) { n.setAttribute('aria-invalid', 'true'); n.setAttribute('aria-describedby', 'name-err'); n.focus(); } else { n.removeAttribute('aria-invalid'); n.removeAttribute('aria-describedby'); } }

  // An entry made before the list has loaded is held (the name stays in the box) and logged once it has.
  let held = !!window.__larderHeld;
  function submit() {
    const name = $('name').value.trim();
    if (!name) { held = false; setWait(''); nameErr(true); return; }   // "Type what it is" under the field, focus on it
    if (!canEdit) { held = false; setWait(''); hub.kioskNudge(); setErr('This profile can only look at the list.'); return; }
    if (!hub.isLoaded()) { held = true; setErr(''); setWait('Logging “' + name + '” as soon as the list has loaded…'); return; }
    held = false; setWait('');

    const item = {
      id: hub.uid(), name, size: $('size').value, dateLogged: isDay($('date').value) && $('date').value <= dayKey ? $('date').value : dayKey,
      by: hub.profile.id, byName: hub.profile.name,

  function removeItem(id, who) {                                  // who: the face tapped on the kitchen (else the person signed in)

  // ── finishing: the check button and the swipe are one path (batch 8, IMP-LEFTOVERS-I1) ──

  async function finishFlow(it) {

    // KITCHEN-2: on the kitchen device the face sheet first (household adults only, P5-D2); the finish is theirs
    if (hub.isKitchen && hub.whoDidThis) { const q = await hub.whoDidThis({ who: 'adults', title: 'Who finished it?', message: it.name }); if (!q) return false; removeItem(it.id, q); return true; }

  // ── a card shown to the eye on purpose: the banner's tap and a fresh Log (UX-LEFTOVERS-6, -9) ──

  // ── "some left" (IMP-LEFTOVERS-I1): portion: 'some' on the row; an old row has none and means full ──
  function setPortion(id, on) {

    try { hub.set('item:' + id, next); } catch { return; }

    // Undo puts the row back as it was, unless something has changed it since

      if (cur && (cur.portion === 'some') === !!on) {

    } });
  }

  // ── the edit sheet (GAP-LEFTOVERS-1, P3-LEFTOVERS-11): name, size, the date it was made or logged, an optional use-by ──
  // Save keeps who logged it (by, byName) and adds editedBy / editedAt; an edit posts no feed line. Enter saves, Escape closes.

  const editWrap = $('editwrap'), eName = $('e-name'), eNameErr = $('e-name-err'), eSome = $('e-some');

  function openEdit(id) {

    editing = { id, opener: document.activeElement, some: it.portion === 'some' };

    // what the sheet showed when it opened: Save writes only the fields changed from this, onto the row as it is by then (review P2)
    editing.snap = { name: String(it.name || '').trim(), size: SIZES.includes(it.size) ? it.size : SIZES[1], date: isDay(it.dateLogged) ? it.dateLogged : dayKey, useBy: isDay(it.useBy) ? it.useBy : '', some: it.portion === 'some' };

  const pullBounded = () => Promise.race([Promise.resolve().then(() => hub.pull()).catch(() => {}), new Promise(r => setTimeout(r, 2000))]);
  async function saveEdit() {

    const cur = hub.get('item:' + id);
    if (!cur || pending.has(id)) { hub.toast('That one was finished on another device, so nothing was saved.'); refresh(); return; }
    const next = { ...cur, editedBy: hub.profile.id, editedByName: hub.profile.name, editedAt: hub.serverNow ? hub.serverNow() : Date.now() };
    if (chg.name) next.name = form.name;
    if (chg.size) next.size = form.size;
    if (chg.date) next.dateLogged = form.date > dayKey ? dayKey : form.date;
    if (chg.useBy) { if (form.useBy) next.useBy = form.useBy; else delete next.useBy; }
    if (chg.some) { if (form.some) next.portion = 'some'; else delete next.portion; }
    try { hub.set('item:' + id, next); } catch { return; }       // the SDK's toast has said why
    hub.toast('Saved ' + next.name, 2200);
    render(); revealAboveBar(id);                                 // this device's own change: the list is laid out afresh, like Log
    const back = cardOf(id) && cardOf(id).querySelector('.nm[role="button"]'); if (back && back.focus) back.focus({ preventScroll: true });   // the keyboard stays where it was (review P6)
  }
  $('e-save').onclick = saveEdit; $('e-cancel').onclick = closeEdit;
  $('editbd').addEventListener('click', e => { if (e.target === e.currentTarget) closeEdit(); });
  eName.addEventListener('input', () => { growName(); eNameErr.hidden = true; eName.removeAttribute('aria-invalid'); });
  $('e-useby-clear').onclick = () => { $('e-useby').value = ''; $('e-useby').focus(); };
  eSome.onclick = () => setSome(!(editing && editing.some));
  editWrap.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeEdit(); return; }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('input, select, textarea') && !e.shiftKey) { e.preventDefault(); saveEdit(); return; }
    if (e.key === 'Tab') {                                        // the focus stays in the sheet
      const f = [...editWrap.querySelectorAll('input, select, textarea, button')].filter(x => !x.disabled && x.getClientRects().length);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  window.__larderEdit = openEdit;                                 // E's card calls this on a tap

  // ── swipe to finish (IMP-LEFTOVERS-I1): an iOS-style trailing swipe reveals Some left and Finish; a full swipe finishes ──
  // Pointer events; the horizontal intent is decided after 10 px, so a vertical drag is the page's scroll and never breaks
  // (touch-action: pan-y hands vertical pans to the browser). The card face moves with --sx on the card (E's CSS reads it).
  // A full swipe goes through finishFlow, the check button's own path (six seconds, Undo; on the Kitchen iPad the face sheet).
  let openSwipe = null;
  document.addEventListener('pointerdown', e => {
    if (!openSwipe || e.target.closest('.swipe-act')) return;       // a tap on Some left / Finish is theirs
    const c = openSwipe;
    if (c.contains(e.target)) { c.dataset.swiped = '1'; setTimeout(() => { delete c.dataset.swiped; }, 350); }   // a tap on the open card only closes it: its click opens no sheet (review P7)
    c._swipeClose();
  }, true);
  addEventListener('scroll', () => { if (openSwipe) openSwipe._swipeClose(); }, { passive: true });
  function attachSwipe(card, it) {
    const act = card.querySelector('.swipe-act'); if (!act) return;
    card.style.touchAction = 'pan-y';
    const reveal = () => Math.ceil(act.getBoundingClientRect().width) || 176;
    const setX = x => card.style.setProperty('--sx', Math.round(x) + 'px');
    const open = on => {
      card.classList.toggle('swipe-open', on); act.setAttribute('aria-hidden', on ? 'false' : 'true');
      for (const b of act.querySelectorAll('button')) b.tabIndex = on ? 0 : -1;
      setX(on ? -reveal() : 0);
      if (on) openSwipe = card; else if (openSwipe === card) openSwipe = null;
    };
    card._swipeClose = () => open(false);
    let st = null;
    card.addEventListener('pointerdown', e => {
      if ((e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('.swipe-act')) return;
      st = { id: e.pointerId, x: e.clientX, y: e.clientY, base: card.classList.contains('swipe-open') ? -reveal() : 0, w: reveal(), mode: null };
    });
    card.addEventListener('pointermove', e => {
      if (!st || e.pointerId !== st.id) return;
      const dx = e.clientX - st.x, dy = e.clientY - st.y;
      if (!st.mode) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        st.mode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        if (st.mode === 'h') { try { card.setPointerCapture(e.pointerId); } catch {} card.classList.add('swiping'); try { getSelection().removeAllRanges(); } catch {} }
      }
      if (st.mode !== 'h') return;
      if (e.cancelable) e.preventDefault();
      setX(Math.max(-card.getBoundingClientRect().width, Math.min(0, st.base + dx)));
    });
    const end = (e, cancelled) => {
      if (!st || e.pointerId !== st.id) return;
      const s = st; st = null;
      if (!s.mode) return;                                        // a tap: the card's own click opens the sheet
      card.dataset.swiped = '1'; setTimeout(() => { delete card.dataset.swiped; }, 350);   // the click that ends a drag, sideways or a scroll, opens nothing
      if (s.mode !== 'h') return;                                 // a vertical scroll: nothing to settle
      card.classList.remove('swiping');
      const x = parseFloat(card.style.getPropertyValue('--sx')) || 0;
      if (cancelled) { open(card.classList.contains('swipe-open')); return; }
      if (x <= -card.getBoundingClientRect().width * 0.6) { open(false); finishFlow(it); return; }   // a full swipe finishes
      open(x <= -s.w * 0.5);
    };
    card.addEventListener('pointerup', e => end(e, false));
    card.addEventListener('pointercancel', e => end(e, true));
    const fin = act.querySelector('.sw-fin'), some = act.querySelector('.sw-some');
    if (fin) fin.onclick = () => { open(false); finishFlow(it); };
    if (some) some.onclick = () => { open(false); const cur = hub.get('item:' + it.id) || it; setPortion(it.id, cur.portion !== 'some'); };
  }

  // Leaving the page finishes what is finishing (the queue sends it as usual).
  const commitAll = () => { for (const id of [...pending.keys()]) commitFinish(id); };
  if (typeof hub.onLeave === 'function') hub.onLeave(commitAll); else addEventListener('pagehide', commitAll);
  // hidden (the app put in the background, the phone locked): finish now and send while the page is still alive
  document.addEventListener('visibilitychange', () => { if (document.hidden && pending.size) { commitAll(); if (hub.flush) hub.flush().catch(() => {}); } });
  addEventListener('pageshow', e => { if (e.persisted) render(); });
  // back in view: nothing is being aimed at yet, so the list is laid out afresh (finished cards go, new ones take their place)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  // Recently finished: the last seven days' finished items, each with Put back (adults); older ones are cleared.
  // Recently finished follows the list's rule: laid out (newest first) with the list; between layouts a row never moves —
  // a row whose item is back in the fridge is dimmed with its button hidden (its place kept), a newly finished item is
  // added at the end, and only the count in the heading changes.
  function doneRow(v, back) {
    const row = document.createElement('div'); row.className = 'row' + (back ? ' back' : ''); row.dataset.id = v.id;
    const t = document.createElement('div'); t.className = 't'; t.textContent = v.name;
    const small = document.createElement('small');
    small.textContent = (v.size ? v.size + ' · ' : '') + 'logged ' + (friendlyDate(v.dateLogged) || v.dateLogged) + ' · finished ' + (v.finishedAt === dayKey ? 'today' : friendlyDate(v.finishedAt) || v.finishedAt) + (v.finishedByName ? ' · ' + v.finishedByName : '');
    t.append(small); row.append(t);
    if (canEdit && back) {                                              // the same box as the button, so the row keeps its size
      const tag = document.createElement('span'); tag.className = 'putback tag'; tag.textContent = 'Back';   // text only: the check is the finish action's alone
      tag.setAttribute('aria-label', v.name + ' is back in the fridge');
      row.append(tag);
    } else if (canEdit) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'putback pressable'; b.textContent = 'Put back';
      b.setAttribute('aria-label', 'Put ' + v.name + ' back in the fridge');
      b.onclick = () => putBack(v);
      row.append(b);
    }
    row.dataset.sig = JSON.stringify([v.name, v.size, v.dateLogged, v.finishedAt, v.finishedByName, back]);
    return row;
  }
  function renderDone(full = true) {
    const el = $('donelist'); if (!el) return;
    const rows = hub.list('finished:').map(r => r.value).filter(v => v && v.id && v.name);
    const fresh = hub.sync && hub.sync.lastPull && hub.sync.lastPull >= OPENED;   // an old cache must not erase a newer row
    if (canEdit && fresh && full) for (const v of rows) if (hub.daysBetween(String(v.finishedAt || dayKey), dayKey) > KEEP_DAYS) { try { hub.remove('finished:' + v.id); } catch {} }
    const inWeek = v => hub.daysBetween(String(v.finishedAt || dayKey), dayKey) <= KEEP_DAYS;
    const recent = rows.filter(v => inWeek(v) && !hub.get('item:' + v.id)).sort((a, b) => String(b.finishedAt).localeCompare(String(a.finishedAt)));
    const det = el.querySelector('details');
    if (!full && det) {                                                 // in place
      const byId = new Map(rows.map(v => [v.id, v]));
      for (const row of [...det.querySelectorAll('.row')]) {
        const v = byId.get(row.dataset.id); if (!v) continue;
        const next = doneRow(v, !!hub.get('item:' + v.id));
        if (next.dataset.sig === row.dataset.sig) continue;
        const hadFocus = row.contains(document.activeElement);
        row.replaceWith(next);
        if (hadFocus) { const b = next.querySelector('button.putback') || [...det.querySelectorAll('button.putback')].find(x => next.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING); if (b) b.focus(); }
      }
      const have = new Set([...det.querySelectorAll('.row')].map(r => r.dataset.id));
      for (const v of recent) if (!have.has(v.id)) det.append(doneRow(v, false));
      det.querySelector('summary').textContent = 'Recently finished · ' + recent.length;
      return;
    }
    const open = det && det.open;
    el.textContent = '';
    if (!recent.length) return;
    const d = document.createElement('details'); d.open = !!open;
    const sm = document.createElement('summary'); sm.textContent = 'Recently finished · ' + recent.length;
    d.append(sm);
    for (const v of recent) d.append(doneRow(v, false));
    el.append(d);
  }
  function putBack(v) {
    const p = pending.get(v.id); if (p) { clearTimeout(p.t); pending.delete(v.id); }
    // the kitchen may credit only a current household member under their current name (the house refuses anything else)
    let by = v.loggedBy, byName = v.loggedByName;
    if (hub.profile && hub.profile.kind === 'kitchen') {
      const q = (hub.people ? hub.people() : []).find(x => x && x.id === by);
      const ok = by === hub.profile.id || (q && !q.is_guest && !q.isGuest && q.kind === 'adult' && q.name === byName);
      if (!ok) { by = undefined; byName = undefined; }
    }
    // a date the house refuses (from before batch 0i) comes back as the day it was finished, or today
    const item = { id: v.id, name: v.name, size: v.size, dateLogged: isDay(v.dateLogged) && v.dateLogged <= dayKey ? v.dateLogged : (isDay(v.finishedAt) ? v.finishedAt : dayKey) }; if (by) { item.by = by; item.byName = byName; }
    if (isDay(v.useBy)) item.useBy = v.useBy; if (v.portion === 'some') item.portion = 'some';   // what an edit had set comes back with it
    try { hub.set('item:' + v.id, item); } catch { return; }
    hub.activity('Put the ' + v.name + ' back in the fridge');
    render();
  }

  // Voice: tap, say the name, it lands in the box.
  const mic = $('mic');
  if (hub.voiceSupported && canEdit) {
    mic.classList.remove('mic-off');   // its space was held from the first paint
    let rec = null;
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = hub.voiceInput(text => { $('name').value = text; $('name').focus(); }, {
        onEnd: () => { rec = null; mic.classList.remove('on'); },
        onError: () => { rec = null; mic.classList.remove('on'); setErr("Couldn't hear that — try again or type it."); },
      });
      if (rec) { mic.classList.add('on'); setErr(''); }
    };
  }

  // The list to paste anywhere (a message, a note, Hearth): what to eat soon or use up, in the Larder's words. It makes no claim that
  // the hub's assistant can send it anywhere (UX-LEFTOVERS-4).
  function buildListText() {
    const { due } = hub.larder.due(items(), dayKey);
    if (!due.length) return "Nothing to eat soon or use up — the fridge is in good shape.";
    return 'Leftovers to eat soon or use up:\n' + due.map(({ it, f }) => '• ' + it.name + ' (' + it.size + ') — ' + (f.label === 'Check date' ? 'check the date' : f.label.toLowerCase() + ', ' + (f.useBy ? f.when : 'logged ' + f.age + ' ago')) + (it.portion === 'some' ? ', some left' : '')).join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    try { // Safari in an iframe can refuse the async API; fall back to a selection copy.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }

  const copyBtn = $('copy'), copyBox = $('copybox'), copyTa = $('copytext');
  function setCopy(state) {
    copyBtn.textContent = '';
    copyBtn.append(sym('copy'), document.createTextNode(
      state === 'copied' ? ' Copied!' : state === 'failed' ? " Couldn't copy here" : ' Copy the list'));
  }
  // When the clipboard is refused (an iframe in Safari, an old browser) the text is shown, selected, in a read-only box, with
  // Select and copy, and Share where the device has it (P3-LEFTOVERS-10): never an instruction the page makes impossible
  function showCopyBox(text) {
    copyTa.value = text; copyBox.hidden = false; $('copyshare').hidden = typeof navigator.share !== 'function';
    copyTa.focus({ preventScroll: true }); copyTa.select(); try { copyTa.setSelectionRange(0, text.length); } catch {}
    copyBox.scrollIntoView({ block: 'end', behavior: 'auto' });   // the whole box, its buttons too, above the add bar (scroll-padding)
  }
  $('copyselect').onclick = () => {
    copyTa.focus(); copyTa.select(); try { copyTa.setSelectionRange(0, copyTa.value.length); } catch {}
    let done = false; try { done = document.execCommand('copy'); } catch {}
    const b = $('copyselect'); b.textContent = done ? 'Copied!' : 'Selected: press and hold, then Copy'; setTimeout(() => { b.textContent = 'Select and copy'; }, 2600);
  };
  $('copyshare').onclick = async () => { try { await navigator.share({ title: 'The fridge list', text: copyTa.value }); } catch {} };
  copyBtn.onclick = async () => {
    if (!hub.isLoaded()) return;   // an empty cache would copy "Nothing to eat soon"
    const text = buildListText();
    if (await copyText(text)) { copyBox.hidden = true; setCopy('copied'); }
    else { setCopy('failed'); showCopyBox(text); }
    setTimeout(() => setCopy('idle'), 2000);
  };

  // Midnight rollover: "Nd ago", the groups and the date box's default/max all key off the household's date, so when
  // the day changes while the page is open (an iPad left on the counter overnight) everything is recomputed.
  // hub.onDay checks every 20 s and on wake; a Log tap re-keys too (submit, above).
  function rollover() {
    const now = hub.today();
    if (now === dayKey) return false;
    const wasToday = $('date').value === dayKey;
    dayKey = now;
    $('date').max = now;
    if (wasToday || !$('date').value) $('date').value = now;
    render();
    return true;
  }
  hub.onDay(rollover);
  window.__larder = { render, rollover, today: () => dayKey, fresh: freshOf, listText: buildListText, openEdit, setPortion, finishFlow, jumpTo };   // test hook (scripts/test-leftovers.mjs)

  hub.onChange(refresh);   // someone else logged or finished something: cards update where they stand
  render();
  // The first pull has answered on this device: paint the real list, and log an entry that was waiting for it.
  hub.loaded().then(() => { rollover(); render(); if (held) submit(); });
})();
</script>
</body>
</html>
