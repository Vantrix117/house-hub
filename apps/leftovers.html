<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Larder Ledger</title>
<link rel="stylesheet" href="design.css">
<style>
  /* The ledger keeps its own look (serif, paper, olive) and takes every colour from design.css tokens.
     The ledger green is the olive ink of whichever theme is on: deep green on paper, pale green in the dark
     themes — the fill/text pair flips with it, so nothing here keys off a colour scheme.
     Layout is list-first: the grouped list reads top-down, oldest first, and the add bar is a glass pane
     fixed above the safe area so the list and the bar are both on screen at once. */
  :root { --ledger: var(--olive-ink); --ledger-ink: var(--surface); --ledger-press: color-mix(in srgb, var(--olive-ink) 82%, var(--text));
          --addbar-h: 150px; }
  body { min-height: 100vh; font-family: var(--font-display);
         padding: 32px max(16px, var(--safe-right)) calc(var(--addbar-h) + 24px + var(--safe-bottom)) max(16px, var(--safe-left)); }
  :root[data-kind="kiosk"] body { padding-bottom: max(64px, var(--safe-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  .sans { font-family: var(--font-sans); }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .tally { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .lede { color: var(--text-2); font-size: 14px; margin: 0 0 6px; }
  .mode { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .mode.warn { color: var(--warn-ink); }

  .alert { display: flex; align-items: center; gap: 8px; background: var(--danger-soft); color: var(--danger-ink);
           padding: 12px 14px; border-radius: var(--r-sm); font-size: 13px; margin: 8px 0 16px; }

  /* ── the add bar: one glass pane, fixed above the safe area (design.css liquid-glass recipe, strong variant) ── */
  form { --g: var(--glass-strong);
         position: fixed; z-index: 20;
         left: max(12px, var(--safe-left)); right: max(12px, var(--safe-right)); bottom: max(12px, var(--safe-bottom));
         max-width: 560px; margin: 0 auto;
         background:
           linear-gradient(to bottom, var(--glass-spec) 0, transparent 34%),
           radial-gradient(90% 70% at var(--sheen-x) -10%, color-mix(in srgb, var(--accent) var(--glass-pickup), transparent), transparent 62%),
           var(--g);
         border: 1px solid var(--glass-edge); border-radius: var(--r); padding: 12px;
         box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e2);
         -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02); backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02);
         display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }   /* minmax(0,…): rows shrink instead of overflowing on a narrow phone */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { form { --g: color-mix(in srgb, var(--surface) 96%, transparent); } }
  .namerow { display: flex; align-items: stretch; gap: 8px; min-width: 0; }
  #name { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 14px; font-size: 17px;
          outline: none; background: var(--surface); color: var(--text); min-height: 52px; }
  #name:focus { border-color: var(--ledger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ledger) 22%, transparent); }
  #name::placeholder { color: var(--muted); }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; min-width: 0; }
  select, #date { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 12px; font-size: 15px;
                  background: var(--surface); color: var(--text); min-height: 44px; width: 100%; min-width: 0; }
  .log { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--ledger); flex: none;
         color: var(--ledger-ink); border: none; border-radius: var(--r-sm); min-height: 52px; min-width: 88px; padding: 0 16px; font-size: 16px; font-weight: 600; cursor: pointer;
         box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ledger-ink) 22%, transparent), var(--e1); }
  .log:active { background: var(--ledger-press); }
  .mic { width: 52px; min-height: 52px; flex: none; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
         color: var(--ledger); display: grid; place-items: center; cursor: pointer; }
  .mic[hidden] { display: none; }
  .mic.on { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(.94); } }
  .err { color: var(--danger); font-size: 12px; }

  /* ── the grouped list: Use it up · Aging · Fresh, oldest first ── */
  .group { margin-bottom: 18px; }
  .group h2 { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
              color: var(--group-ink); margin: 0 0 8px 2px; }
  .group h2 small { font-family: var(--font-mono); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .list { display: grid; gap: 10px; }
  .item { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-sm); overflow: hidden; box-shadow: var(--e1); }
  .stripe { width: 5px; flex: none; background: var(--tint); }
  .body { flex: 1; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  .info { flex: 1; min-width: 0; }
  .nm { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  /* freshness bar — the design.css .bar recipe (tokens only), --p = days/10, --tint by age; body has no .ds so it lives here */
  .bar { height: 6px; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; margin-top: 8px; max-width: 220px; }
  .bar > i { display: block; height: 100%; width: calc(100% * var(--p, 0)); border-radius: inherit;
             background: linear-gradient(90deg, color-mix(in srgb, var(--tint) 75%, white), var(--tint)); transition: width .8s var(--ease-out); }
  .right { display: flex; align-items: center; gap: 10px; flex: none; }
  .status { font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--chip); color: var(--chip-text); white-space: nowrap; }
  .done { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); width: 48px; height: 48px;
          display: flex; align-items: center; justify-content: center; color: var(--ledger); flex: none; cursor: pointer; }
  .done:active { background: var(--hover); }

  .empty { text-align: center; padding: 32px 0 40px; color: var(--muted); }
  .empty p { margin: 0; }
  .empty img { width: 176px; max-width: 70%; margin: 0 auto 14px; }

  .hearth { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .hearth p { font-size: 13px; color: var(--text-2); margin: 0 0 12px; }
  .copy { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2);
          border-radius: var(--r-sm); padding: 0 18px; min-height: 52px; font-size: 14px; color: var(--text); cursor: pointer; }
  .copy:active { background: var(--hover); }
  :root[data-kind="kiosk"] .hearth, :root[data-kind="kiosk"] form[id="add"] { display: none; }   /* the form id is written as an attribute selector so hex-colour linting does not misread it */
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>The Larder Ledger</h1>
    <span class="tally" id="tally"></span>
  </div>
  <p class="lede">Log it when you put it away. Cross it off when it's gone.</p>
  <p class="mode sans" id="mode" hidden></p>

  <div id="alert"></div>

  <div id="list" class="sans"></div>

  <div class="hearth sans">
    <p>Want this week's warnings on the Hearth wall display? Copy the list below and tell Claude
       "push my leftovers to Hearth" — it'll add them straight to the Hearth Calendar.</p>
    <button type="button" class="copy" id="copy"></button>
  </div>
</div>

<form id="add" class="sans" aria-label="Log a leftover">
  <div class="namerow">
    <input id="name" placeholder="What is it? e.g. Chicken alfredo" autocomplete="off" enterkeyhint="done" aria-label="Leftover name">
    <button type="button" class="mic" id="mic" aria-label="Say the name" hidden></button>
    <button type="submit" class="log"></button>
  </div>
  <div class="pair">
    <select id="size" aria-label="Container size"></select>
    <input type="date" id="date" aria-label="Date logged">
  </div>
  <span class="err" id="err" hidden></span>
</form>

<script src="hub.js" data-app="leftovers" data-scope="family"></script>
<script>
(async () => {
  const SIZES = ['Small', 'Medium', 'Large', 'Family-size'];
  const WARN_DAYS = 7, AGING_DAYS = 4, FULL_BAR_DAYS = 10;   // the freshness bar fills over ten days, like the Home fridge card
  const TONES = {
    fresh:  { tint: 'var(--ok)',     chip: 'var(--ok-soft)',     chipText: 'var(--ok-ink)',     ink: 'var(--ok-ink)' },
    warn:   { tint: 'var(--warn)',   chip: 'var(--warn-soft)',   chipText: 'var(--warn-ink)',   ink: 'var(--warn-ink)' },
    urgent: { tint: 'var(--danger)', chip: 'var(--danger-soft)', chipText: 'var(--danger-ink)', ink: 'var(--danger-ink)' },
  };
  const GROUPS = [
    { tone: 'urgent', title: 'Use it up', sub: 'a week or older' },
    { tone: 'warn',   title: 'Aging',     sub: 'eat soon' },
    { tone: 'fresh',  title: 'Fresh',     sub: 'this week' },
  ];
  // Lucide glyphs, inlined — no icon library on a static host.
  const ICON = {
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  };
  function svg(name, size, stroke) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', stroke || 2); s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICON[name];
    return s;
  }

  const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const daysBetween = s => { const then = new Date(s + 'T00:00:00'); const now = new Date(); now.setHours(0, 0, 0, 0); return Math.floor((now - then) / 86400000); };
  const statusFor = d => d >= WARN_DAYS ? { label: 'Use it up', tone: 'urgent' }
                       : d >= AGING_DAYS ? { label: 'Aging', tone: 'warn' }
                       : { label: 'Fresh', tone: 'fresh' };

  await hub.ready();
  // Family data lives on the server already; this only rescues an item cached on a device that never synced.
  hub.migrate([{ from: 'leftovers.items', scope: 'family', to: v => (Array.isArray(v) ? v : []).filter(i => i && i.id).map(i => ['item:' + i.id, i]) }]);

  const items = () => hub.list('item:').map(r => r.value);
  const $ = id => document.getElementById(id);
  const errEl = $('err'), listEl = $('list'), alertEl = $('alert'), tallyEl = $('tally'), modeEl = $('mode'), form = $('add');
  const setErr = m => { errEl.textContent = m; errEl.hidden = !m; };
  const canEdit = hub.canWrite;

  // Only speak up when sync ISN'T working — silence means the house list is fine.
  hub.onSync(s => {
    if (s.state === 'offline') { modeEl.textContent = "Can't reach the house list — showing the last copy saved here." + (s.pending ? ' Your changes will send when it is back.' : ''); modeEl.className = 'mode sans warn'; modeEl.hidden = false; }
    else if (s.state === 'error') { modeEl.textContent = 'The house list had a problem: ' + (s.lastError || 'unknown') + '.'; modeEl.className = 'mode sans warn'; modeEl.hidden = false; }
    else modeEl.hidden = true;
  });

  SIZES.forEach(s => { const o = document.createElement('option'); o.value = o.textContent = s; $('size').append(o); });
  $('size').value = SIZES[1];
  let dayKey = todayStr();
  $('date').value = dayKey;
  $('date').max = dayKey;

  const logBtn = document.querySelector('#add .log');
  logBtn.append(svg('plus', 18), document.createTextNode(' Log'));

  // The page's bottom padding follows the real height of the bar (the mic slot and the error line change it).
  if (canEdit && 'ResizeObserver' in window) {
    new ResizeObserver(() => document.documentElement.style.setProperty('--addbar-h', Math.ceil(form.getBoundingClientRect().height) + 'px')).observe(form);
  }

  function render() {
    const sorted = items().sort((a, b) => daysBetween(b.dateLogged) - daysBetween(a.dateLogged));
    tallyEl.textContent = sorted.length + ' in the fridge';

    const warnCount = sorted.filter(i => daysBetween(i.dateLogged) >= WARN_DAYS).length;
    alertEl.textContent = '';
    if (warnCount) {
      const d = document.createElement('div');
      d.className = 'alert sans';
      d.append(svg('alert', 16, 2.2),
        document.createTextNode(warnCount + ' item' + (warnCount > 1 ? 's' : '') + ' at a week or older'));
      alertEl.append(d);
    }

    listEl.textContent = '';
    if (!sorted.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      const p = document.createElement('p');
      p.textContent = 'Nothing logged yet.';
      const art = document.createElement('img');
      art.src = '../art/empty/fridge.svg'; art.alt = ''; art.decoding = 'async';
      e.append(art, p);
      listEl.append(e);
      return;
    }

    for (const g of GROUPS) {
      const rows = sorted.filter(i => statusFor(daysBetween(i.dateLogged)).tone === g.tone);
      if (!rows.length) continue;
      const t = TONES[g.tone];
      const group = document.createElement('section');
      group.className = 'group'; group.dataset.tone = g.tone;
      group.style.setProperty('--group-ink', t.ink);
      const h = document.createElement('h2');
      h.textContent = g.title;
      const small = document.createElement('small'); small.textContent = rows.length + ' · ' + g.sub;
      h.append(small);
      const grid = document.createElement('div');
      grid.className = 'list';
      for (const it of rows) grid.append(itemCard(it));
      group.append(h, grid);
      listEl.append(group);
    }
  }

  function itemCard(it) {
    const days = daysBetween(it.dateLogged);
    const { label, tone } = statusFor(days);
    const t = TONES[tone];

    const card = document.createElement('div');
    card.className = 'item'; card.dataset.id = it.id; card.dataset.days = days; card.dataset.tone = tone;
    card.style.setProperty('--tint', t.tint);
    card.style.setProperty('--chip', t.chip);
    card.style.setProperty('--chip-text', t.chipText);

    const stripe = document.createElement('div'); stripe.className = 'stripe';
    const body = document.createElement('div'); body.className = 'body';
    const info = document.createElement('div'); info.className = 'info';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = it.size + ' · logged ' + it.dateLogged + ' · ' + days + 'd ago' + (it.byName ? ' · ' + it.byName : '');
    const bar = document.createElement('div'); bar.className = 'bar';
    bar.style.setProperty('--p', Math.min(1, Math.max(0, days) / FULL_BAR_DAYS));
    bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', days + ' of ' + FULL_BAR_DAYS + ' days');
    bar.append(document.createElement('i'));
    info.append(nm, meta, bar);

    const right = document.createElement('div'); right.className = 'right';
    const chip = document.createElement('span'); chip.className = 'status'; chip.textContent = label;
    right.append(chip);
    if (canEdit) {
      const done = document.createElement('button');
      done.type = 'button'; done.className = 'done';
      done.title = 'Mark used up';
      done.setAttribute('aria-label', 'Mark ' + it.name + ' used up');
      done.append(svg('check', 18, 2.4));
      done.onclick = () => removeItem(it.id);
      right.append(done);
    }
    body.append(info, right);
    card.append(stripe, body);
    return card;
  }

  form.onsubmit = e => {
    e.preventDefault();
    const name = $('name').value.trim();
    if (!name) return;
    if (!canEdit) { hub.kioskNudge(); setErr('This profile can only look at the list.'); return; }
    const item = {
      id: hub.uid(), name, size: $('size').value, dateLogged: $('date').value || todayStr(),
      by: hub.profile.id, byName: hub.profile.name,
    };
    $('name').value = ''; $('name').blur();
    $('size').value = SIZES[1];
    $('date').value = todayStr();
    hub.set('item:' + item.id, item);
    hub.activity('Logged ' + item.name + ' (' + item.size + ') in the fridge');
    setErr(''); render();
  };

  function removeItem(id) {
    const it = hub.get('item:' + id);
    hub.remove('item:' + id);
    if (it) hub.activity('Finished the ' + it.name);
    render();
  }

  // Voice: tap, say the name, it lands in the box.
  const mic = $('mic');
  if (hub.voiceSupported && canEdit) {
    mic.hidden = false; mic.append(svg('mic', 22));
    let rec = null;
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = hub.voiceInput(text => { $('name').value = text; $('name').focus(); }, {
        onEnd: () => { rec = null; mic.classList.remove('on'); },
        onError: () => { rec = null; mic.classList.remove('on'); setErr("Couldn't hear that — try again or type it."); },
      });
      if (rec) { mic.classList.add('on'); setErr(''); }
    };
  }

  function buildHearthText() {
    const due = items().sort((a, b) => daysBetween(b.dateLogged) - daysBetween(a.dateLogged))
      .filter(i => daysBetween(i.dateLogged) >= AGING_DAYS);
    if (!due.length) return "Nothing aging right now — fridge's in good shape.";
    const lines = due.map(i => {
      const d = daysBetween(i.dateLogged);
      return `• ${i.name} (${i.size}) — logged ${d}d ago, ${d >= WARN_DAYS ? 'use it up' : 'eat soon'}`;
    });
    return 'Push these to the Hearth Calendar:\n' + lines.join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    try { // Safari in an iframe can refuse the async API; fall back to a selection copy.
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }

  const copyBtn = $('copy');
  function setCopy(state) {
    copyBtn.textContent = '';
    copyBtn.append(svg('refresh', 15), document.createTextNode(
      state === 'copied' ? ' Copied!' : state === 'failed' ? ' Copy failed — select manually' : ' Copy list for Hearth'));
  }
  copyBtn.onclick = async () => {
    setCopy(await copyText(buildHearthText()) ? 'copied' : 'failed');
    setTimeout(() => setCopy('idle'), 2000);
  };
  setCopy('idle');

  // Midnight rollover: "Nd ago", the groups and the date box's default/max all key off today's date, so when the
  // day changes while the page is open (an iPad left on the counter overnight) everything is recomputed. A timer
  // checks the day key every minute; the visibility hook catches a device that slept through the timer.
  function rollover() {
    const now = todayStr();
    if (now === dayKey) return false;
    const wasToday = $('date').value === dayKey;
    dayKey = now;
    $('date').max = now;
    if (wasToday || !$('date').value) $('date').value = now;
    render();
    return true;
  }
  setInterval(rollover, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rollover(); });
  window.__larder = { render, rollover, today: () => dayKey };   // test hook (scripts/test-leftovers.mjs)

  hub.onChange(render);   // someone else logged or finished something
  render();
})();
</script>
</body>
</html>
