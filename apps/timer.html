<title>Kitchen timer</title>
<link rel="stylesheet" href="design.css">
<style>
  /* Kitchen timer (audit batch 1). Every colour is a design.css role token; no hex, no color-mix recipe (CONS-TOK-3). */
  html, body { height: 100%; }
  body { display: grid; place-items: center; user-select: none; -webkit-user-select: none; transition: background var(--dur-slow) var(--ease-standard);
    padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
  /* time's up: the page takes the person's hero wash; never the danger family (CONS-ACCENT-2, CONS-COLOR-4) */
  body.ds.done { background: var(--wash), var(--hero-bg); background-attachment: fixed; }
  /* the narrow column (CONS-SHAPE-2): the content is --col-narrow wide, inside the page padding */
  main { text-align: center; width: min(100%, calc(var(--col-narrow) + 2 * var(--sp-4))); min-width: 0; padding: var(--sp-4); display: grid; justify-items: center; }   /* min-width 0: a grid item never outgrows the screen at a large text size */

  /* title mark — standalone gets a name; hidden when the viewport is short (in-hub iframe on a phone) */
  .hd { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); color: var(--text-2); }
  .hd img { height: 44px; width: auto; display: block; }
  .hd h1 { margin: 0; font: var(--fw-semibold) var(--fs-lg)/var(--lh-title3) var(--font-display); color: var(--text); letter-spacing: var(--ls-title3); }
  @media (max-height: 640px) { .hd { display: none; } }

  /* the dial: content, so a SOLID disc, not a glass pane (VIS-TIMER-6, CONS-GLASS-2); the design.css ring inside it, the
     time in the middle. The ring reads the progress roles, never the raw person colour (P4-ACCENT-04, P4-DARK-01): the arc
     is --progress-fill (the person's solid, 5.5-9.8:1 on the dial in every palette) and the track --tint-fill-strong,
     1.86-2.37:1 on the dial (VIS-TIMER-7; --progress-track, the pastel fill, is only 1.07-1.47:1 on a light dial). */
  .dial { width: min(82vw, 52vh, 400px); aspect-ratio: 1; border-radius: var(--r-full);
    padding: var(--sp-4); display: grid; place-items: center; container-type: inline-size;
    background: var(--material-solid-bg); border: var(--border-w) solid var(--separator);
    box-shadow: inset 0 1px 0 var(--hairline), var(--elev-card);
    transition: box-shadow var(--dur-slow) var(--ease-standard); }
  .dial .ringwrap { width: 100%; height: 100%; }
  .dial .ring { width: 100%; height: 100%; filter: drop-shadow(0 2px 6px var(--accent-glow)); }
  .dial .ring circle { stroke-width: 3; }
  .dial .ring .bg { stroke: var(--tint-fill-strong); transition: stroke var(--dur-slow) var(--ease-standard); }
  .dial .ring .fg { stroke: var(--progress-fill);
    transition: stroke-dashoffset var(--dur-progress) var(--ease-standard), stroke var(--dur-slow) var(--ease-standard), opacity var(--dur-fast) var(--ease-standard); }
  .dial.empty .ring .fg { opacity: 0; }   /* a round cap would still draw a dot at 0 */
  /* the digits: the rounded numeral face with tabular figures (CONS-TYPE-3, the batch-1a numeral move), in the person's ink */
  .time { position: absolute; font-size: clamp(56px, 16vw, 92px); font-size: 24cqw; font-weight: var(--fw-light); line-height: 1;
    font-variant-numeric: var(--numeral-features); letter-spacing: var(--ls-numeral); color: var(--accent-ink); font-family: var(--font-numeral);
    transition: color var(--dur-slow) var(--ease-standard); }

  /* done: the owner's colour + motion + sound (--timer-done, never --danger: CONS-ACCENT-2). The whole track fills in the
     owner's solid, a ring lights round the dial and the dial pulses; the digits stay at full ink, never dimmed with opacity
     (CONS-COLOR-1). Under Reduce Motion the pulse is still (--pulse-scale 1) and the colour and the beep remain. */
  body.done .dial { box-shadow: inset 0 1px 0 var(--hairline), var(--elev-card), 0 0 0 var(--ring-w-lg) var(--timer-done);
    animation: timer-done var(--dur-pulse) var(--ease-standard) infinite; }
  body.done .dial .ring .bg { stroke: var(--timer-done); }
  body.done .time { font-weight: var(--fw-regular); }
  @keyframes timer-done { 50% { transform: scale(var(--pulse-scale)); } }

  /* presets as chips; the selected one is the >= 3:1 selection solid plus weight, not a hue shift (VIS-TIMER-3, P4-ACCENT-01) */
  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); margin-top: var(--sp-6); width: 100%; }
  /* at the two largest text sizes a phone gets two columns, so no chip is cut off at the edge (review, batch 1) */
  @media (max-width: 719px) { :root:is([data-text-size="xl"], [data-text-size="xxl"]) .presets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .presets .btn { border-radius: var(--r-full); padding: 0 var(--sp-3); white-space: nowrap; font-weight: var(--fw-medium); }   /* as .ds .seg: medium, selected semibold */
  .presets .btn.on { background: var(--sel-fill-strong); border-color: transparent; color: var(--sel-ink-strong); font-weight: var(--sel-weight); box-shadow: var(--elev-control); }

  .actions { display: flex; gap: var(--sp-3); justify-content: center; margin-top: var(--sp-4); width: 100%; }
  .actions .btn-lg { flex: 1; }
  /* one row of six in the narrow column: the tighter gap keeps a kid's "10 min" clear of its capsule edge at 560 px */
  @media (min-width: 720px) { .presets { grid-template-columns: repeat(6, 1fr); gap: var(--sp-2); } }

  /* loading: until this page has pulled the timer, the dial holds a skeleton bar (not an idle "5:00") and every control
     is off, so a slow pull never lets Start, Reset or a preset replace a timer running on another device.
     The shimmer stops under reduced motion (design.css). */
  .time .tsk { display: block; width: 2.3em; height: .6em; border-radius: var(--r-full); }
  .dial[aria-busy="true"] .ring .fg { opacity: 0; }   /* no arc until there is a real time (not .empty: .ds .empty pads the disc) */
</style>
</head>
<body class="ds">
<main>
  <header class="hd"><img src="../art/app/timer.svg" alt=""><h1>Kitchen timer</h1></header>
  <div class="dial" id="dial" aria-busy="true">
    <span class="ringwrap lg">
      <svg class="ring ring-lg" viewBox="0 0 52 52" style="--p:0" aria-hidden="true"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" cx="26" cy="26" r="22"/></svg>
      <div class="time" id="t"><span class="skeleton tsk" role="img" aria-label="Loading your timer"></span></div>
    </span>
  </div>
  <div class="presets" id="presets">
    <button class="btn" data-s="60" disabled aria-disabled="true">1 min</button>
    <button class="btn" data-s="180" disabled aria-disabled="true">3 min</button>
    <button class="btn" data-s="300" disabled aria-disabled="true">5 min</button>
    <button class="btn" data-s="600" disabled aria-disabled="true">10 min</button>
    <button class="btn" data-s="900" disabled aria-disabled="true">15 min</button>
    <button class="btn" data-s="1800" disabled aria-disabled="true">30 min</button>
  </div>
  <div class="actions">
    <button class="btn btn-primary btn-lg" id="go" disabled aria-disabled="true">Loading…</button>
    <button class="btn btn-ghost btn-lg" id="reset" disabled aria-disabled="true">Reset</button>
  </div>
</main>
<script src="hub.js" data-app="timer" data-scope="person"></script>
<script>
  (async () => {
    await hub.ready();
    // The running countdown is a person-scope record, timer.active = { endAt, total, startedAt } (ms epoch / seconds).
    // The hub shell reads the same record to show a pill on every tab, beep at 0 and clear it; a second device
    // sees it within a pull. Pause, reset and a new preset clear it. The display profile only runs a local timer.
    const ACTIVE = 'timer.active';
    let total = Number(hub.get('lastPreset', { default: 300 })) || 300, left = total, tick = null, endAt = 0;
    const t = document.getElementById('t'), go = document.getElementById('go'), dial = document.getElementById('dial'), ring = dial.querySelector('.ring');
    const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const show = () => {
      t.textContent = fmt(left);
      ring.style.setProperty('--p', total ? (left / total).toFixed(4) : 0);
      dial.classList.toggle('empty', left === 0);
      document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', +b.dataset.s === total));
    };
    const active = () => { const a = hub.get(ACTIVE); return a && typeof a === 'object' && a.endAt > 0 ? a : null; };
    const write = a => { if (!hub.canWrite) return; try { if (a) hub.set(ACTIVE, a); else if (hub.has(ACTIVE)) hub.remove(ACTIVE); } catch {} };
    // Live only once THIS page has pulled the timer: hub.sync.lastPull is this window's own (0 until a pull of it
    // succeeds), while the channel may be "loaded" from a shell cache minutes old. Start, Reset or a preset on that
    // stale idle view would replace a timer started since on another device (last write wins) — so all stay off.
    let live = false;
    const ctrls = [...document.querySelectorAll('#presets [data-s], #go, #reset')];
    const label = () => { go.textContent = !live ? 'Loading…' : tick ? 'Pause' : 'Start'; go.classList.toggle('btn-primary', !tick); };
    const stop = () => { clearInterval(tick); tick = null; label(); };
    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, .3, .6].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination); o.frequency.value = 880;
          g.gain.setValueAtTime(.4, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d + .25);
          o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .25); });
      } catch {}
    }
    const finish = () => { stop(); left = 0; show(); document.body.classList.add('done'); beep(); write(null); };
    function run() {                     // count down to endAt (Start, or resuming a timer that is already running)
      clearInterval(tick);
      document.body.classList.remove('done');
      const step = () => {
        left = Math.max(0, Math.round((endAt - Date.now()) / 1000)); show();
        if (left === 0) finish();
      };
      step(); if (left > 0) tick = setInterval(step, 250);
      label();
    }
    go.onclick = () => {
      if (!live) return;
      if (tick) { stop(); write(null); return; }
      if (left === 0) left = total;
      endAt = Date.now() + left * 1000;
      write({ endAt, total, startedAt: Date.now() });
      run();
    };
    document.getElementById('reset').onclick = () => { if (!live) return; stop(); write(null); left = total; document.body.classList.remove('done'); show(); };
    document.getElementById('presets').addEventListener('click', ev => {
      const b = ev.target.closest('[data-s]'); if (!b || !live) return;
      stop(); write(null); total = left = +b.dataset.s; document.body.classList.remove('done'); show();
      if (hub.canWrite) try { hub.set('lastPreset', total); } catch {}
    });
    // resume a timer that is already running (started before the app was closed, or on another device)
    const resume = a => { total = Number(a.total) > 0 ? Number(a.total) : total; endAt = Number(a.endAt); run(); };
    const a0 = active();
    if (a0 && a0.endAt > Date.now()) resume(a0);   // a cached running timer is real; an idle view waits for the pull
    // Truly offline (navigator.onLine false, e.g. the Kitchen iPad's Wi-Fi drops) there is nothing fresher to wait for
    // and a cooking timer must still start, so a loaded cache is enough; online, a held pull still waits. When the server
    // cannot be reached at all (Wi-Fi up, internet or Worker down: every pull fails) a loaded cache is used after 8 s
    // rather than locking the timer for as long as the outage lasts.
    const bornAt = Date.now();
    const unreachable = () => (hub.sync.state === 'error' || hub.sync.state === 'offline') && Date.now() - bornAt > 8000;
    const wake = () => {
      if (live || !(hub.isLoaded() && (hub.sync.lastPull > 0 || navigator.onLine === false || unreachable()))) return;
      live = true; dial.removeAttribute('aria-busy');
      ctrls.forEach(b => { b.disabled = false; b.removeAttribute('aria-disabled'); });
      if (!tick) {
        total = Number(hub.get('lastPreset', { default: 300 })) || 300;
        const a = active(); if (a && a.endAt > Date.now()) resume(a); else { left = total; show(); }
      }
      label();
    };
    let retry = 0;                       // a failed first pull: try again in 5 s rather than waiting for the 30 s poll
    window.addEventListener('offline', wake); window.addEventListener('online', wake);
    hub.onSync(s => { wake(); if (!live && !retry && (s.state === 'error' || s.state === 'offline')) retry = setTimeout(() => { retry = 0; if (!live) hub.pull(); }, 5000); });
    hub.onChange(ch => {
      if (ch.app !== 'timer') return;
      const a = active();
      if (a && (!tick || a.endAt !== endAt)) { if (a.endAt > Date.now()) resume(a); }
      else if (!a && tick) {             // cleared elsewhere: the shell finished it, or someone paused it on another device
        if (endAt - Date.now() <= 1200) finish(); else { stop(); left = total; show(); }
      }
    });
  })();
</script>
</body>
</html>
