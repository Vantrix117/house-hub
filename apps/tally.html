<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally counter</title>
<link rel="stylesheet" href="design.css">
<style>
  /* Tally v2 — the person's colour washes the page; the count sits in a glass dial (glass-strong recipe),
     +/− are large glass buttons, Reset and the "who" kicker sit on small glass pills. Every colour is a design.css token. */
  html, body { height: 100%; }
  body.ds {
    /* light: the person's colour, deepening toward the bottom; dark (below): the same colour sinking into the theme's dark */
    --tally-hi: color-mix(in srgb, var(--accent) 74%, var(--bg));
    --tally-mid: color-mix(in srgb, var(--accent) 84%, var(--bg));
    --tally-lo: color-mix(in srgb, var(--accent-deep) 80%, var(--bg));
    background-color: var(--bg);
    background-image:
      radial-gradient(120% 90% at var(--sheen-x) -10%, var(--tally-hi) 0%, var(--tally-mid) 46%, var(--tally-lo) 100%);
    background-attachment: fixed;
    color: var(--on-accent);
    display: grid; place-items: center; user-select: none; -webkit-user-select: none;
    padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    overflow-x: hidden;
  }
  :root[data-scheme="dark"] body.ds {
    --tally-hi: color-mix(in srgb, var(--accent) 62%, var(--bg));
    --tally-mid: color-mix(in srgb, var(--accent) 52%, var(--bg));
    --tally-lo: color-mix(in srgb, var(--accent) 34%, var(--bg));
    color: var(--text);
  }
  main { position: relative; text-align: center; display: grid; justify-items: center; padding: var(--sp-6) var(--sp-4); }

  /* spot art: a faint watermark in the corner, out of the way of the dial */
  .art { position: fixed; z-index: 0; right: calc(var(--sp-4) + var(--safe-right)); bottom: calc(var(--sp-4) + var(--safe-bottom));
    width: clamp(110px, 18vw, 200px); opacity: .16; transform: rotate(-6deg); pointer-events: none; user-select: none; -webkit-user-select: none; filter: saturate(.5); }

  /* the dial: glass-strong recipe on a disc */
  .dial {
    --disc: clamp(240px, 74vw, 360px);
    --g: var(--glass-strong);
    position: relative; z-index: 1;
    width: var(--disc); height: var(--disc); border-radius: var(--r-full);
    display: grid; place-items: center; overflow: hidden;
    background:
      linear-gradient(to bottom, var(--glass-spec) 0, transparent 34%),
      radial-gradient(90% 70% at var(--sheen-x) -10%, color-mix(in srgb, var(--accent) var(--glass-pickup), transparent), transparent 62%),
      var(--g);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e3), 0 30px 70px -30px var(--accent-glow);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02); backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02);
  }
  /* a faint tick ring inside the rim, like a dial face */
  .dial::before { content: ""; position: absolute; inset: 10px; border-radius: inherit; border: 1px dashed var(--line-soft); opacity: .8; pointer-events: none; }
  .count {
    --digits: 1;
    position: relative; color: var(--text);
    font-family: var(--font-display); font-weight: 400; line-height: 1; letter-spacing: var(--ls-tight);
    font-variant-numeric: tabular-nums;
    font-size: min(clamp(96px, 26vw, 168px), calc(var(--disc) * 1.35 / max(var(--digits), 3)));
    transition: font-size var(--dur-2) var(--ease);
  }

  .ds main .row { display: flex; gap: var(--sp-5); justify-content: center; align-items: center; margin-top: var(--sp-8); position: relative; z-index: 1;
    min-height: 0; padding: 0; border: 0; background: none; box-shadow: none; }

  /* +/−: large glass buttons (the recipe, on a circle) */
  .tbtn {
    --g: var(--glass);
    width: 96px; height: 96px; min-width: var(--tap); min-height: var(--tap); border-radius: var(--r-full);
    display: grid; place-items: center; padding: 0; cursor: pointer;
    font: inherit; font-size: var(--fs-3xl); font-weight: 300; line-height: 1; color: var(--text);
    background:
      linear-gradient(to bottom, var(--glass-spec) 0, transparent 34%),
      radial-gradient(90% 70% at var(--sheen-x) -10%, color-mix(in srgb, var(--accent) var(--glass-pickup), transparent), transparent 62%),
      var(--g);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e2);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02); backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02);
    transition: transform var(--dur-2) var(--spring), box-shadow var(--dur-2) var(--ease);
  }
  .tbtn:active { transform: scale(.94); box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e1); }
  .tbtn:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  .tbtn.big { --g: var(--glass-strong); width: 140px; height: 140px; font-size: var(--fs-4xl); font-weight: 400; box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e3); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .dial, .tbtn { --g: color-mix(in srgb, var(--surface) 96%, transparent); }
  }
  @media (hover: hover) and (pointer: fine) {
    .tbtn:hover { transform: translateY(-1px); }
  }

  /* Reset + the "who" kicker: small glass-strong pills, so the ink is var(--text) on a surface tint. (The wash is the
     accent lightened into --bg, which --on-accent can't clear at AA in the light themes, and a dark ink can't clear the
     darker family colours — so neither goes straight on the wash.) Not inside a scroller, so backdrop-filter is fine. */
  .ds .who, .ds .btn.reset {
    --g: var(--glass-strong);
    color: var(--text); opacity: 1;
    background:
      linear-gradient(to bottom, var(--glass-spec) 0, transparent 34%),
      radial-gradient(90% 70% at var(--sheen-x) -10%, color-mix(in srgb, var(--accent) var(--glass-pickup), transparent), transparent 62%),
      var(--g);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e1);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02); backdrop-filter: blur(var(--blur)) saturate(1.4) brightness(1.02);
  }
  .ds .btn.reset { margin-top: var(--sp-6); position: relative; z-index: 1; font-weight: 600; border-radius: var(--r-full); padding: 0 var(--sp-6);
    transition: transform var(--dur-2) var(--spring), box-shadow var(--dur-2) var(--ease); }
  .ds .btn.reset:active { transform: scale(.96); box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring); }
  @media (hover: hover) and (pointer: fine) {
    .ds .btn.reset:hover { --g: var(--surface); transform: translateY(-1px); }
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .ds .who, .ds .btn.reset { --g: color-mix(in srgb, var(--surface) 96%, transparent); }
  }

  /* who: kicker at the top, on its pill */
  .ds .who { position: fixed; top: calc(var(--sp-4) + var(--safe-top)); left: 50%; transform: translateX(-50%); z-index: 2;
    padding: var(--sp-2) var(--sp-4); border-radius: var(--r-full); line-height: 1.3;
    white-space: nowrap; max-width: calc(100vw - var(--sp-8)); overflow: hidden; text-overflow: ellipsis; }

  /* kids: bigger targets */
  :root[data-kind="kid"] .tbtn { width: 116px; height: 116px; }
  :root[data-kind="kid"] .tbtn.big { width: 168px; height: 168px; }
  :root[data-kind="kid"] .dial { --disc: clamp(260px, 80vw, 400px); }

  /* loading: until the count has been pulled once the dial holds a skeleton, never a placeholder 0 (a 0 invites the tap
     that would write over the real count), and the buttons are visibly off. The shimmer stops under reduced motion (design.css). */
  .count.skeleton { width: 1.3em; height: .6em; min-height: 0; border-radius: var(--r-full); }
  .tbtn:disabled, .tbtn:disabled:active, .tbtn:disabled:hover,
  .ds .btn.reset:disabled, .ds .btn.reset:disabled:active, .ds .btn.reset:disabled:hover { opacity: .45; cursor: default; transform: none; }

  @media (prefers-reduced-motion: reduce) { .tbtn, .count, .ds .btn.reset { transition: none; } }
</style>
</head>
<body class="ds">
<div class="who kicker" id="who"></div>
<main aria-busy="true">
  <img class="art" src="../art/app/tally.svg" alt="" aria-hidden="true">
  <div class="dial">
    <div class="count skeleton" id="n" role="img" aria-label="Loading your count"></div>
  </div>
  <div class="row">
    <button class="tbtn" id="minus" aria-label="Subtract one" disabled aria-disabled="true">−</button>
    <button class="tbtn big" id="plus" aria-label="Add one" disabled aria-disabled="true">+</button>
  </div>
  <button class="btn btn-ghost reset" id="reset" disabled aria-disabled="true">Reset to zero</button>
</main>
<script src="hub.js" data-app="tally" data-scope="person"></script>
<script>
  (async () => {
    const who = () => { if (hub.profile) document.getElementById('who').textContent = hub.profile.name + "'s counter"; };
    who();                               // the name is known from the session at once: no empty pill while loading
    await hub.ready();
    // Legacy key from before profiles existed. The SDK waits for the load and a fresh pull, skips guests and kids, and
    // writes only if the server has no count; its change event (key null, migrated) re-renders through onChange below.
    hub.migrate([{ from: 'tally.count', to: 'count', parse: raw => Number(raw) || 0 }]).catch(() => {});
    const el = document.getElementById('n'), main = document.querySelector('main');
    const btns = ['plus', 'minus', 'reset'].map(id => document.getElementById(id));
    who();
    // Nothing is shown or written until the count has been pulled once on this device: hub.ready gives up after 6 s
    // (or at once when the pull fails), and a tap on an empty cache would replace the real count for good.
    let live = hub.isLoaded();
    // Batch 0f (P3-TALLY-01): each device keeps its own row, count:<device> = { n, epoch }, n being that device's net taps
    // since the reset named by epoch; the reset row { epoch, at } starts a new count. The display is the sum of every
    // device's row on the current epoch, so taps from two devices add up instead of the newer absolute number erasing the
    // other's. Before the first reset the pre-0f absolute row `count` is the base.
    const dev = () => 'count:' + ((hub.device && hub.device.id) || 'this-device');
    const epochNow = () => { const r = hub.get('reset'); return r && typeof r === 'object' && r.epoch ? String(r.epoch) : null; };
    const n = () => {
      const ep = epochNow(); let sum = ep ? 0 : Math.max(0, Number(hub.get('count', { default: 0 })) || 0);
      for (const r of hub.list('count:')) if (r.value && typeof r.value === 'object' && (r.value.epoch || null) === ep) sum += Math.floor(Number(r.value.n) || 0);
      return Math.max(0, sum);
    };
    const mine = () => { const v = hub.get(dev()); const ep = epochNow(); return v && typeof v === 'object' && (v.epoch || null) === ep ? Math.floor(Number(v.n) || 0) : 0; };
    const show = () => {
      if (!live) return;
      const v = n(); el.classList.remove('skeleton'); el.removeAttribute('role'); el.removeAttribute('aria-label');
      el.textContent = v; el.style.setProperty('--digits', String(v).length);
    };
    // step: +1 or -1 on this device's own row (never below a shown 0); reset: a new epoch, which starts every device at 0
    const step = d => {
      if (!live) return;
      if (!hub.canWrite) { hub.kioskNudge(); return; }
      if (d < 0 && n() <= 0) return;
      try { hub.set(dev(), { n: mine() + d, epoch: epochNow() }); } catch (e) { if (e && e.error === 'not_loaded') return; throw e; }
      show();
    };
    const reset = () => {
      if (!live) return;
      if (!hub.canWrite) { hub.kioskNudge(); return; }
      try { hub.set('reset', { epoch: hub.uid(), at: Date.now() + (Number(hub.skew) || 0) }); } catch (e) { if (e && e.error === 'not_loaded') return; throw e; }
      show();
    };
    const wake = () => { live = true; main.removeAttribute('aria-busy'); btns.forEach(b => { b.disabled = false; b.removeAttribute('aria-disabled'); }); show(); };
    document.getElementById('plus').onclick = () => step(1);
    document.getElementById('minus').onclick = () => step(-1);
    document.getElementById('reset').onclick = reset;
    hub.onChange(show);
    if (live) wake(); else hub.loaded().then(wake);
    let retry = 0;                       // a failed first pull: try again in 5 s rather than waiting for the 30 s poll
    hub.onSync(s => { if (!live && !retry && (s.state === 'error' || s.state === 'offline')) retry = setTimeout(() => { retry = 0; if (!live) hub.pull(); }, 5000); });
  })();
</script>
</body>
</html>
