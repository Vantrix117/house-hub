<title>Anderson House</title>
<meta name="description" content="The Anderson family hub: reading plan, fridge list, prayers and reminders, one tap from the Home Screen.">

<style>
  /* The hub shell. Every colour here is a design.css token; layout is phone-first, then a sidebar + columns at 1024px. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100dvh; position: fixed; inset: 0; overflow: hidden; }
  /* spot illustration in a card's corner (art/app/*.svg); the card's text sits above it */
  .spot { position: absolute; right: 4px; bottom: 0; width: 34%; max-width: 150px; height: auto; opacity: .55; pointer-events: none; z-index: 0; }
  .empty-art { width: min(200px, 60%); margin: 0 auto var(--sp-3); }
  .empty-art img { width: 100%; height: auto; display: block; }
  .hero-soft .hero-art { color: var(--accent); opacity: .8; }

  /* ── gate: a full-bleed welcome ──────────────────────────────── */
  /* P2-PROF-12: centred by auto margins, which give way when the cards are taller than the screen, so the title is never off the
     top (a centred overflow splits above and below); the padding keeps it below the safe area */
  #gate { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow: auto;
    padding: calc(var(--sp-8) + var(--safe-top)) var(--sp-4) calc(var(--sp-8) + var(--safe-bottom)); }
  #gate > .gate-panel { margin-block: auto; }
  .gate-note { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); margin: 0 auto var(--sp-4); max-width: 520px; padding: var(--sp-3) var(--sp-4);
    border-radius: var(--r-lg); background: var(--warning-fill); color: var(--warning-ink); font-weight: 600; text-align: center; }
  .pcard:disabled { cursor: default; opacity: 1; }
  .pcard:disabled > * { opacity: .45; }
  .pcard:disabled .psub { opacity: 1; color: var(--text-3); }
  .pin-pad.locked { opacity: .45; }
  .welcome-art { position: fixed; inset: auto 0 0 0; height: min(40vh, 360px); pointer-events: none; z-index: 0; opacity: .75; }
  .welcome-art svg { width: 100%; height: 100%; display: block; }
  .gate-panel { position: relative; z-index: 1; width: 100%; max-width: 680px; }
  .gate-title { text-align: center; margin-bottom: var(--sp-6); }
  .gate-title h1 { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-hero); letter-spacing: var(--ls-large-title); line-height: var(--lh-tight); }
  .gate-title p { color: var(--text-2); margin-top: var(--sp-2); font-size: var(--fs-lg); }
  .gate-card { padding: var(--sp-5); }
  .profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }
  @media (min-width: 560px) { .profiles { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .profiles { grid-template-columns: repeat(4, 1fr); } }
  .pcard { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-3);
    min-height: 156px; padding: var(--sp-4); border: 1px solid var(--glass-line); border-radius: var(--r-xl);
    color: var(--text); font: inherit; font-weight: 700; font-size: var(--fs-lg);
    cursor: pointer; transition: transform var(--dur-2) var(--spring), box-shadow var(--dur-2) var(--ease); }
  .pcard:active { transform: scale(.95); }
  .pcard .psub { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
  .pcard.last { box-shadow: 0 0 0 2px var(--accent-graphic), var(--e3); }   /* each card carries its person's data-accent */
  .pcard.last .psub { color: var(--accent-deep); }
  @media (hover: hover) and (pointer: fine) { .pcard:hover { transform: translateY(-3px); box-shadow: var(--e3); } .pcard.last:hover { box-shadow: 0 0 0 2px var(--accent-graphic), var(--e3); } }
  .pcard.skeleton { min-height: 156px; box-shadow: none; border-color: transparent; background: var(--surface-2); -webkit-backdrop-filter: none; backdrop-filter: none; }
  :root[data-kind="kid"] .pcard, :root[data-kind="kiosk"] .pcard { min-height: 156px; }

  .pin-wrap { max-width: 380px; margin: 0 auto; text-align: center; }
  .pin-who { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .pin-who h2 { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: var(--ls-title1); }
  .pin-dots { display: flex; justify-content: center; gap: 14px; min-height: 22px; margin: var(--sp-4) 0 var(--sp-5); }
  .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted-decor); transition: transform var(--dur-2) var(--spring), background var(--dur-1) var(--ease); }
  .pin-dots i.on { background: var(--accent-strong); border-color: var(--accent-strong); transform: scale(1.15); }   /* the pad carries the chosen person's data-accent (VIS-PROF-a1) */
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
  .pin-pad .btn { min-height: 64px; font-size: var(--fs-xl); border-radius: var(--r-lg); }
  .pin-msg { min-height: 24px; margin-top: var(--sp-3); color: var(--danger-ink); font-weight: 600; }
  .pin-msg.ok { color: var(--text-2); font-weight: 500; }

  /* ── shell ───────────────────────────────────────────────────── */
  #shell { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #views { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative;
    padding: calc(var(--sp-4) + var(--safe-top)) var(--margin-right) calc(var(--sp-4) + 80px + var(--safe-bottom)) var(--margin-left); }   /* the size-class margin (16/20/28/32) with the safe areas (VIS-SHAPE-2) */
  .view { display: none; max-width: 880px; margin: 0 auto; }
  .view.on { display: block; animation: hub-fade var(--dur-2) var(--ease); }
  .view-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-5); min-height: 44px; }
  .view-title h1 { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-3xl); letter-spacing: var(--ls-large-title); }   /* D6: bold system large title */
  #ptr { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: center; pointer-events: none; height: 0; overflow: visible; z-index: 5; }
  #ptr span { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
    color: var(--accent-deep); transform: translateY(-56px) rotate(0deg); transition: transform var(--dur-3) var(--spring); }
  #ptr.arm span { transform: translateY(calc(var(--safe-top) + 12px)) rotate(180deg); }
  #ptr.busy span { transform: translateY(calc(var(--safe-top) + 12px)); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: translateY(calc(var(--safe-top) + 12px)) rotate(360deg); } }
  :root[data-kind="kiosk"] #tabbar { display: none; }
  :root[data-kind="kiosk"] #views { padding-bottom: calc(var(--sp-4) + var(--safe-bottom)); }
  /* ── the kitchen device (KITCHEN-2): Home and Apps only, and a calm Home read from across the room (UX-HOME-1) ── */
  :root[data-kind="kitchen"] .tab[data-tab="chat"], :root[data-kind="kitchen"] .tab[data-tab="me"] { display: none; }
  :root[data-kind="kitchen"] #tabbar .tabs { --tabs: 2 !important; }
  :root[data-kind="kitchen"][data-tab="home"] #timer-pill { display: none; }   /* the Timer card is the running timer there */
  .kitchen-home { display: grid; grid-template-columns: 1fr; gap: var(--sp-4); }
  @media (min-width: 720px) { .kitchen-home { grid-template-columns: 1fr 1fr; } }
  .k-hero { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--sp-2) var(--sp-5); padding: var(--sp-2) 0; }
  .k-clock { font-family: var(--font-numeral); font-size: min(var(--fs-glance-1), 24vw); font-weight: 700; line-height: 1; letter-spacing: var(--ls-tight); font-variant-numeric: tabular-nums; }
  .k-date { font-size: var(--fs-xl); color: var(--text-2); font-weight: 600; }
  .k-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
  .k-card .btn { align-self: flex-start; margin-top: auto; }
  .k-num { font-family: var(--font-numeral); font-size: min(var(--fs-glance-2), 18vw); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .k-val { font-size: min(var(--fs-glance-3), 11vw); font-weight: 700; line-height: 1.1; letter-spacing: var(--ls-tight); }
  .k-sub { color: var(--text-2); font-size: var(--fs-lg); }
  .k-quiet { font-size: var(--fs-xl); font-weight: 600; color: var(--text-2); line-height: var(--lh-snug); }
  .k-list { list-style: none; margin: 0; padding: 0; }
  .k-list li { display: flex; align-items: center; gap: var(--sp-3); min-height: 56px; padding: var(--sp-2) 0; border-top: var(--border-w) solid var(--separator); font-size: var(--fs-xl); }
  .k-list li:first-child { border-top: 0; }
  .k-list .grow { min-width: 0; overflow-wrap: anywhere; }
  .k-list .k-days { flex-shrink: 0; white-space: nowrap; font-family: var(--font-numeral); font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .k-list .k-days.stale { color: var(--danger-ink); }
  .k-faces { display: flex; flex: none; flex-wrap: nowrap; gap: 4px; }   /* up to four faces in a row, never a column */
  .k-faces .avatar { --size: 32px; }
  .k-wide { grid-column: 1 / -1; }
  .k-card h2 { flex-wrap: wrap; }
  #k-album-add { white-space: nowrap; flex: none; }
  .k-album { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); }
  .k-album img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-lg); display: block; background: var(--surface-2); }
  .k-add { display: flex; gap: var(--sp-2); }
  .k-add .input { flex: 1; min-width: 0; min-height: 56px; font-size: var(--fs-lg); }
  /* ── Me → Admin: the 18 colour families (GAP-ACCENT-1) and the household (GAP-PROF-a2) ── */
  .fam-hd { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); margin: var(--sp-2) 0 var(--sp-2); }
  .fam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--sp-2); }
  .fam { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 76px; padding: var(--sp-2) 4px;
    border: var(--border-w) solid var(--line); border-radius: var(--r-lg); background: var(--surface); color: var(--text); font: inherit; font-size: var(--fs-xs); line-height: 1.2; cursor: pointer; text-align: center; }
  .fam-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-fill-strong); box-shadow: inset 0 0 0 3px var(--accent-graphic); }
  .fam-app { color: var(--text-2); }
  .fam[aria-pressed="true"] { border-color: var(--accent-graphic); box-shadow: 0 0 0 2px var(--accent-graphic); font-weight: 700; }
  .fam-warn { margin: var(--sp-2) 0 0; padding: var(--sp-3); border-radius: var(--r-lg); background: var(--warning-wash); color: var(--warning-ink); font-size: var(--fs-sm); }
  .fam-warn:empty { display: none; }
  .fam-warn p { margin: 0; } .fam-warn p + p { margin-top: var(--sp-1); }
  .hh-btns { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: var(--sp-3); margin-top: var(--sp-3); }
  .who-grid .btn { flex-direction: column; gap: var(--sp-2); min-height: 120px; height: auto; padding: var(--sp-3) var(--sp-2); white-space: normal; text-align: center; }

  /* desktop: sidebar navigation, wider canvas */
  @media (min-width: 1024px) {
    #views { padding-left: calc(220px + var(--sp-8)); padding-right: var(--margin-right); padding-bottom: calc(var(--sp-8) + var(--safe-bottom)); }
    .view { max-width: var(--max); }
    #tabbar .brand { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-3) var(--sp-5); font-family: var(--font-display); font-size: var(--fs-xl); }
    #tabbar .brand .avatar { --size: 36px; }
  }
  #tabbar .brand { display: none; }

  /* ── home ─────────────────────────────────────────────────────── */
  .home-hero { min-height: 190px; margin-bottom: var(--sp-5); padding-right: 40%; }
  /* time of day: a light that falls across the person's colour rather than a second colour mixed into it */
  .home-hero::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; mix-blend-mode: soft-light; }
  .home-hero.morning::before { background: linear-gradient(115deg, var(--butter-graphic) 0%, color-mix(in srgb, var(--butter-graphic) 40%, transparent) 35%, transparent 65%); }
  .home-hero.afternoon::before { background: linear-gradient(115deg, var(--hi-4), transparent 55%); }
  .home-hero.evening::before { background: linear-gradient(115deg, var(--periwinkle-graphic), transparent 60%), linear-gradient(0deg, var(--shade-5), transparent 60%); }
  .home-hero .hero-title { font-size: clamp(30px, 7vw, 44px); }
  .home-hero .hero-art { width: 46%; max-width: 300px; right: -4px; bottom: -6px; }
  .home-hero .hero-sub { font-size: var(--fs-sm); }
  /* the sub-line keeps clear of the illustration (bottom right, 46 % wide): on a phone "N stars this week — ready to play?" wraps
     beside the arch instead of running under it. (.ds .hero's padding outranks the padding-right above, so the line is capped here.) */
  :root:not([data-kind="kiosk"]) .home-hero .hero-sub { max-width: 54%; }   /* VIS-HOME-3: no 34ch cap, only the art's clearance */
  .home-hero .clock { font-family: var(--font-numeral); font-size: clamp(48px, 11vw, 120px); font-weight: 700; letter-spacing: var(--ls-tight); line-height: 1; font-variant-numeric: tabular-nums; margin-top: var(--sp-2); white-space: nowrap; }
  :root[data-kind="kiosk"] .home-hero { min-height: 280px; padding-right: 30%; }
  :root[data-kind="kiosk"] .home-hero .clock { font-size: clamp(64px, 8.5vw, 150px); }
  :root[data-kind="kiosk"] .home-hero .hero-sub { font-size: var(--fs-xl); }
  .glance { display: grid; grid-template-columns: 1fr; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .pager-dots { display: none; }
  /* UX-HOME-3: on a phone the cards are one row of pages (the next one peeks), so the reminders are on the first screen */
  @media (max-width: 719px) {
    :root:not([data-kind="kid"]) .glance { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 86%; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
      margin: 0 calc(var(--margin-right) * -1) var(--sp-4) calc(var(--margin-left) * -1); padding: 2px var(--margin-right) var(--sp-3) var(--margin-left); scroll-padding: 0 var(--margin-left); scrollbar-width: none; }
    :root:not([data-kind="kid"]) .glance::-webkit-scrollbar { display: none; }
    :root:not([data-kind="kid"]) .glance > * { scroll-snap-align: start; }
    :root:not([data-kind="kid"]) .glance:has(> :only-child) { grid-auto-columns: 100%; }   /* one card fills the row */
    :root:not([data-kind="kid"]) .glance > .park-card { order: -1; }   /* a park day: the park card is the first page (review of batch 2a) */
    :root:not([data-kind="kid"]) .glance:has(> :nth-child(2)) { margin-bottom: var(--sp-2); }
    /* the pager's place: one dot per card, the one in view filled (UX-HOME-3, review of batch 2a) */
    :root:not([data-kind="kid"]) .pager-dots:not(:empty) { display: flex; justify-content: center; gap: var(--sp-2); margin: 0 0 var(--sp-4); }
    .pager-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-decor); transition: background var(--dur-1) var(--ease), transform var(--dur-2) var(--spring); }
    .pager-dots i.on { background: var(--accent-graphic); transform: scale(1.2); }
    :root:not([data-kind="kid"]) .home-hero { min-height: 136px; margin-bottom: var(--sp-4); }
    :root:not([data-kind="kid"]) .home-hero .hero-title { font-size: clamp(26px, 6.4vw, 34px); }
  }
  /* VIS-HOME-3: no orphan — an odd last card spans the row (two columns), and on the three-column grid a lone last card
     spans it and a last pair shares it */
  @media (min-width: 720px) { .glance { grid-template-columns: 1fr 1fr; gap: var(--sp-4); } .glance > :last-child:nth-child(odd) { grid-column: 1 / -1; } }
  @media (min-width: 1024px) {
    .glance { grid-template-columns: repeat(6, minmax(0, 1fr)); } .glance > * { grid-column: span 2; }
    .glance > :last-child:nth-child(odd) { grid-column: span 2; }
    .glance > :last-child:nth-child(3n+1) { grid-column: 1 / -1; }
    .glance > :last-child:nth-child(3n+2), .glance > :nth-last-child(2):nth-child(3n+1) { grid-column: span 3; }
  }
  .card h2 { font-size: var(--fs-lg); margin-bottom: var(--sp-3); display: flex; align-items: center; gap: var(--sp-3); position: relative; z-index: 1; }
  .card h2 .app-icon { --icon-box: 40px; }   /* a size sets only --icon-box; the corner is size x --r-icon-ratio (CONS-TOK-4) */
  .gcard { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 196px; }
  .gcard .gbody { flex: 1; display: flex; align-items: center; gap: var(--sp-4); position: relative; z-index: 1; }
  .gbig { font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; min-height: 1.3em; letter-spacing: var(--ls-tight); }
  .gsub { color: var(--text-2); font-size: var(--fs-sm); margin-top: 2px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .gbig.one { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  @media (max-width: 719px) { .gsub, .gbig.one { display: block; white-space: nowrap; text-overflow: ellipsis; } }   /* full-width cards: one line */
  .gcard .btn { align-self: flex-start; margin-top: var(--sp-3); position: relative; z-index: 1; }
  .fresh { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-2); }
  .fresh .bar { --tint: var(--aging); }
  .fresh .stale .bar { --tint: var(--use-soon); }   /* the Larder ramp: graphics, not inks */
  .fresh .fl { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--text-2); margin-bottom: 3px; }
  .rem-row { align-items: flex-start; }
  .rem-text { font-size: var(--fs-lg); }
  /* ── TV glue board (kiosk Home; re-laid out in batch 2c): the family album blurred behind solid panes, nothing to touch.
     The board is exactly one screen, a 12-column grid in three rows: the clock and the verse · today (who prayed, who read,
     the kids' stars) · the feed and the reminders, the last row taking what is left. What varies is fitted into it by the
     board's fit() (renderHome): faces in one row with a "+N", the newest reminders with "+N more", the feed's newest lines

  .kid-chip .kb { color: var(--text-2); font-size: var(--fs-sm); font-weight: 500; }
  /* UX-HOME-7: kid Home is pictures first — a big tile for each of the kid's apps, and the week's stars as stars */
  .kid-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
  @media (min-width: 700px) { .kid-tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
  .kid-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2); min-height: 168px; padding: var(--sp-3);
    border: 1px solid var(--line-soft); border-radius: var(--r-xl); background: var(--tile-bg); color: var(--accent-ink); box-shadow: var(--e2);
    font: inherit; font-size: var(--fs-title3); font-weight: 700; cursor: pointer; transition: transform var(--dur-2) var(--spring); }
  .kid-tile img { width: min(100%, 150px); height: auto; aspect-ratio: 200 / 160; pointer-events: none; }
  .kid-tile:active { transform: scale(.96); }
  .kid-tile.kid-all { grid-column: 1 / -1; flex-direction: row; gap: var(--sp-4); min-height: var(--tap-lg); background: var(--material-solid-bg); color: var(--text); }
  .kid-tile.kid-all .app-icon { --icon-box: 64px; }
  .star-row { display: flex; flex-wrap: wrap; gap: 2px; margin-top: var(--sp-3); position: relative; z-index: 1; }
  .star-row span { display: inline-grid; width: 30px; height: 30px; color: var(--track-info); }
  .star-row .icon { width: 100%; height: 100%; --icon-duo-opacity: 0; }
  .star-row span.on { color: var(--star-stroke); }
  .star-row span.on .icon { --icon-duo: var(--star-fill); --icon-duo-opacity: 1; }
  :root[data-kind="kid"] .star-row span { width: 40px; height: 40px; }
  /* UX-HOME-1: on the iPad the key numbers use the glance roles, readable from across the kitchen */
  :root[data-glance]:not([data-kind="kiosk"]) .gcard .gbig { font-size: var(--fs-glance-3); line-height: 1.05; font-family: var(--font-numeral); letter-spacing: var(--ls-numeral); }
  :root[data-glance]:not([data-kind="kiosk"]) .kid-chip { font-size: var(--fs-glance-3); line-height: 1.1; }
  :root[data-glance]:not([data-kind="kiosk"]) .kid-chip .avatar { --size: 48px; }
  :root[data-glance]:not([data-kind="kiosk"]) .fresh .fl { font-size: var(--fs-title3); font-weight: 600; color: var(--text); }
  :root[data-glance]:not([data-kind="kiosk"]) .star-big { font-size: var(--fs-glance-2); }
  :root[data-glance]:not([data-kind="kiosk"]) #timer-pill { min-height: 72px; padding: 0 var(--sp-6) 0 var(--sp-5); }
  :root[data-glance]:not([data-kind="kiosk"]) #timer-pill .tp-time { font-size: var(--fs-glance-3); line-height: 1; }
  :root[data-glance]:not([data-kind="kiosk"]) #timer-pill .icon, :root[data-glance]:not([data-kind="kiosk"]) #timer-pill .tp-ring .ring { width: 30px; height: 30px; }
  #rem-mic.on { background: var(--danger-fill); color: var(--danger-ink); animation: pulse 1s infinite; }
  /* the feed: one row per person, one line per thing they did */
  .feed .fwho { display: block; margin-bottom: 2px; }
  .feed .fline { display: flex; align-items: flex-start; gap: var(--sp-2); padding: 3px 0; }
  .feed .ficon { width: 22px; height: 22px; border-radius: calc(22px * var(--r-icon-ratio)); flex: none; display: grid; place-items: center; margin-top: 1px; color: var(--accent-ink); background: var(--tile-bg); }   /* the line's app family (data-accent) */
  .feed .ficon .icon { width: 14px; height: 14px; }
  .feed .ftxt { flex: 1; min-width: 0; }
  .feed .fline .fwhen { margin-left: var(--sp-2); padding-top: 2px; }
  .feed .feed-more { display: block; border-bottom: 0; padding: var(--sp-3) 0 0; }

  /* ── apps grid ────────────────────────────────────────────────── */
  /* minmax(0, 1fr): tracks never grow from a tile's content, so squares stay square next to a wide tile */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-4); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  /* VIS-HOME-1: a home screen, not a page of cards: an iOS-sized icon (60 px on a phone, 76 px from the iPad up) in its app's
     tile gradient, the name under it at caption size, no card chrome. Only the wide widget tile keeps a card. */
  .tile { --tb: 60px; position: relative; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: var(--sp-2);
    padding: var(--sp-1) 0 var(--sp-2); border: 0; border-radius: var(--r-lg); background: transparent; color: var(--text); font: inherit; font-size: var(--fs-caption1); font-weight: 500;
    text-align: center; cursor: pointer; transition: transform var(--dur-2) var(--spring); }
  @media (min-width: 700px) { .tile { --tb: 76px; } }
  .tile:active { transform: scale(.93); }
  .tile .ticon { --icon-box: var(--tb); box-shadow: inset 0 1px 0 var(--hairline), var(--e2); }
  .tile .ticon svg { width: 58%; height: 58%; }
  .tile .tlabel { line-height: 1.2; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: anywhere; }   /* a word wider than the tile (XXL) breaks with a hyphen, never cut mid-letter */
  .tile .badge { position: absolute; top: -2px; right: calc(50% - var(--tb) / 2 - 8px); }
  .tile.wide { --tb: 48px; grid-column: span 4; min-height: 112px; flex-direction: row; justify-content: flex-start; padding: var(--sp-3) var(--sp-4); gap: var(--sp-3); text-align: left;
    background: var(--material-solid-bg); border: 1px solid var(--line-soft); box-shadow: var(--e1); font-size: var(--fs-xs); font-weight: 600; }
  .tile.wide .badge { top: 8px; right: 8px; }
  @media (min-width: 700px) { .tile.wide { grid-column: span 3; } }
  .tile.wide .twidget { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-3); }
  .tile.wide .twidget > span:last-child { flex: 1; min-width: 0; }
  .tile.wide .tlabel { display: block; font-size: var(--fs-sm); font-weight: 700; }
  .tile.wide .tsub { font-size: var(--fs-xs); color: var(--text-2); font-weight: 500; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (hover: hover) and (pointer: fine) { .tile:hover { transform: translateY(-3px); } .tile.wide:hover { box-shadow: var(--e2); } }
  /* kids: big picture tiles on a card, two to four across */
  :root[data-kind="kid"] .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
  @media (min-width: 700px) { :root[data-kind="kid"] .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1024px) { :root[data-kind="kid"] .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  :root[data-kind="kid"] .tile { --tb: 88px; justify-content: center; aspect-ratio: 1; padding: var(--sp-2); font-size: var(--fs-md); font-weight: 600; border-radius: var(--r-xl);
    background: var(--material-solid-bg); border: 1px solid var(--line-soft); box-shadow: var(--e1); }
  :root[data-kind="kid"] .tile .badge { top: 8px; right: 8px; }

  /* ── chat ─────────────────────────────────────────────────────── */
  .chat { display: flex; flex-direction: column; gap: var(--sp-3); padding-bottom: 92px; min-height: 40vh; }
  .mrow { display: flex; gap: var(--sp-2); align-items: flex-end; max-width: 88%; }
  .mrow.user { align-self: flex-end; flex-direction: row-reverse; }
  .mrow .avatar { --size: 30px; box-shadow: none; margin-bottom: 4px; }
  .mrow .app-icon { --icon-box: 30px; margin-bottom: 4px; }
  .mcol { display: flex; flex-direction: column; min-width: 0; }
  .mrow.user .mcol { align-items: flex-end; }
  .mcol .say-btn { align-self: flex-start; margin-top: 2px; }
  .mtime { font-size: var(--fs-caption2); color: var(--text-3); margin: 2px var(--sp-2) 0; font-variant-numeric: tabular-nums; }
  .msg-note { font-size: var(--fs-caption1); color: var(--warning-ink); margin: 2px var(--sp-2) 0; }
  .chat-day { align-self: center; margin: var(--sp-3) 0 var(--sp-1); padding: 2px var(--sp-3); border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-caption1); font-weight: 600; }
  .chat-forgot { background: transparent; color: var(--text-3); font-weight: 500; border: 1px dashed var(--line); }
  .msg .chat-retry { display: flex; margin-top: var(--sp-2); }
  #notif .kv { align-items: center; }
  #notif .notif-time { flex: none; width: auto; min-width: 8.5em; max-width: 60%; min-height: var(--tap); }
  .chat-count { flex: none; padding: 0 var(--sp-2); color: var(--text-2); font-size: var(--fs-caption1); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .msg { padding: var(--sp-3) var(--sp-4); border-radius: var(--r-lg); line-height: var(--lh); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .msg.user { background: var(--accent-fill); color: var(--accent-ink); border-bottom-right-radius: 6px; box-shadow: var(--e1); }
  .msg.bot { border-bottom-left-radius: 6px; }
  .msg.bot.err { border-color: var(--danger-graphic); color: var(--danger-ink); }
  .msg.bot.stopped .stop-note { color: var(--text-2); font-style: italic; }
  .msg .chips .chip .chip-undo { white-space: nowrap; }
  .msg .chips { display: flex; flex-direction: column; gap: 4px; margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: 1px dashed var(--line); }
  .msg .chips:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .msg .chips .chip { justify-content: flex-start; min-height: 28px; font-size: var(--fs-xs); border-radius: var(--r-sm); }
  .msg .chips .chip .chip-undo { margin-left: auto; min-height: 44px; min-width: 44px; padding: 0 var(--sp-3); border: 0; background: transparent; color: inherit;
                                 font: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .msg .chips .chip .chip-undo:disabled { opacity: .5; cursor: default; }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  /* P2-PWA-17: the composer keeps clear of the side safe areas (the sensor housing in iPhone landscape) */
  .chat-form { position: fixed; left: var(--safe-left); right: var(--safe-right); bottom: calc(76px + var(--safe-bottom)); z-index: 19; display: flex; gap: var(--sp-2); align-items: center;
    width: min(100% - 2 * var(--sp-4) - var(--safe-left) - var(--safe-right), 880px); margin: 0 auto; padding: var(--sp-2); border-radius: var(--r-full);
    box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--glass-edge), inset 0 -12px 28px -18px var(--glass-inner), 0 0 0 1px var(--glass-ring), var(--e3); }
  /* the pill's edge is the message field's boundary, >= 3:1 (P4-COLOR-05): an outline, so the glass recipe's shadows stay; it
     takes the person's graphic tone while the field has focus */
  .ds .chat-form { outline: var(--border-w-strong) solid var(--field-border); outline-offset: calc(var(--border-w-strong) * -1); }
  .ds .chat-form:focus-within { outline-color: var(--accent-graphic); }
  @media (min-width: 1024px) { .chat-form { left: 220px; right: var(--safe-right); width: min(100% - 220px - 2 * var(--sp-8) - var(--safe-right), var(--max)); bottom: var(--sp-6); } }
  .chat-form .input { flex: 1; border: 0; background: transparent; min-height: var(--tap); box-shadow: none; }
  .chat-form .input:focus { box-shadow: none; }
  #chat-mic.on { background: var(--danger-soft); color: var(--danger-ink); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(var(--pulse-scale)); } }   /* 1 under Reduce Motion */
  .chat-note { text-align: center; color: var(--muted); font-size: var(--fs-sm); padding: var(--sp-4); max-width: 46ch; margin: 0 auto; }
  :root[data-kind="kid"] .msg { font-size: var(--fs-lg); }

  /* ── me + admin ───────────────────────────────────────────────── */
  .me-hero { display: flex; align-items: center; gap: var(--sp-4); min-height: 0; padding: var(--sp-5); }
  .me-hero .avatar-xl { --size: 84px; box-shadow: 0 0 0 4px var(--hi-4), var(--e2); }
  .photo-btn { position: relative; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; border-radius: 50%; flex: none; }
  .photo-btn:disabled { cursor: default; }
  .photo-btn .photo-badge { position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--accent-deep); box-shadow: var(--e2); }
  .photo-btn .photo-badge .icon { width: 16px; height: 16px; }
  .photo-btn:disabled .photo-badge { display: none; }
  .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); }
  .album-item { position: relative; margin: 0; border-radius: var(--r); overflow: hidden; aspect-ratio: 1; background: var(--surface-2); }
  .album-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .album-item figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: var(--fs-xs); color: var(--glass-inverse-ink); background: linear-gradient(transparent, var(--shade-5)); }
  .album-item .album-del { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; min-height: 32px; }
  .album-item .album-del .icon { width: 16px; height: 16px; }
  .me-hero .hero-title { font-size: var(--fs-2xl); margin: 0; }
  .me-hero .btn { margin: 0; flex: none; }
  /* the name never paints under Switch: its column may shrink, and a long name breaks (hyphenated) rather than running on
     (review of batch 2a); on a phone Switch drops its icon and the face gets smaller */
  .me-hero { flex-wrap: wrap; }
  .me-hero > .grow { flex: 1 1 7em; min-width: 0; }   /* under 7em of room, Switch moves to its own line (at the row's end) */
  .me-hero #switch { margin-left: auto; }
  .me-hero .hero-title, .me-hero .hero-kicker { overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto; }
  @media (max-width: 480px) { .me-hero { gap: var(--sp-3); padding: var(--sp-4); } .me-hero #switch .icon { display: none; } .me-hero .avatar-xl { --size: 64px; } }
  /* minmax(0, 1fr): at a large text size on a 375-390 px phone the column never grows past the screen to fit a card's widest row */
  .me-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
  .me-grid > * { min-width: 0; }
  .me-grid .row { flex-wrap: wrap; }
  .me-grid .row-main { flex: 1 1 5em; }   /* the name keeps its line beside the face; the buttons move under it when they do not fit */
  .me-grid .row-main + * { margin-left: auto; }   /* the buttons keep to the row's end, on its line or on the next */
  /* a phone: every admin profile row puts its buttons on a second line, so the rows read alike at any text size */
  @media (max-width: 743px) { .admin-people .row-main { flex-basis: calc(100% - 80px); } }
  .me-grid .row-title { overflow-wrap: anywhere; }
  .me-grid .hstack { flex-wrap: wrap; }
  .me-grid .hstack > .grow { flex: 1 1 0; }   /* the text shrinks first, so a switch or a face stays on its line (review of batch 1) */
  .me-grid .grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 18em), 1fr)); }
  table.usage { table-layout: fixed; overflow-wrap: anywhere; }
  @media (min-width: 1024px) { .me-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } .me-grid .span2 { grid-column: 1 / -1; } }
  /* theme cards: a tiny painting of each palette (the swatch's own tokens come from its data-theme-preview scope) */
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
  .theme-card { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; border-radius: var(--r-lg); border: 2px solid transparent; background: var(--surface-2); color: var(--text); font: inherit; text-align: left; cursor: pointer; transition: transform var(--dur-2) var(--spring), border-color var(--dur-1) var(--ease); }
  .theme-card:active { transform: scale(.97); }
  .theme-card.on { border-color: var(--accent-deep); }
  .theme-swatch { position: relative; display: block; height: 76px; border-radius: var(--r); overflow: hidden; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-soft); }
  .theme-swatch i { position: absolute; display: block; border-radius: 6px; }
  .theme-swatch .tp-hero { left: 8px; top: 8px; right: 8px; height: 22px; background: linear-gradient(120deg, var(--accent), var(--accent-deep)); }
  .theme-swatch .tp-card { left: 8px; top: 38px; width: calc(50% - 11px); height: 30px; background: var(--surface); box-shadow: var(--e1); }
  .theme-swatch .tp-card + .tp-card { left: auto; right: 8px; }
  .theme-swatch .tp-dot { right: 14px; top: 44px; width: 10px; height: 10px; border-radius: 50%; background: var(--success-graphic); }
  .theme-name { font-weight: 700; font-size: var(--fs-sm); padding: 0 4px; }
  .theme-blurb { font-size: var(--fs-xs); color: var(--muted); padding: 0 4px 4px; }
  .appearance { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-5); }
  .appearance .seg { flex-wrap: wrap; }   /* at a large text size the four glass levels wrap instead of running past the card */
  .appearance .seg button { flex: 1 1 auto; min-width: 0; padding: 0 var(--sp-2); }
  .appearance-switch { align-items: center; font-size: var(--fs-md); }
  .appearance-switch b { display: block; color: var(--text); }
  .appearance-switch .help { display: block; margin-top: 2px; }
  .tv-look .themes { margin-top: var(--sp-3); }
  :root[data-kind="kiosk"] .sheet:has(> .tv-look) { max-width: min(1280px, 92vw); }   /* the TV: the seven looks in two rows, the switches below them */
  :root[data-kind="kiosk"] .tv-look .themes { grid-template-columns: repeat(auto-fill, minmax(min(180px, 40%), 1fr)); }
  @media (orientation: landscape) and (min-width: 1000px) {   /* a landscape TV: four looks a row, names only, so Done is on screen */
    :root[data-kind="kiosk"] .tv-look .themes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    :root[data-kind="kiosk"] .tv-look .theme-blurb { display: none; }
    :root[data-kind="kiosk"] .tv-look .appearance { margin-top: var(--sp-3); gap: var(--sp-1); }
  }
  .tv-menu { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-4); }
  /* each swatch paints itself in its own palette: design.css scopes each palette to [data-theme-preview], and the swatch and
     the System card's night half each carry data-theme-preview + data-scheme + data-accent (swatchHtml); System is half day, half night */
  .theme-swatch .tp-half { position: absolute; inset: 0 0 0 50%; background: var(--bg); }
  .theme-swatch .tp-half .tp-card { left: auto; right: 8px; background: var(--surface); }
  .theme-swatch[data-preview="system"] > .tp-card + .tp-card { display: none; }
  .prow .btn { padding: 0 var(--sp-3); white-space: nowrap; }
  .swatches { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  /* ── item 23: guests — the Add-a-guest sheet's face grid, guest rows in Me and the admin list ── */
  .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--sp-2); }
  .emoji-grid button { min-height: 48px; font: inherit; font-size: var(--fs-xl); line-height: 1; border-radius: var(--r); border: 2px solid transparent; background: var(--surface-2); color: var(--text); cursor: pointer; transition: transform var(--dur-2) var(--spring), background var(--dur-1); }
  .emoji-grid button.on { border-color: var(--text); background: var(--accent-soft); transform: scale(1.06); }
  .guest-btns { display: flex; gap: var(--sp-2); flex-wrap: wrap; justify-content: flex-end; }
  .guest-list { display: flex; flex-direction: column; gap: var(--sp-2); }
  .guest-list .row { padding: var(--sp-2) 0; }
  table.usage { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  table.usage th, table.usage td { text-align: left; padding: var(--sp-2) var(--sp-1); border-bottom: 1px solid var(--line-soft); }
  table.usage th { color: var(--text-2); font-weight: 600; }
  table.usage th:first-child { width: 7em; } table.usage td:first-child { white-space: nowrap; }   /* a date on one line */
  @media (min-width: 1024px) {
    .admin-people .row { display: grid; grid-template-columns: 56px 1fr auto auto; align-items: center; }
    .admin-people .row .guest-btns { grid-column: 3 / -1; }   /* item 23: a guest row's Edit / Remove / Purge share the two button columns */
  }
  /* the shell's sheets (Switch app, Edit, Add a guest, the PIN and confirm sheets) hold grids and forms: glass stays the
     material (sheen, edge, blur, pickup), but the fill is nearly opaque, so a busy page never reads through where the controls
     sit, blur or no blur (review of batch 2a). Solid glass (Reduce Transparency) makes both ends the same: fully solid. */
  .ds .sheet { --g: color-mix(in srgb, var(--glass-strong-solid) 94%, var(--glass-strong)); }
  .switch-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-3) var(--sp-2); margin-top: var(--sp-3); }
  .sw-app { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); min-height: var(--tap-lg); padding: var(--sp-2) var(--sp-1); border: 0; border-radius: var(--r-lg); background: transparent; color: var(--text); font: inherit; font-size: var(--fs-caption1); font-weight: 600; text-align: center; cursor: pointer; }
  .sw-app .app-icon { --icon-box: 56px; }
  .sw-app .sw-name { line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sw-app:active { transform: scale(.94); }
  @media (hover: hover) and (pointer: fine) { .sw-app:hover { background: var(--hover); } }
  :root[data-kind="kid"] .switch-list { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
  :root[data-kind="kid"] .sw-app { font-size: var(--fs-body); }
  :root[data-kind="kid"] .sw-app .app-icon { --icon-box: 80px; }

  /* ── viewer: an app opens out of its tile ─────────────────────── */
  #viewer { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column; transform-origin: var(--ox, 50%) var(--oy, 50%); }
  #viewer.on { display: flex; animation: viewer-in var(--dur-3) var(--spring); }
  #viewer.closing { animation: viewer-out var(--dur-2) var(--ease-in-out) forwards; pointer-events: none; }   /* a tap during the exit reaches what is under it (P4-MOTION-02) */
  @keyframes viewer-in { from { opacity: 0; transform: scale(.9); border-radius: var(--r-xl); } }
  @keyframes viewer-out { to { opacity: 0; transform: scale(.94); } }
  #viewer.dark { background: var(--viewer-loading-bg); }
  /* UX-PRAYER-9: the app asked for the whole screen (hub.immersive): the bar steps aside and the notch stays clear (an iframe
     gets no safe-area insets of its own). It comes back on hub.immersive(false), Escape, a close, a reload or another app. */
  #viewer.immersive { padding-top: var(--safe-top); }
  #viewer.immersive #pill { display: none; }
  #frame { flex: 1; width: 100%; border: 0; background: transparent; }
  /* a slim bar above the app, never over it — apps keep their own bottom navigation free. Nothing passes beneath it, so it is
     solid material, not live glass (VIS-GLASS-2): no blur, no drifting pickup */
  #pill { flex: none; min-height: 48px; color: var(--text-2); }
  .ds #pill.topbar { position: relative; background: var(--material-solid-bg); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 -1px 0 var(--separator); text-shadow: none; }
  .ds #pill.topbar::after { content: none; }
  .ds #pill.topbar svg { filter: none; }
  /* UX-SYNC-a1: "Saving…" / "Offline · 3 waiting", over every app */
  #pill .pill-sync { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 var(--sp-3); border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-caption1); font-weight: 600; white-space: nowrap; }
  #pill .pill-sync[hidden] { display: none; }
  #pill .pill-sync .dot { width: 8px; height: 8px; }
  /* UX-PROF-a9: a kid's viewer bar is 64 px targets with their icons */
  :root[data-kind="kid"] #pill { min-height: 72px; }
  :root[data-kind="kid"] #pill button { min-height: var(--tap); min-width: var(--tap); font-size: var(--fs-body); }
  :root[data-kind="kid"] #pill .icon { width: 28px; height: 28px; }
  #pill button { min-width: 44px; min-height: 44px; border: 0; border-radius: var(--r); background: transparent; color: inherit; font: inherit; font-weight: 600; font-size: var(--fs-sm); padding: 0 var(--sp-3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background var(--dur-1) var(--ease), transform var(--dur-2) var(--spring); }
  #pill button:active { transform: scale(.94); }
  #pill #pill-name { flex: 1; min-width: 6em; justify-content: center; color: var(--text); white-space: nowrap; }   /* the app's name never squeezes away (review of batch 2a) */
  #pill #pill-sync-s { display: none; }
  /* a phone: the sync chip shortens to "1 waiting" and the back button to its arrow (its label stays in aria-label), so the name,
     the chip, a running timer and Reload share one line at 375 */
  @media (max-width: 599px) {
    #pill #pill-sync-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* still read out */
    #pill #pill-sync-s { display: inline; }
    #pill .pill-sync { padding: 0 var(--sp-2); }
    #pill:has(#pill-sync:not([hidden])) #pill-back, #pill:has(#pill-timer:not([hidden])) #pill-back { display: none; }
    #pill #pill-home, #pill #pill-reload, #pill #pill-timer { flex: none; padding: 0 var(--sp-2); }
  }
  #pill #pill-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #pill .icon { width: 20px; height: 20px; }
  @media (hover: hover) and (pointer: fine) { #pill button:hover { background: var(--hover); } }
  .ds .toast { bottom: calc(88px + var(--safe-bottom)); }
  @media (min-width: 1024px) { .ds .toast { bottom: var(--sp-8); left: calc(50% + 110px); } }

  /* ── timer pill: a running kitchen timer follows you across every tab (timer.active, person scope) ── */
  #timer-pill { position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translateX(-50%); z-index: 25;
    min-height: 44px; padding: 0 var(--sp-5) 0 var(--sp-4); gap: var(--sp-3); color: var(--text); font: inherit; font-weight: 600; font-size: var(--fs-md);
    cursor: pointer; white-space: nowrap; animation: tp-in var(--dur-3) var(--spring); }
  @keyframes tp-in { from { opacity: 0; } }
  #timer-pill[hidden] { display: none; }
  #timer-pill .icon { width: 20px; height: 20px; color: var(--accent-deep); }
  #timer-pill .tp-time { font-family: var(--font-numeral); font-variant-numeric: tabular-nums; letter-spacing: .01em; min-width: 3.2em; text-align: left; color: var(--accent-strong); }
  #timer-pill .tp-ring .ring { --tint: var(--accent); width: 22px; height: 22px; } #timer-pill .tp-ring .ring circle { stroke-width: 7; }
  #timer-pill:active { transform: translateX(-50%) scale(.96); }
  @media (hover: hover) and (pointer: fine) { #timer-pill:hover { --g: var(--glass-strong); } }
  /* VIS-HOME-2: the pill keeps its own band — the page reserves room for it above the tab bar, so it never sits on content —
     and on the desktop it lives at the foot of the sidebar, beside the content, not over it */
  @media (min-width: 1024px) { #timer-pill { left: var(--sp-3); width: calc(220px - 2 * var(--sp-3)); justify-content: center; bottom: calc(var(--sp-6) + var(--safe-bottom)); transform: none; } #timer-pill:active { transform: scale(.96); } }
  :root { --tp-room: 64px; } :root[data-glance] { --tp-room: 92px; }
  @media (max-width: 1023px) {
    /* the scroller ends above the pill's band, so nothing scrolls under it (the Chat tab keeps its composer layout below) */
    :root[data-timer]:not([data-kind="kiosk"]):not([data-tab="chat"]):not([data-kind="kitchen"][data-tab="home"]) #views {   /* the kitchen's Home hides the pill: no band there */ margin-bottom: calc(80px + var(--tp-room) + var(--safe-bottom)); padding-bottom: var(--sp-4); }
  }
  :root[data-kind="kiosk"] #timer-pill { bottom: calc(var(--sp-6) + var(--safe-bottom)); cursor: default; }
  /* on the Chat tab the composer owns that band: the pill lifts above it (--chat-h is the composer's measured height), and the
     log keeps room for both, so the newest bubble is never under the pill (VIS-TIMER-5) */
  @media (max-width: 1023px) {
    :root[data-tab="chat"] #timer-pill { bottom: calc(76px + var(--safe-bottom) + var(--chat-h, 60px) + var(--sp-3)); }
    :root[data-timer][data-tab="chat"] .chat { padding-bottom: calc(92px + var(--tp-room)); }
  }
  /* inside an app the countdown sits in the slim bar above it, never over the app */
  #pill #pill-timer { color: var(--accent-strong); font-family: var(--font-numeral); font-variant-numeric: tabular-nums; gap: 6px; }
  #pill #pill-timer .icon { color: var(--accent-deep); }
</style>
</head>
<body class="ds">

<div id="gate" hidden>
  <div class="welcome-art" aria-hidden="true"><svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice" fill="none">
    <path d="M-20 250c120-70 220-90 340-60s220 90 500 20v120H-20z" fill="var(--accent)" fill-opacity=".14"/>
    <path d="M-20 290c160-90 300-80 420-30s240 40 420-40v110H-20z" fill="var(--accent)" fill-opacity=".22"/>
  </svg></div>
  <div class="gate-panel" id="gate-panel"></div>
</div>

<div id="shell" hidden>
  <main id="views">
    <div id="ptr"><span class="glass-strong"><svg class="icon"><use href="#i-arrow"/></svg></span></div>
    <section class="view" id="view-home" aria-label="Home"></section>
    <section class="view" id="view-apps" aria-label="Apps">
      <div class="view-title"><h1>Apps</h1></div>
      <div class="grid stagger" id="grid"></div>
    </section>
    <section class="view" id="view-chat" aria-label="Chat">
      <div class="view-title"><h1>Chat</h1><span class="small muted" id="chat-cap"></span></div>
      <div class="chat" id="chat-log" aria-live="polite"></div>
      <form class="chat-form glass-strong" id="chat-form" autocomplete="off" hidden>
        <button type="button" class="btn btn-round btn-ghost" id="chat-mic" aria-label="Say it instead" hidden><svg class="icon"><use href="#i-mic"/></svg></button>
        <input class="input" id="chat-in" aria-label="Message to the house" placeholder="Ask or tell the house…" maxlength="2000" enterkeyhint="send">
        <span class="chat-count" id="chat-count" hidden></span>
        <button class="btn btn-primary btn-round" type="submit" id="chat-send" aria-label="Send"><svg class="icon"><use href="#i-send"/></svg></button>
        <button class="btn btn-soft btn-round" type="button" id="chat-stop" aria-label="Stop" hidden><svg class="icon"><use href="#i-stop"/></svg></button>
      </form>
    </section>
    <section class="view" id="view-me" aria-label="Me"></section>
  </main>
  <nav id="tabbar" class="tabbar sidebar" aria-label="Sections">
    <div class="brand" id="brand"></div>
    <div class="tabs" style="--tabs:4;--i:0"><span class="tab-ind" id="tab-ind"></span>
      <button class="tab" data-tab="home"><svg class="icon"><use href="#i-home"/></svg>Home</button>
      <button class="tab" data-tab="apps"><svg class="icon"><use href="#i-apps"/></svg>Apps</button>
      <button class="tab" data-tab="chat"><svg class="icon"><use href="#i-chat"/></svg>Chat</button>
      <button class="tab" data-tab="me"><svg class="icon"><use href="#i-me"/></svg><span class="dot dot-offline" id="syncdot" title="Sync"></span>Me</button>
    </div>
  </nav>
</div>

<button id="timer-pill" class="pill" hidden aria-label="Kitchen timer running — open it"><svg class="icon"><use href="#i-timer"/></svg><span class="tp-time" id="timer-pill-time">0:00</span><span class="ringwrap tp-ring" aria-hidden="true"><svg class="ring" id="timer-pill-ring" viewBox="0 0 52 52" style="--p:1"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" cx="26" cy="26" r="22"/></svg></span></button>

<div id="viewer">
  <div id="pill" class="topbar">
    <button id="pill-home" aria-label="Back to Apps"><svg class="icon"><use href="#i-back"/></svg><span id="pill-back">Apps</span></button>
    <button id="pill-name" aria-label="Switch app"><span id="pill-label">App</span><svg class="icon" style="transform:rotate(180deg)"><use href="#i-chev"/></svg></button>
    <span id="pill-sync" class="pill-sync" role="status" aria-live="polite" hidden><span class="dot" id="pill-sync-dot"></span><span id="pill-sync-t"></span><span id="pill-sync-s" aria-hidden="true"></span></span>
    <button id="pill-timer" hidden aria-label="Kitchen timer running — open it"><svg class="icon"><use href="#i-timer"/></svg><span id="pill-timer-time">0:00</span></button>
    <button id="pill-reload" aria-label="Reload this app"><svg class="icon"><use href="#i-refresh"/></svg></button>
  </div>
  <iframe id="frame" title="App" allow="microphone; camera; web-share; geolocation; screen-wake-lock"></iframe>
</div>

<script src="apps/hub.js" data-app="hub" data-scope="family"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  const esc = hub.escape;
  const DEVICE_NAME = (() => { const u = navigator.userAgent;
    if (/iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
    if (/iPhone/.test(u)) return 'iPhone'; if (/Android/.test(u)) return 'Android'; if (/Mac/.test(u)) return 'Mac';
    if (/Windows/.test(u)) return 'Windows PC'; return 'Device'; })();
  const SWATCHES = ['#4F5D8C', '#BC5A38', '#137F77', '#B4861B', '#8A6A4B', '#3D5A3D', '#5B8143', '#4C4C58', '#8C4F7A', '#4C7B6A'];
  const FALLBACK = 'graphite';   // the family of a record (person or app) with no colour: graphite, nobody's (ACCENT-6)
  // An app's own colour family (D5): apps.json "hue"; an entry without one is graphite, never a person's family.
  const appHue = a => (a && hub.HUES.includes(a.hue) ? a.hue : FALLBACK);
  const hueOf = p => (p ? hub.hueOf(p) : FALLBACK);
  const hueOfApp = id => appHue(appById(id));   // D5 by id: honey for Kid Verse, cornflower for F260, apricot for Prayer…
  let registry = { title: 'Anderson House', apps: [] };
  let current = null;
  const svgCache = {};
  const buzz = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch {} };
  const avatar = (p, cls = '', size = 'sm') => hub.avatarHtml(p, cls, size);

  // Data the dashboard reads from other apps (each app still owns its own keys).
  hub.use('reminders', 'family').use('f260', 'person').use('leftovers', 'family').use('prayer', 'person').use('hub', 'person').use('timer', 'person')
    .use('dollywood-live', 'family').use('kidverse', 'both');   // park days + kids' stars (kidverse writes; the shell only reads)

  // ── registry ──────────────────────────────────────────────────
  async function loadRegistry() {
    try {
      const r = await fetch('apps.json?ts=' + Date.now(), { cache: 'no-store' });
      registry = await r.json();
      try { localStorage.setItem('hub.registry', JSON.stringify(registry)); } catch {}
    } catch {
      try { registry = JSON.parse(localStorage.getItem('hub.registry')) || registry; } catch {}
    }
    document.title = registry.title || 'Anderson House';
  }
  const appById = id => registry.apps.find(a => a.id === id);
  // item 23: guests. hub.profile has no guest flag; the raw server profile in the session does. Guest ids are never in
  // apps.json's visibleTo, so a guest sees every app that is open to everyone or to at least one household adult.
  const isGuest = () => !!(hub.session && hub.session.profile && hub.session.profile.is_guest);
  const householdAdultIds = () => hub.people().filter(x => x.kind === 'adult' && !x.is_guest).map(x => x.id);
  const guestUntil = p => !p.expires_at ? '' : (p.expires_at < Date.now() ? 'ended ' : 'until ') + new Date(p.expires_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).replace(/ /g, '\u00a0');   // the date never splits across lines
  const KITCHEN_APPS = ['leftovers', 'prayer', 'timer', 'tally'];   // KITCHEN-1: the family apps (the Worker holds the same list)
  const visibleApps = () => {
    const p = hub.profile; if (!p || p.kind === 'kiosk') return [];
    if (p.kind === 'kitchen') return registry.apps.filter(a => KITCHEN_APPS.includes(a.id));
    if (isGuest()) { const adults = householdAdultIds(); return registry.apps.filter(a => !a.visibleTo || a.visibleTo.some(id => adults.includes(id))); }
    return registry.apps.filter(a => !a.visibleTo || a.visibleTo.includes(p.id));
  };
  const canSee = id => visibleApps().some(a => a.id === id);
  async function iconHtml(a) {
    const ic = a.icon || '';
    if (/\.svg$/i.test(ic)) {
      if (!svgCache[ic]) { try { const r = await fetch(ic); svgCache[ic] = r.ok ? await r.text() : ''; } catch { svgCache[ic] = ''; } }
      if (svgCache[ic]) return svgCache[ic].replace('<svg', '<svg class="icon"');
    }
    if (ic.trim().startsWith('<svg')) return ic.replace('<svg', '<svg class="icon"');
    return esc(ic || a.name.slice(0, 1));
  }

  // ── gate ──────────────────────────────────────────────────────
  const gate = $('#gate'), panel = $('#gate-panel'), shell = $('#shell');
  function showGate(html) { shell.hidden = true; gate.hidden = false; panel.innerHTML = html; gate.scrollTop = 0; renderTimerPill(); }

  function showPairing(msg) {
    showGate(`
      <div class="gate-title pop-in"><h1>${esc(registry.title || 'Anderson House')}</h1><p>First time on this ${esc(DEVICE_NAME)}? Enter the house pairing code once.</p></div>
      <form class="card glass-strong gate-card stack pop-in" id="pairform" style="max-width:440px;margin:0 auto">
        <label class="field"><span class="label">Pairing code</span><input class="input" id="paircode" type="password" autocomplete="off" autocapitalize="off" inputmode="text" required minlength="6" autofocus></label>
        <label class="field"><span class="label">Name this device</span><input class="input" id="pairname" value="${esc(DEVICE_NAME)}" maxlength="40"></label>
        <p class="pin-msg" id="pairmsg">${esc(msg || '')}</p>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Pair this device</button>
      </form>`);
    $('#pairform').addEventListener('submit', async ev => {
      ev.preventDefault();

  // ── GAP-ACCENT-1: the 18 colour families the admin may give anyone (audits/05-decisions.md, "Admin-assigned colours") ──
  // The people's nine first, then the nine app colours, each labelled with the app that wears it (D5,
  // audits/tools/phase5/app-hues.mjs). The admin decides; the picker only warns: a colour someone already wears, an app's
  // colour, and one a colour-blind eye would take for another person's. CVD_PAIRS are the pairs whose identity marks
  // (-graphic, the ring round a face) sit under ΔE2000 6 with protanopia or deuteranopia, in the light or the dark scheme
  // (design.css tokens through colour-lib.mjs simulate + de2000); the nine people's colours are never under 11 with each
  // other, so every pair here is a warning. It holds both pairs the decision names (apricot/peach, cornflower/periwinkle).
  const PEOPLE_FAMS = ['bubblegum', 'peach', 'butter', 'mint', 'aqua', 'sky', 'periwinkle', 'lavender', 'graphite'];
  const APP_FAMS = [['coral', 'timer'], ['apricot', 'prayer'], ['honey', 'kidverse'], ['pistachio', 'verses'], ['leaf', 'leftovers'], ['seafoam', 'tally'], ['lagoon', 'dollywood-live'], ['cornflower', 'f260'], ['orchid', 'dollywood']];
  const CVD_PAIRS = new Set(['honey/pistachio', 'apricot/peach', 'apricot/honey', 'butter/pistachio', 'honey/peach', 'honey/leaf', 'apricot/pistachio', 'apricot/leaf',
    'lagoon/orchid', 'cornflower/periwinkle', 'orchid/sky', 'leaf/peach', 'leaf/pistachio', 'coral/leaf', 'coral/seafoam', 'lavender/orchid']);
  const famName = h => h.charAt(0).toUpperCase() + h.slice(1);
  const famApp = h => { const a = APP_FAMS.find(x => x[0] === h); return a ? ((appById(a[1]) || {}).name || a[1]) : ''; };
  // the hex that travels with a family for older copies of the hub: a starting colour's own hex, else graphite's (nobody's).
  // Always a #rrggbb (the Worker refuses anything else): an app family has no starting hex of its own (review of batch 2a).
  const GRAPHITE_HEX = SWATCHES[7];   // '#4C4C58', graphite in the bootstrap's table
  const famHex = h => SWATCHES.find(c => hub.hueOf({ color: c }) === h) || GRAPHITE_HEX;
  const namesList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  /** What the admin should know before giving `q` the family `h` (people = the admin's profile list). */
  function hueWarnings(h, q, people) {

    const same = others.filter(x => hub.hueOf(x) === h).map(x => x.name);
    if (same.length) out.push(`${namesList(same)} already ${same.length === 1 ? 'wears' : 'wear'} ${famName(h)}.`);
    if (famApp(h)) out.push(`${famName(h)} is the colour of the ${famApp(h)} app.`);
    const cvd = others.filter(x => CVD_PAIRS.has([h, hub.hueOf(x)].sort().join('/'))).map(x => `${x.name} (${famName(hub.hueOf(x))})`);

        const r = await hub.request('/api/admin/profiles', { method: 'POST', body: { name, emoji, kind, hue, color: famHex(hue), admin_pin: pin } });
        sh.close(); hub.toast(`${r.profile.name} is part of the household.`, 4000);
        try { await hub.profiles(); } catch {}
        renderAdmin();
        if (r.setup_code) showCodeSheet(r.profile, r.setup_code, r.code_expires_at);
      });
    });
  }
  /** Admin → Household: add a person, add an admin, hand yours over, take an admin away, remove a person. */
  async function householdFlow(kind, list) {
    if (kind === 'add') return addPersonSheet(list);
    const self = hub.profile && hub.profile.id;
    const home = list.filter(x => !x.is_guest && (x.kind === 'adult' || x.kind === 'kid'));
    const noPin = x => x.kind === 'adult' && !x.has_pin ? 'needs a PIN first' : '';
    const pool = {
      admin: home.filter(x => x.kind === 'adult' && !x.is_admin).map(x => ({ profile: x, note: noPin(x) })),
      handover: home.filter(x => x.kind === 'adult' && x.id !== self).map(x => ({ profile: x, note: noPin(x) })),
      unadmin: list.filter(x => x.is_admin).map(x => ({ profile: x, note: '' })),
      remove: home.filter(x => x.id !== self).map(x => ({ profile: x, note: x.is_admin ? 'an admin: take that away first' : '' })),
    }[kind];
    const head = { admin: ['Who else should be an admin?', 'An admin manages the household, devices and PINs from their own Me tab.'],
      handover: ['Hand your admin to…', 'They become the admin and you stop being one.'],
      unadmin: ['Whose admin should go?', 'The house keeps at least one admin.'],
      remove: ['Who is leaving the household?', 'Their profile and their own data go from every device.'] }[kind];
    if (!pool || !pool.length) { hub.toast(kind === 'remove' ? 'There is nobody else to remove.' : 'There is no one to choose.'); return; }
    const q = await pickFaceSheet(head[0], head[1], pool); if (!q) return;
    const call = (path, method, body) => pin => hub.request(path, { method, body: { ...body, admin_pin: pin } });
    const step = {
      admin: [`Make ${q.name} an admin?`, `${q.name} can then manage the household, devices and PINs.`, 'Make admin', false, call(`/api/admin/profiles/${encodeURIComponent(q.id)}/admin`, 'PUT', { is_admin: true }), `${q.name} is an admin now.`],
      handover: [`Hand your admin to ${q.name}?`, `${q.name} becomes the admin and you stop being one. Only an admin can give it back.`, 'Hand over', true, call(`/api/admin/profiles/${encodeURIComponent(q.id)}/admin`, 'PUT', { is_admin: true, transfer: true }), `${q.name} is the admin now.`],
      unadmin: [q.id === self ? 'Stop being an admin?' : `Take ${q.name}'s admin away?`, q.id === self ? 'You keep your profile and data; the admin panel leaves your Me tab.' : `${q.name} keeps their profile and data.`, 'Take admin away', true, call(`/api/admin/profiles/${encodeURIComponent(q.id)}/admin`, 'PUT', { is_admin: false }), q.id === self ? 'You are no longer an admin.' : `${q.name} is no longer an admin.`],
      remove: [`Remove ${q.name} from the household?`, `${q.name}'s profile and their own data (private lists, reading plan, settings, photo, chat) are deleted on every device. Family lists stay.`, 'Remove', true, call(`/api/admin/profiles/${encodeURIComponent(q.id)}/remove`, 'POST', {}), `${q.name} was removed.`],
    }[kind];
    adminPinSheet(step[0], step[1], step[2], step[3], async pin => {
      await step[4](pin);
      hub.toast(step[5], 4000);
      try { await hub.profiles(); } catch {}
      const lostAdmin = (kind === 'handover') || (kind === 'unadmin' && q.id === self);
      if (lostAdmin && hub.session) { hub.setSession({ ...hub.session, profile: { ...hub.session.profile, is_admin: false } }); renderMe(); renderBrand(); }
      else renderAdmin();
    });
  }
  function editProfile(q, list = hub.people()) {
    let hue = hub.hueOf(q);
    const kitchen = q.kind === 'kitchen';   // KITCHEN-1: not a person; only its colour can change
    const sh = sheet(`<h2>Edit ${esc(q.name)}</h2>
      <form id="pform" class="stack" style="margin-top:var(--sp-3)">
        <label class="field"><span class="label">Name</span><input class="input" id="pname" value="${esc(q.name)}" maxlength="40" required ${kitchen ? 'disabled' : ''}></label>
        <label class="field"><span class="label">Emoji</span><input class="input" id="pemoji" value="${esc(q.emoji)}" maxlength="8" style="font-size:var(--fs-xl)" ${kitchen ? 'disabled' : ''}></label>
        <div class="field"><span class="label">Photo</span><div class="hstack">${avatar(q)}<button class="btn" type="button" data-photo="pick">Choose a photo</button>${q.photo ? '<button class="btn btn-ghost" type="button" data-photo="remove">Remove</button>' : ''}</div></div>
        <div class="field" id="pfam"><span class="label">Colour</span>${familyPickerHtml(hue, q, list)}</div>
        <label class="field"><span class="label">Kind</span><select class="select" id="pkind" ${q.is_admin || kitchen ? 'disabled' : ''}>${kitchen ? '<option value="kitchen" selected>Kitchen (shared device)</option>' : ''}${(kitchen ? [] : ['adult', 'kid', 'kiosk']).map(k => `<option value="${k}" ${q.kind === k ? 'selected' : ''}>${({ adult: 'Adult (PIN)', kid: 'Kid (no PIN, fewer apps)', kiosk: 'Display (read-only)' })[k]}</option>`).join('')}</select></label>
        <p class="pin-msg" id="pmsg"></p>
        <div class="hstack"><button class="btn btn-ghost grow" type="button" data-close>Cancel</button><button class="btn btn-primary grow" type="submit">Save</button></div>
      </form>`);
    wireFamilyPicker(sh.el.querySelector('#pfam'), q, list, h => { hue = h; });
    sh.el.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-photo]'); if (!b) return;
      if (b.dataset.photo === 'remove') { try { await hub.removePhoto(q.id); hub.toast('Photo removed.'); sh.close(); renderMe(); } catch (e) { hub.toast(e.message); } return; }
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return; hub.toast('Uploading…', 60000); try { await hub.uploadPhoto(f, q.id); hub.toast('Photo saved.'); sh.close(); renderMe(); } catch (e) { hub.toast(e.message || 'Could not upload that.', 4000); } };
      inp.click();
    });
    sh.el.querySelector('#pform').addEventListener('submit', async ev => {
      ev.preventDefault();
      // the hex changes only with the family, so a person whose hex no swatch has keeps it until their family is changed
      const color = hue === hub.hueOf(q) && /^#[0-9a-f]{6}$/i.test(q.color || '') ? q.color : famHex(hue);
      const body = kitchen ? { color, hue } : { name: sh.el.querySelector('#pname').value.trim(), emoji: sh.el.querySelector('#pemoji').value.trim() || q.emoji, color, hue, kind: sh.el.querySelector('#pkind').value };
      try {
        const r = await hub.request(`/api/admin/profiles/${q.id}`, { method: 'PUT', body });
        if (hub.profile && hub.profile.id === q.id) hub.setSession({ token: hub.session.token, profile: { ...hub.session.profile, ...r.profile } });
        sh.close(); hub.toast('Saved.'); renderMe(); renderBrand();
        if (r.setup_code) showCodeSheet(r.profile, r.setup_code, r.code_expires_at);
      } catch (err) { sh.el.querySelector('#pmsg').textContent = err.message; }
    });
  }

  // ── service worker ────────────────────────────────────────────
  // P2-PWA-08: a hub that is never closed (the kitchen iPad, the TV) still takes a new build. It asks for one when it comes
  // back into view and every hour; sw.js activates a new build at once, and the page reloads itself on the same tab at an
  // idle moment: hidden or 20 s untouched, and nothing that would be lost (nothing typed or open in a sheet, in the shell or
  // the open app; no reply on its way; no PIN being typed).
  // P2-PWA-15: only a page that was already run by a service worker when it loaded has an update to take; a first install
  // is not an update and says nothing.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    let hadController = !!navigator.serviceWorker.controller;
    let updateReady = false, lastTouch = Date.now(), lastCheck = 0;
    for (const e of ['pointerdown', 'keydown', 'wheel', 'touchstart']) document.addEventListener(e, () => { lastTouch = Date.now(); }, { capture: true, passive: true });
    // what would be lost: a half-typed field or an open sheet in the open app (a same-origin frame), the chat composer, a
    // reply on its way, a sheet in the shell, a PIN being typed (review of batch 2b: these hold whether hidden or not)
    const EDIT = 'input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=range]), textarea, [contenteditable=""], [contenteditable="true"]';
    // a sheet or dialog counts only when it is actually on screen (apps hide theirs with CSS, not the hidden attribute), and a
    // field counts only when the person changed it: not one the app filled in itself — a date or time field holding today's
    // household date, or its data-prefill value (review round 2: an untouched Larder, F260 or park map must take the update)
    const shown = el => { try { return el.checkVisibility ? el.checkVisibility({ checkOpacity: true, checkVisibilityCSS: true }) : !!(el.offsetParent || el.getClientRects().length); } catch { return true; } };
    const prefilled = el => { const v = String(el.value || '').trim(), ty = (el.type || '').toLowerCase();
      if (el.dataset && 'prefill' in el.dataset && v === String(el.dataset.prefill)) return true;
      return ['date', 'time', 'datetime-local', 'month', 'week'].includes(ty) && (v === hub.today() || v.startsWith(hub.today()) || v === hub.today().slice(0, 7)); };
    const typedIn = doc => { try {
      const a = doc.activeElement; if (a && a.matches && a.matches(EDIT) && shown(a) && !prefilled(a)) return true;
      if ([...doc.querySelectorAll('.sheet-backdrop, dialog[open], [role="dialog"]:not([hidden]), [aria-modal="true"]:not([hidden])')].some(shown)) return true;
      return [...doc.querySelectorAll(EDIT)].some(el => el.isContentEditable ? el.textContent.trim() && shown(el) : ('defaultValue' in el ? el.value.trim() && el.value !== el.defaultValue && !prefilled(el) : false));
    } catch { return true; } };
    const appBusy = () => { if (!current) return false; try { const d = frame.contentDocument; return !d || typedIn(d); } catch { return true; } };
    const idle = () => (document.hidden || Date.now() - lastTouch > 20000) && !appBusy() && !chatBusy && !chatIn.value.trim()
      && !document.querySelector('.sheet-backdrop') && !(document.activeElement && document.activeElement !== frame && document.activeElement.matches('input, textarea, select, [contenteditable]'))
      && !(!gate.hidden && document.querySelector('#pad'));
    const applyUpdate = () => {
      if (!updateReady || !idle()) return;
      updateReady = false;
      try { if (!document.hidden && !hub.isKiosk) sessionStorage.setItem('hub.updated', '1'); } catch {}
      location.reload();
    };
    try { if (sessionStorage.getItem('hub.updated')) { sessionStorage.removeItem('hub.updated'); setTimeout(() => hub.toast('The hub is up to date.', 2500), 800); } } catch {}
    navigator.serviceWorker.addEventListener('controllerchange', () => { tellWorker(); if (!hadController) { hadController = true; return; } updateReady = true; applyUpdate(); });   // the first claim of a first install is not an update; any later one is
    navigator.serviceWorker.register('sw.js').then(reg => {
      const check = () => { if (Date.now() - lastCheck < 5 * 60000) return; lastCheck = Date.now(); reg.update().catch(() => {}); };
      document.addEventListener('visibilitychange', () => { if (document.hidden) applyUpdate(); else check(); });
      setInterval(() => { lastCheck = 0; check(); }, 3600000);
      setInterval(applyUpdate, 10000);
      tellWorker();
    }).catch(() => {});
    // PWA-GAP-2, when no service worker event came: the browser's subscription moved on, the house still has the old one
    navigator.serviceWorker.ready.then(async reg => {
      tellWorker();
      if (!pushSupported() || Notification.permission !== 'granted' || !hub.session || !hub.profile || ['kiosk', 'kitchen', 'kid'].includes(hub.profile.kind)) return;
      const sub = await reg.pushManager.getSubscription(); if (!sub) return;
      const s = await hub.request('/api/push/subscribe');
      if (s.subscribed && s.endpoint !== sub.endpoint) await hub.request('/api/push/subscribe', { method: 'POST', body: { subscription: sub.toJSON() } });
    }).catch(() => {});
  }

  // ── boot ──────────────────────────────────────────────────────
  // a notification tap that opened this window says whose it was (sw.js: index.html?to=<profile>#app): someone else's opens
  // nothing of theirs here (review of batch 2b)
  { const q = new URLSearchParams(location.search), to = q.get('to');
    if (to !== null) {
      history.replaceState(null, '', location.pathname + location.hash);
      if (!hub.session || !hub.profile || hub.profile.id !== to) {
        const p = (hub.people() || []).find(x => x.id === to);
        history.replaceState(null, '', location.pathname + '#home');
        if (hub.profile) setTimeout(() => hub.toast('That notification was for ' + (p ? p.name : 'someone else') + '.', 4000), 600);
      }
    } }
  await loadRegistry();
  syncThemeColor();
  window.addEventListener('hub:theme', syncThemeColor);   // hub.js announces every theme, preference and OS change (P4-DARK-04)
  if (!hub.device) showPairing();
  else if (!hub.session) showPicker();
  else enterShell();

  // Keep the screen awake (wake(), kioskWake() above): the TV when the page loads, when the display signs in, when it comes
  // back into view and on a tap or a remote's key; anyone else from their first tap on. Never from a repaint.
  document.addEventListener('pointerdown', () => { if (hub.isKiosk) { if (wakeHint || !wakeLock) kioskWake(); } else { wakeWanted = true; if (!wakeLock) wake(); } });
  document.addEventListener('keydown', () => { if (hub.isKiosk && (wakeHint || !wakeLock)) kioskWake(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (hub.isKiosk) kioskWake(); else if (wakeWanted) wake(); });
  window.addEventListener('load', () => { if (hub.isKiosk) kioskWake(); });
})();
</script>
</body>
</html>
