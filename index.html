<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anderson House</title>
<meta name="description" content="The Anderson family hub: reading plan, fridge list, prayers and reminders, one tap from the Home Screen.">
<meta name="theme-color" content="#F7F2EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="apps/design.css">
<style>
  /* The hub shell. Every colour here is a design.css token; layout is phone-first, then a sidebar + columns at 1024px. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100dvh; position: fixed; inset: 0; overflow: hidden; }
  /* spot illustration in a card's corner (art/app/*.svg); the card's text sits above it */
  .spot { position: absolute; right: 4px; bottom: 0; width: 34%; max-width: 150px; height: auto; opacity: .55; pointer-events: none; z-index: 0; }
  .empty-art { width: min(200px, 60%); margin: 0 auto var(--sp-3); }
  .empty-art img { width: 100%; height: auto; display: block; }
  .hero-soft .hero-art { color: var(--accent); opacity: .8; }

  /* ── gate: a full-bleed welcome ──────────────────────────────── */
  #gate { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: auto;
    padding: calc(var(--sp-8) + var(--safe-top)) var(--sp-4) calc(var(--sp-8) + var(--safe-bottom)); }
  .welcome-art { position: fixed; inset: auto 0 0 0; height: min(40vh, 360px); pointer-events: none; z-index: 0; opacity: .75; }
  .welcome-art svg { width: 100%; height: 100%; display: block; }
  .gate-panel { position: relative; z-index: 1; width: 100%; max-width: 680px; }
  .gate-title { text-align: center; margin-bottom: var(--sp-6); }
  .gate-title h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-hero); letter-spacing: 0; line-height: var(--lh-tight); }
  .gate-title p { color: var(--text-2); margin-top: var(--sp-2); font-size: var(--fs-lg); }
  .gate-card { padding: var(--sp-5); }
  .profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }
  @media (min-width: 560px) { .profiles { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .profiles { grid-template-columns: repeat(4, 1fr); } }
  .pcard { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-3);
    min-height: 156px; padding: var(--sp-4); border: 1px solid var(--glass-line); border-radius: var(--r-xl);
    background: var(--glass-strong); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    box-shadow: var(--e2); color: var(--text); font: inherit; font-weight: 700; font-size: var(--fs-lg);
    cursor: pointer; transition: transform var(--dur-2) var(--spring), box-shadow var(--dur-2) var(--ease); }
  .pcard:active { transform: scale(.95); }
  .pcard .psub { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
  .pcard.last { box-shadow: 0 0 0 2px var(--tint), var(--e3); }
  .pcard.last .psub { color: var(--accent-deep); }
  @media (hover: hover) and (pointer: fine) { .pcard:hover { transform: translateY(-3px); box-shadow: var(--e3); } .pcard.last:hover { box-shadow: 0 0 0 2px var(--tint), var(--e3); } }
  .pcard.skeleton { min-height: 156px; box-shadow: none; border-color: transparent; }
  :root[data-kind="kid"] .pcard, :root[data-kind="kiosk"] .pcard { min-height: 156px; }

  .pin-wrap { max-width: 380px; margin: 0 auto; text-align: center; }
  .pin-who { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .pin-who h2 { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-2xl); letter-spacing: 0; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; min-height: 22px; margin: var(--sp-4) 0 var(--sp-5); }
  .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted-decor); transition: transform var(--dur-2) var(--spring), background var(--dur-1) var(--ease); }
  .pin-dots i.on { background: var(--accent); border-color: var(--accent); transform: scale(1.15); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
  .pin-pad .btn { min-height: 64px; font-size: var(--fs-xl); border-radius: var(--r-lg); background: var(--glass-strong); }
  .pin-msg { min-height: 24px; margin-top: var(--sp-3); color: var(--danger-ink); font-weight: 600; }
  .pin-msg.ok { color: var(--text-2); font-weight: 500; }

  /* ── shell ───────────────────────────────────────────────────── */
  #shell { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #views { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative;
    padding: calc(var(--sp-4) + var(--safe-top)) max(var(--sp-4), var(--safe-right)) calc(var(--sp-4) + 80px + var(--safe-bottom)) max(var(--sp-4), var(--safe-left)); }
  .view { display: none; max-width: 880px; margin: 0 auto; }
  .view.on { display: block; animation: hub-fade var(--dur-2) var(--ease); }
  .view-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-5); min-height: 44px; }
  .view-title h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-3xl); letter-spacing: 0; }
  #ptr { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: center; pointer-events: none; height: 0; overflow: visible; z-index: 5; }
  #ptr span { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--glass-strong); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); box-shadow: var(--e2);
    color: var(--accent-deep); transform: translateY(-56px) rotate(0deg); transition: transform var(--dur-3) var(--spring); }
  #ptr.arm span { transform: translateY(calc(var(--safe-top) + 12px)) rotate(180deg); }
  #ptr.busy span { transform: translateY(calc(var(--safe-top) + 12px)); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: translateY(calc(var(--safe-top) + 12px)) rotate(360deg); } }
  :root[data-kind="kiosk"] #tabbar { display: none; }
  :root[data-kind="kiosk"] #views { padding-bottom: calc(var(--sp-4) + var(--safe-bottom)); }

  /* desktop: sidebar navigation, wider canvas */
  @media (min-width: 1024px) {
    #views { padding-left: calc(220px + var(--sp-8)); padding-right: var(--sp-8); padding-bottom: calc(var(--sp-8) + var(--safe-bottom)); }
    .view { max-width: var(--max); }
    #tabbar .brand { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-3) var(--sp-5); font-family: var(--font-display); font-size: var(--fs-xl); }
    #tabbar .brand .avatar { --size: 36px; }
  }
  #tabbar .brand { display: none; }

  /* ── home ─────────────────────────────────────────────────────── */
  .home-hero { min-height: 190px; margin-bottom: var(--sp-5); padding-right: 40%; }
  /* time of day: a light that falls across the person's colour rather than a second colour mixed into it */
  .home-hero::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; mix-blend-mode: soft-light; }
  .home-hero.morning::before { background: linear-gradient(115deg, var(--gold) 0%, color-mix(in srgb, var(--gold) 40%, transparent) 35%, transparent 65%); }
  .home-hero.afternoon::before { background: linear-gradient(115deg, rgba(255,255,255,.7), transparent 55%); }
  .home-hero.evening::before { background: linear-gradient(115deg, var(--slate), transparent 60%), linear-gradient(0deg, rgba(0,0,0,.5), transparent 60%); }
  .home-hero .hero-title { font-size: clamp(30px, 7vw, 44px); }
  .home-hero .hero-art { width: 46%; max-width: 300px; right: -4px; bottom: -6px; }
  .home-hero .hero-sub { font-size: var(--fs-sm); }
  .home-hero .clock { font-size: clamp(48px, 11vw, 120px); font-weight: 700; letter-spacing: var(--ls-tight); line-height: 1; font-variant-numeric: tabular-nums; margin-top: var(--sp-2); white-space: nowrap; }
  :root[data-kind="kiosk"] .home-hero { min-height: 280px; padding-right: 30%; }
  :root[data-kind="kiosk"] .home-hero .clock { font-size: clamp(64px, 8.5vw, 150px); }
  :root[data-kind="kiosk"] .home-hero .hero-sub { font-size: var(--fs-xl); }
  .kiosk-switch { position: absolute; top: var(--sp-3); right: var(--sp-3); z-index: 2; opacity: .7; }
  .glance { display: grid; grid-template-columns: 1fr; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  @media (min-width: 720px) { .glance { grid-template-columns: 1fr 1fr; gap: var(--sp-4); } }
  @media (min-width: 1024px) { .glance { grid-template-columns: repeat(3, 1fr); } .glance.two { grid-template-columns: 1fr 1fr; } }
  .card h2 { font-size: var(--fs-lg); margin-bottom: var(--sp-3); display: flex; align-items: center; gap: var(--sp-3); position: relative; z-index: 1; }
  .card h2 .app-icon { width: 40px; height: 40px; border-radius: 13px; }
  .gcard { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 196px; }
  .gcard .gbody { flex: 1; display: flex; align-items: center; gap: var(--sp-4); position: relative; z-index: 1; }
  .gbig { font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; min-height: 1.3em; letter-spacing: var(--ls-tight); }
  .gsub { color: var(--text-2); font-size: var(--fs-sm); margin-top: 2px; }
  .gcard .btn { align-self: flex-start; margin-top: var(--sp-3); position: relative; z-index: 1; }
  .fresh { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-2); }
  .fresh .bar { --tint: var(--warn); }
  .fresh .stale .bar { --tint: var(--danger); }
  .fresh .fl { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--text-2); margin-bottom: 3px; }
  .rem-row { align-items: flex-start; }
  .rem-text { font-size: var(--fs-lg); }
  :root[data-kind="kiosk"] .rem-text { font-size: var(--fs-2xl); font-weight: 600; }
  :root[data-kind="kiosk"] .rem-row { min-height: 84px; }
  .rem-by { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
  .add-row { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
  .add-row .input { flex: 1; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: flex; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line-soft); align-items: flex-start; }
  .feed li:last-child { border-bottom: 0; }
  .feed .ftext { flex: 1; min-width: 0; }
  .feed .fwho { font-weight: 700; color: var(--tint-ink, var(--text)); }
  .feed .fwhen { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
  .kid-cta { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-5); border-radius: var(--r-xl); background: var(--surface); color: var(--accent-deep); border: 1px solid var(--line-soft);
    box-shadow: var(--e2); width: 100%; font: inherit; font-weight: 700; font-size: var(--fs-xl); text-align: left; cursor: pointer; min-height: var(--tap-lg); transition: transform var(--dur-2) var(--spring); }
  .kid-cta:active { transform: scale(.97); }
  .kid-cta .app-icon { width: 64px; height: 64px; border-radius: 20px; }
  .two-col { display: grid; grid-template-columns: 1fr; gap: var(--sp-4); }
  @media (min-width: 1024px) { .two-col { grid-template-columns: 3fr 2fr; align-items: start; } }

  /* ── apps grid ────────────────────────────────────────────────── */
  /* minmax(0, 1fr): tracks never grow from a tile's content, so squares stay square next to a wide tile */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-4); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .tile { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2);
    aspect-ratio: 1; padding: var(--sp-2); border: 1px solid var(--line-soft); border-radius: var(--r-lg);
    background: var(--surface); box-shadow: var(--e1); color: var(--text); font: inherit; font-size: var(--fs-xs); font-weight: 600;
    text-align: center; cursor: pointer; transition: transform var(--dur-2) var(--spring), box-shadow var(--dur-2) var(--ease); }
  .tile:active { transform: scale(.93); }
  .tile .ticon { width: 48px; height: 48px; border-radius: 15px; }
  .tile .tlabel { line-height: 1.15; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tile .badge { position: absolute; top: 8px; right: 8px; }
  .tile.wide { grid-column: span 4; aspect-ratio: auto; min-height: 112px; flex-direction: row; justify-content: flex-start; padding: var(--sp-3) var(--sp-4); gap: var(--sp-3); text-align: left; }
  @media (min-width: 700px) { .tile.wide { grid-column: span 3; } }
  .tile.wide .twidget { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-3); }
  .tile.wide .twidget > span:last-child { flex: 1; min-width: 0; }
  .tile.wide .tlabel { display: block; font-size: var(--fs-sm); font-weight: 700; }
  .tile.wide .tsub { font-size: var(--fs-xs); color: var(--text-2); font-weight: 500; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (hover: hover) and (pointer: fine) { .tile:hover { transform: translateY(-3px); box-shadow: var(--e2); } }
  :root[data-kind="kid"] .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
  @media (min-width: 700px) { :root[data-kind="kid"] .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1024px) { :root[data-kind="kid"] .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  :root[data-kind="kid"] .tile { font-size: var(--fs-md); border-radius: var(--r-xl); }
  :root[data-kind="kid"] .tile .ticon { width: 88px; height: 88px; border-radius: 28px; }

  /* ── chat ─────────────────────────────────────────────────────── */
  .chat { display: flex; flex-direction: column; gap: var(--sp-3); padding-bottom: 92px; min-height: 40vh; }
  .mrow { display: flex; gap: var(--sp-2); align-items: flex-end; max-width: 88%; }
  .mrow.user { align-self: flex-end; flex-direction: row-reverse; }
  .mrow .avatar { --size: 30px; box-shadow: none; margin-bottom: 4px; }
  .mrow .app-icon { width: 30px; height: 30px; border-radius: 10px; margin-bottom: 4px; }
  .msg { padding: var(--sp-3) var(--sp-4); border-radius: var(--r-lg); line-height: var(--lh); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .msg.user { background: linear-gradient(180deg, color-mix(in srgb, var(--accent-deep) 88%, white), var(--accent-deep)); color: var(--on-accent); border-bottom-right-radius: 6px; box-shadow: var(--e1); }
  .msg.bot { background: var(--glass-strong); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); border-bottom-left-radius: 6px; box-shadow: var(--e1); }
  .msg.bot.err { border-color: var(--danger); color: var(--danger-ink); }
  .msg .chips { display: flex; flex-direction: column; gap: 4px; margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: 1px dashed var(--line); }
  .msg .chips:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .msg .chips .chip { justify-content: flex-start; min-height: 28px; font-size: var(--fs-xs); border-radius: var(--r-sm); }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .chat-form { position: fixed; left: 0; right: 0; bottom: calc(76px + var(--safe-bottom)); z-index: 19; display: flex; gap: var(--sp-2); align-items: center;
    width: min(100% - 2 * var(--sp-4), 880px); margin: 0 auto; padding: var(--sp-2); border-radius: var(--r-full);
    background: var(--glass-strong); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.3); backdrop-filter: blur(var(--blur)) saturate(1.3); box-shadow: var(--e3); border: 1px solid var(--glass-line); }
  @media (min-width: 1024px) { .chat-form { left: 220px; width: min(100% - 220px - 2 * var(--sp-8), var(--max)); bottom: var(--sp-6); } }
  .chat-form .input { flex: 1; border: 0; background: transparent; min-height: var(--tap); box-shadow: none; }
  .chat-form .input:focus { box-shadow: none; }
  #chat-mic.on { background: var(--danger-soft); color: var(--danger-ink); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(.94); } }
  .chat-note { text-align: center; color: var(--muted); font-size: var(--fs-sm); padding: var(--sp-4); max-width: 46ch; margin: 0 auto; }
  :root[data-kind="kid"] .msg { font-size: var(--fs-lg); }

  /* ── me + admin ───────────────────────────────────────────────── */
  .me-hero { display: flex; align-items: center; gap: var(--sp-4); min-height: 0; padding: var(--sp-5); }
  .me-hero .avatar-xl { --size: 84px; box-shadow: 0 0 0 4px rgba(255,255,255,.55), var(--e2); }
  .photo-btn { position: relative; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; border-radius: 50%; flex: none; }
  .photo-btn:disabled { cursor: default; }
  .photo-btn .photo-badge { position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--accent-deep); box-shadow: var(--e2); }
  .photo-btn .photo-badge .icon { width: 16px; height: 16px; }
  .photo-btn:disabled .photo-badge { display: none; }
  .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); }
  .album-item { position: relative; margin: 0; border-radius: var(--r); overflow: hidden; aspect-ratio: 1; background: var(--surface-2); }
  .album-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .album-item figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: var(--fs-xs); color: var(--on-accent); background: linear-gradient(transparent, rgba(0,0,0,.45)); }
  .album-item .album-del { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; min-height: 32px; }
  .album-item .album-del .icon { width: 16px; height: 16px; }
  .me-hero .hero-title { font-size: var(--fs-2xl); margin: 0; }
  .me-hero .btn { margin: 0; }
  .me-grid { display: grid; grid-template-columns: 1fr; gap: var(--sp-4); }
  @media (min-width: 1024px) { .me-grid { grid-template-columns: 1fr 1fr; align-items: start; } .me-grid .span2 { grid-column: 1 / -1; } }
  .prow .btn { padding: 0 var(--sp-3); white-space: nowrap; }
  .swatches { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform var(--dur-2) var(--spring); }
  .swatch.on { border-color: var(--text); transform: scale(1.1); }
  table.usage { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  table.usage th, table.usage td { text-align: left; padding: var(--sp-2) var(--sp-1); border-bottom: 1px solid var(--line-soft); }
  table.usage th { color: var(--text-2); font-weight: 600; }
  @media (min-width: 1024px) {
    .admin-people .row { display: grid; grid-template-columns: 56px 1fr auto auto; align-items: center; }
  }
  .switch-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-2); margin-top: var(--sp-3); }

  /* ── viewer: an app opens out of its tile ─────────────────────── */
  #viewer { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column; transform-origin: var(--ox, 50%) var(--oy, 50%); }
  #viewer.on { display: flex; animation: viewer-in var(--dur-3) var(--spring); }
  #viewer.closing { animation: viewer-out var(--dur-2) var(--ease-in-out) forwards; }
  @keyframes viewer-in { from { opacity: 0; transform: scale(.9); border-radius: var(--r-xl); } }
  @keyframes viewer-out { to { opacity: 0; transform: scale(.94); } }
  #viewer.dark { background: color-mix(in srgb, var(--slate) 12%, black); }
  #frame { flex: 1; width: 100%; border: 0; background: transparent; }
  /* a slim glass bar above the app, never over it — apps keep their own bottom navigation free */
  #pill { flex: none; min-height: 48px; color: var(--text-2); }
  #pill button { min-width: 44px; min-height: 44px; border: 0; border-radius: var(--r); background: transparent; color: inherit; font: inherit; font-weight: 600; font-size: var(--fs-sm); padding: 0 var(--sp-3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background var(--dur-1) var(--ease), transform var(--dur-2) var(--spring); }
  #pill button:active { transform: scale(.94); }
  #pill #pill-name { flex: 1; justify-content: center; color: var(--text); }
  #pill .icon { width: 20px; height: 20px; }
  @media (hover: hover) and (pointer: fine) { #pill button:hover { background: var(--hover); } }
  .ds .toast { bottom: calc(88px + var(--safe-bottom)); }
  @media (min-width: 1024px) { .ds .toast { bottom: var(--sp-8); left: calc(50% + 110px); } }
</style>
</head>
<body class="ds">

<div id="gate" hidden>

    <path d="M-20 290c160-90 300-80 420-30s240 40 420-40v110H-20z" fill="var(--accent)" fill-opacity=".22"/>

<div id="shell" hidden>

        <input class="input" id="chat-in" placeholder="Ask or tell the house…" maxlength="2000" enterkeyhint="send">

      <button class="tab" data-tab="home"><svg class="icon"><use href="#i-home"/></svg>Home</button>
      <button class="tab" data-tab="apps"><svg class="icon"><use href="#i-apps"/></svg>Apps</button>
      <button class="tab" data-tab="chat"><svg class="icon"><use href="#i-chat"/></svg>Chat</button>
      <button class="tab" data-tab="me"><svg class="icon"><use href="#i-me"/></svg><span class="dot dot-offline" id="syncdot" title="Sync"></span>Me</button>

<script src="apps/hub.js" data-app="hub" data-scope="family"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  const esc = hub.escape;
  const DEVICE_NAME = (() => { const u = navigator.userAgent;
    if (/iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
    if (/iPhone/.test(u)) return 'iPhone'; if (/Android/.test(u)) return 'Android'; if (/Mac/.test(u)) return 'Mac';
    if (/Windows/.test(u)) return 'Windows PC'; return 'Device'; })();
  const SWATCHES = ['#4F5D8C', '#BC5A38', '#137F77', '#B4861B', '#8A6A4B', '#3D5A3D', '#5B8143', '#4C4C58', '#8C4F7A', '#4C7B6A'];
  const FALLBACK = '#8A6A4B';   // profile/app colour when a record has none (the mocha token)
  let registry = { title: 'Anderson House', apps: [] };
  let current = null;
  const svgCache = {};
  const buzz = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch {} };
  const avatar = (p, cls = '', size = 'sm') => hub.avatarHtml(p, cls, size);

  // Data the dashboard reads from other apps (each app still owns its own keys).
  hub.use('reminders', 'family').use('f260', 'person').use('leftovers', 'family').use('prayer', 'person').use('hub', 'person');

  // ── registry ──────────────────────────────────────────────────
  async function loadRegistry() {
    try {
      const r = await fetch('apps.json?ts=' + Date.now(), { cache: 'no-store' });
      registry = await r.json();
      try { localStorage.setItem('hub.registry', JSON.stringify(registry)); } catch {}
    } catch {
      try { registry = JSON.parse(localStorage.getItem('hub.registry')) || registry; } catch {}
    }
    document.title = registry.title || 'Anderson House';
  }
  const appById = id => registry.apps.find(a => a.id === id);
  const visibleApps = () => {
    const p = hub.profile; if (!p || p.kind === 'kiosk') return [];
    return registry.apps.filter(a => !a.visibleTo || a.visibleTo.includes(p.id));
  };
  const canSee = id => visibleApps().some(a => a.id === id);
  async function iconHtml(a) {
    const ic = a.icon || '';
    if (/\.svg$/i.test(ic)) {
      if (!svgCache[ic]) { try { const r = await fetch(ic); svgCache[ic] = r.ok ? await r.text() : ''; } catch { svgCache[ic] = ''; } }
      if (svgCache[ic]) return svgCache[ic].replace('<svg', '<svg class="icon"');
    }
    if (ic.trim().startsWith('<svg')) return ic.replace('<svg', '<svg class="icon"');
    return esc(ic || a.name.slice(0, 1));
  }

  // ── gate ──────────────────────────────────────────────────────
  const gate = $('#gate'), panel = $('#gate-panel'), shell = $('#shell');
  function showGate(html) { shell.hidden = true; gate.hidden = false; panel.innerHTML = html; }

  function showPairing(msg) {
    showGate(`
      <div class="gate-title pop-in"><h1>${esc(registry.title || 'Anderson House')}</h1><p>First time on this ${esc(DEVICE_NAME)}? Enter the house pairing code once.</p></div>
      <form class="card glass gate-card stack pop-in" id="pairform" style="max-width:440px;margin:0 auto">
        <label class="field"><span class="label">Pairing code</span><input class="input" id="paircode" type="password" autocomplete="off" autocapitalize="off" inputmode="text" required minlength="6" autofocus></label>
        <label class="field"><span class="label">Name this device</span><input class="input" id="pairname" value="${esc(DEVICE_NAME)}" maxlength="40"></label>
        <p class="pin-msg" id="pairmsg">${esc(msg || '')}</p>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Pair this device</button>
      </form>`);
    $('#pairform').addEventListener('submit', async ev => {
      ev.preventDefault();
      const btn = ev.target.querySelector('button'); btn.disabled = true; $('#pairmsg').textContent = '';
      try { await hub.pair($('#paircode').value.trim(), $('#pairname').value.trim()); await showPicker(); }
      catch (e) { $('#pairmsg').textContent = e.message; btn.disabled = false; }
    });
  }

  let profiles = [];
  async function showPicker(msg) {
    hub.setSession(null);
    const last = hub.lastProfile();
    showGate(`
      <div class="gate-title pop-in"><h1>${esc(registry.title || 'Anderson House')}</h1><p>Who's this?</p></div>
      <p class="pin-msg" id="pickmsg" style="text-align:center">${esc(msg || '')}</p>
      <div class="profiles" id="profiles">${'<div class="pcard skeleton"></div>'.repeat(8)}</div>`);
    try {
      profiles = await hub.profiles();
      try { localStorage.setItem('hub.profiles', JSON.stringify(profiles)); } catch {}
    } catch (e) {
      try { profiles = JSON.parse(localStorage.getItem('hub.profiles')) || []; } catch { profiles = []; }
      if (!hub.device) return showPairing(e.message);
      if (!profiles.length) { $('#pickmsg').textContent = e.message; return; }
    }
    $('#profiles').classList.add('stagger');
    $('#profiles').innerHTML = profiles.map(p => `
      <button class="pcard${p.id === last ? ' last' : ''}" data-id="${esc(p.id)}" style="--tint:${esc(p.color || FALLBACK)}">
        ${avatar(p, 'avatar-lg')}<span>${esc(p.name)}</span>
        <span class="psub">${p.id === last ? 'Welcome back' : p.kind === 'kid' ? 'Tap to start' : p.kind === 'kiosk' ? 'Display' : (p.has_pin ? 'PIN' : 'Create your PIN')}</span>
      </button>`).join('');
    $('#profiles').addEventListener('click', ev => {
      const b = ev.target.closest('.pcard'); if (!b) return;
      const p = profiles.find(x => x.id === b.dataset.id); if (p) { buzz(); pick(p); }
    });
    const focus = $('#profiles .pcard.last') || $('#profiles .pcard'); if (focus) focus.focus();
  }
  async function pick(p) {
    if (p.kind !== 'adult') {
      try { await hub.login(p.id); enterShell(); }
      catch (e) { $('#pickmsg').textContent = e.message; }
      return;
    }
    if (p.has_pin) showPinPad(p); else showCreatePin(p);
  }
  function padHtml(p, title, hint) {
    return `
      <div class="pin-wrap card glass gate-card pop-in" style="--tint:${esc(p.color || FALLBACK)}">
        <div class="pin-who">${avatar(p, 'avatar-lg')}<h2>${esc(title)}</h2></div>
        <p class="text-2" id="pinhint">${esc(hint)}</p>
        <div class="pin-dots" id="dots" aria-live="polite"></div>
        <div class="pin-pad" id="pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="btn" data-d="${n}">${n}</button>`).join('')}
          <button class="btn btn-ghost" data-a="back" aria-label="Back"><svg class="icon"><use href="#i-back"/></svg></button>
          <button class="btn" data-d="0">0</button>
          <button class="btn btn-ghost" data-a="del" aria-label="Delete"><svg class="icon"><use href="#i-x"/></svg></button>
        </div>
        <p class="pin-msg" id="pinmsg"></p>
        <button class="btn btn-primary btn-lg btn-block" id="pingo" disabled>Continue</button>
      </div>`;
  }
  function keypad(p, title, hint, onSubmit) {
    showGate(padHtml(p, title, hint));
    let pin = '';
    const dots = $('#dots'), go = $('#pingo'), msg = $('#pinmsg');
    const draw = () => { dots.innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); go.disabled = pin.length < 4; };
    draw();
    const submit = async () => {
      if (pin.length < 4) return; go.disabled = true; msg.textContent = ''; msg.classList.remove('ok');
      try { await onSubmit(pin); } catch (e) { msg.textContent = e.message || String(e); pin = ''; draw(); }
    };
    $('#pad').addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return;
      buzz();
      if (b.dataset.d !== undefined && pin.length < 8) { pin += b.dataset.d; draw(); }
      else if (b.dataset.a === 'del') { pin = pin.slice(0, -1); draw(); }
      else if (b.dataset.a === 'back') { stop(); showPicker(); }
    });
    go.addEventListener('click', submit);
    const onKey = ev => {
      if (gate.hidden) return;
      if (/^\d$/.test(ev.key) && pin.length < 8) { pin += ev.key; draw(); }
      else if (ev.key === 'Backspace') { pin = pin.slice(0, -1); draw(); }
      else if (ev.key === 'Enter') submit();
      else if (ev.key === 'Escape') { stop(); showPicker(); }
      else return;
      ev.preventDefault();
    };
    document.addEventListener('keydown', onKey);
    const stop = () => document.removeEventListener('keydown', onKey);
    return { setMessage: (t, ok) => { msg.textContent = t; msg.classList.toggle('ok', !!ok); }, reset: () => { pin = ''; draw(); }, stop, setHint: t => { $('#pinhint').textContent = t; } };
  }
  function showPinPad(p) {
    const k = keypad(p, p.name, 'Enter your PIN', async pin => {
      try { await hub.login(p.id, pin); k.stop(); enterShell(); }
      catch (e) { if (e.error === 'needs_pin_setup') { k.stop(); return showCreatePin(p); } throw e; }
    });
  }
  function showCreatePin(p) {
    let first = null;
    const k = keypad(p, 'Create your PIN', 'Choose 4 to 8 digits. You will type it once more to confirm.', async pin => {
      if (first === null) { first = pin; k.reset(); k.setHint('Type it again to confirm.'); k.setMessage('', true); return; }
      if (pin !== first) { first = null; k.setHint('Choose 4 to 8 digits.'); throw new Error("Those didn't match — start again."); }
      try { await hub.createPin(p.id, pin); k.stop(); enterShell(); }
      catch (e) {
        if (e.error === 'pin_already_set') { k.stop(); return showPinPad({ ...p, has_pin: true }); }
        first = null; k.setHint('Choose 4 to 8 digits.'); throw e;
      }
    });
  }

  // ── shell ─────────────────────────────────────────────────────
  const TABS = ['home', 'apps', 'chat', 'me'];
  let tab = 'home';
  function enterShell() {
    gate.hidden = true; shell.hidden = false;
    chatLoaded = false; $('#chat-log').innerHTML = ''; $('#chat-in').disabled = false; $('#chat-in').placeholder = 'Ask or tell the house…';
    hub.reset(); hub.ready().then(() => { renderGrid(); if (tab === 'home') renderHome(); });
    renderBrand(); renderMe(); renderGrid(); syncThemeColor();
    const h = location.hash.slice(1);
    if (hub.isKiosk) { showTab('home'); return; }
    if (appById(h)) { showTab('apps', true); openApp(h); }
    else showTab(TABS.includes(h) ? h : 'home');
  }
  function renderBrand() {
    const p = hub.profile; if (!p) return;
    $('#brand').innerHTML = `${avatar(p)}<span>${esc(registry.title || 'Anderson House')}</span>`;
  }
  function showTab(t, keepViewer) {
    tab = t; if (!keepViewer) closeViewer();
    $('#chat-form').hidden = t !== 'chat';
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + t));
    document.querySelectorAll('.tab').forEach(b => { b.classList.toggle('on', b.dataset.tab === t); b.setAttribute('aria-current', b.dataset.tab === t ? 'page' : 'false'); });
    $('#tabbar .tabs').style.setProperty('--i', TABS.indexOf(t));
    if (!keepViewer && location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
    if (t === 'home') renderHome();
    if (t === 'me') renderMe();
    if (t === 'apps') renderGrid();
    if (t === 'chat') openChat();
    $('#views').scrollTop = 0;
  }
  $('#tabbar').addEventListener('click', ev => { const b = ev.target.closest('.tab'); if (b) { buzz(); showTab(b.dataset.tab); } });
  window.addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (appById(h)) { if (!current || current.id !== h) openApp(h); }
    else if (TABS.includes(h)) { if (current || h !== tab) showTab(h); }
  });
  // the browser chrome (iOS status bar, Android address bar) follows the hub's paper colour
  function syncThemeColor() {
    try { const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); document.querySelectorAll('meta[name="theme-color"]').forEach(m => { if (bg) m.setAttribute('content', bg); }); } catch {}
  }

  // ── pull to refresh ───────────────────────────────────────────
  const views = $('#views'), ptr = $('#ptr');
  let ptrY = null, ptrArmed = false, refreshing = false;
  views.addEventListener('touchstart', e => { ptrY = views.scrollTop <= 0 && !current ? e.touches[0].clientY : null; ptrArmed = false; }, { passive: true });
  views.addEventListener('touchmove', e => {
    if (ptrY === null || refreshing) return;
    const dy = e.touches[0].clientY - ptrY;
    if (dy > 70 && views.scrollTop <= 0) { if (!ptrArmed) { ptrArmed = true; ptr.classList.add('arm'); buzz(); } }
    else if (ptrArmed) { ptrArmed = false; ptr.classList.remove('arm'); }
  }, { passive: true });
  views.addEventListener('touchend', () => { if (ptrArmed) refreshAll(); ptrY = null; ptrArmed = false; ptr.classList.remove('arm'); }, { passive: true });
  async function refreshAll() {
    if (refreshing) return; refreshing = true; ptr.classList.add('busy');
    try { await Promise.all([hub.pull(), hub.flush(), loadFeed(true)]); }
    finally { refreshing = false; ptr.classList.remove('busy'); if (tab === 'home') renderHome(); if (tab === 'me') renderMe(); }
  }

  // ── apps grid + widgets ───────────────────────────────────────
  const ageDays = s => { const then = new Date(s + 'T00:00:00'); const now = new Date(); now.setHours(0, 0, 0, 0); return Math.floor((now - then) / 86400000); };
  const fridgeDue = () => hub.list('item:', { app: 'leftovers', scope: 'family' }).map(r => r.value)
    .map(i => ({ ...i, days: ageDays(i.dateLogged) })).filter(i => i.days >= 4).sort((a, b) => b.days - a.days);
  function ringHtml(p, label, color, big) {
    return `<span class="ringwrap${big ? ' lg' : ''}"><svg class="ring${big ? ' ring-lg' : ''}" viewBox="0 0 52 52" style="--p:${p};--tint:${esc(color || FALLBACK)}"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" cx="26" cy="26" r="22"/></svg><span class="ring-lbl">${esc(label)}</span></span>`;
  }
  function widgetHtml(a) {
    if (a.id === 'f260') {
      const s = hub.get('f260.summary', { app: 'f260', scope: 'person' });
      if (!s) return `${ringHtml(0, '0/5', a.color)}<span style="min-width:0"><span class="tlabel">${esc(a.name)}</span><span class="tsub">${hub.sync.lastPull ? 'Start week 1' : '<span class="skeleton">loading</span>'}</span></span>`;

      try {
        if (fileFor.kind === 'album') { await hub.addAlbumPhoto(f); renderAlbum(); hub.toast('Added to the album.'); }
        else { await hub.uploadPhoto(f, fileFor.id); hub.toast('Photo saved.'); renderMe(); renderBrand(); }
      } catch (e) { hub.toast(e.message || 'Could not upload that.', 4000); }
    };
    renderAlbum();
  }
  function renderAlbum() {
    const g = $('#album-grid'); if (!g) return;
    const rows = hub.list('album:', { app: 'hub', scope: 'family' }).map(r => r.value).filter(Boolean).sort((a, b) => b.at - a.at);
    const me = hub.profile;
    if (!rows.length) { g.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:var(--sp-4) 0"><div class="empty-art" style="width:120px"><img src="art/empty/feed.svg" alt=""></div>Photos of the family for the TV and the prayer list. Add the first one.</div>'; return; }
    g.innerHTML = rows.map(ph => `<figure class="album-item" style="--tint:${esc(FALLBACK)}"><img src="${esc(hub.photoUrl(ph, 'sm'))}" alt="${esc(ph.caption || '')}" loading="lazy"><figcaption>${esc(ph.byName || '')}</figcaption>${(ph.by === me.id || me.isAdmin) ? `<button class="btn btn-round btn-glass album-del" data-del="${esc(ph.id)}" aria-label="Remove"><svg class="icon"><use href="#i-x"/></svg></button>` : ''}</figure>`).join('');
    g.onclick = async ev => { const b = ev.target.closest('[data-del]'); if (!b) return; if (!confirm('Remove this photo from the album?')) return; try { await hub.removeAlbumPhoto(b.dataset.del); renderAlbum(); } catch (e) { hub.toast(e.message); } };
  }

  // ── chat ──────────────────────────────────────────────────────
  const chatLog = $('#chat-log'), chatIn = $('#chat-in'), chatForm = $('#chat-form'), chatCap = $('#chat-cap');
  let chatLoaded = false, chatBusy = false, chatEnabled = true;
  const scrollChat = () => { views.scrollTop = views.scrollHeight; };
  function bubble(role, text, chips) {
    const row = document.createElement('div'); row.className = 'mrow ' + (role === 'user' ? 'user' : 'bot');
    let who;
    if (role === 'user') { const t = document.createElement('template'); t.innerHTML = avatar(hub.profile); who = t.content.firstElementChild; }
    else { who = document.createElement('span'); who.className = 'app-icon'; who.innerHTML = '<svg class="icon"><use href="#i-sparkle"/></svg>'; }
    const d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    if (text) d.append(document.createTextNode(text));
    if (chips && chips.length) { const c = document.createElement('div'); c.className = 'chips'; for (const ch of chips) { const sp = document.createElement('span'); sp.className = 'chip chip-ok'; sp.textContent = ch; c.append(sp); } d.append(c); }
    row.append(who, d); chatLog.append(row); scrollChat(); return d;
  }
  function chatNote(text, art) {
    const d = document.createElement('div'); d.className = 'chat-note';
    if (art) { const a = document.createElement('div'); a.className = 'empty-art'; a.innerHTML = `<img src="art/empty/${art}.svg" alt="">`; d.append(a); }
    d.append(document.createTextNode(text)); chatLog.append(d); scrollChat(); return d;
  }
  function setCap(used, cap) {
    chatCap.textContent = used != null ? used + '/' + cap + ' today' : '';
    if (used >= cap) { chatIn.disabled = true; chatIn.placeholder = 'Back tomorrow — that is enough for today.'; }
  }
  async function openChat() {
    if (!hub.profile || hub.isKiosk) return;
    if (chatLoaded) { scrollChat(); return; }
    chatLoaded = true;
    chatLog.innerHTML = '<div class="mrow bot"><span class="app-icon skeleton"></span><div class="msg bot"><span class="skeleton" style="width:12em">loading</span></div></div>';
    try {
      const h = await hub.request('/api/chat/history');
      chatLog.innerHTML = '';
      chatEnabled = h.enabled;
      if (!h.enabled) chatNote('The assistant is not set up yet — an API key is needed on the house server.');
      else if (!h.messages.length) chatNote(hub.isKid ? 'Hi ' + hub.profile.name + '! Ask me something fun, or tell me what you did today.' : 'Ask about the fridge or your reading, or say things like "add milk to leftovers" or "remind everyone about the bins".', 'chat');
      for (const m of h.messages) {
        if (m.role === 'assistant') {
          const lines = m.content.split('\n');
          const chips = lines.filter(l => l.startsWith('✓')).flatMap(l => l.split(' · '));
          bubble('assistant', lines.filter(l => !l.startsWith('✓')).join('\n').trim(), chips);
        } else bubble('user', m.content);
      }
      setCap(h.used, h.cap);
    } catch (e) { chatLog.innerHTML = ''; chatNote('Could not load the chat: ' + e.message); }
    scrollChat();
  }
  chatForm.addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = chatIn.value.trim(); if (!text || chatBusy || !chatEnabled) return;
    chatIn.value = ''; chatBusy = true; $('#chat-send').disabled = true;
    bubble('user', text);
    const bot = bubble('bot', '');
    const typing = document.createElement('span'); typing.className = 'typing'; typing.innerHTML = '<i></i><i></i><i></i>'; bot.append(typing);
    let textNode = null, chipsEl = null;
    const apps = registry.apps.map(a => ({ id: a.id, name: a.name, scope: a.scope, visibleTo: a.visibleTo }));
    const handle = (event, data) => {
      if (event === 'text') { typing.remove(); if (!textNode) { textNode = document.createTextNode(''); bot.insertBefore(textNode, chipsEl); } textNode.data += data.text; scrollChat(); }
      else if (event === 'tool') { if (!data.chip) return; if (!chipsEl) { chipsEl = document.createElement('div'); chipsEl.className = 'chips'; bot.append(chipsEl); } const sp = document.createElement('span'); sp.className = 'chip ' + (data.ok ? 'chip-ok' : 'chip-danger'); sp.textContent = data.chip; chipsEl.append(sp); hub.pull(); scrollChat(); }
      else if (event === 'done') { typing.remove(); setCap(data.used, data.cap); if (!textNode && !chipsEl) bot.append(document.createTextNode('(no reply)')); }
      else if (event === 'error') { typing.remove(); bot.classList.add('err'); bot.append(document.createTextNode(data.message || 'Something went wrong.')); }
    };
    try {
      const r = await fetch(hub.api.replace(/\/$/, '') + '/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-Token': hub.device.token, 'X-Profile-Token': hub.session.token }, body: JSON.stringify({ message: text, apps }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); if (r.status === 429 && j.used != null) setCap(j.used, j.cap); throw new Error(j.message || ('HTTP ' + r.status)); }
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      while (true) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          let evName = 'message', data = null;
          for (const line of chunk.split('\n')) { if (line.startsWith('event:')) evName = line.slice(6).trim(); else if (line.startsWith('data:')) { try { data = JSON.parse(line.slice(5)); } catch {} } }
          if (data) handle(evName, data);
        }
      }
    } catch (e) { typing.remove(); bot.classList.add('err'); bot.append(document.createTextNode(e.message)); }
    finally { chatBusy = false; $('#chat-send').disabled = false; if (!chatIn.disabled) chatIn.focus(); }
  });
  {
    const mic = $('#chat-mic'); let rec = null;
    if (hub.voiceSupported) mic.hidden = false;
    mic.addEventListener('click', () => {
      if (rec) { rec.stop(); return; }
      rec = hub.voiceInput(t => { chatIn.value = t; chatIn.focus(); }, { onEnd: () => { rec = null; mic.classList.remove('on'); }, onError: () => { rec = null; mic.classList.remove('on'); } });
      if (rec) mic.classList.add('on');
    });
  }

  // ── notifications (Web Push) ──────────────────────────────────
  const IOS = /iPhone|iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol === 'https:';
  const b64ToBytes = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  async function renderNotif() {
    const help = $('#notif-help'), toggle = $('#notif-toggle'), prefsEl = $('#notif-prefs'); if (!help) return;
    const prefs = { leftovers: true, f260: true, ...(hub.get('push_prefs', { app: 'hub', scope: 'person' }) || {}) };
    prefsEl.querySelectorAll('[data-pref]').forEach(b => b.setAttribute('aria-checked', String(prefs[b.dataset.pref] !== false)));
    prefsEl.onclick = ev => {
      const b = ev.target.closest('[data-pref]'); if (!b) return;
      const next = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', String(next));
      hub.set('push_prefs', { ...prefs, [b.dataset.pref]: next }, { app: 'hub', scope: 'person' }); prefs[b.dataset.pref] = next;
    };
    const test = $('#notif-test');
    if (test) test.onclick = async () => {
      test.disabled = true;
      try { const r = await hub.request('/api/push/test', { method: 'POST', body: {} }); hub.toast(r.sent ? (r.ok ? 'Sent — it should appear in a moment.' : 'The push service refused it: ' + (r.details[0] && (r.details[0].status + ' ' + (r.details[0].error || '')))) : 'No subscription on the server for this device yet.', 4000); }
      catch (e) { hub.toast(e.message); } finally { test.disabled = false; }
    };
    if (!pushSupported()) { help.textContent = IOS && !standalone() ? 'On iPhone and iPad, add the hub to your Home Screen first (Share → Add to Home Screen), then turn this on from there.' : 'This browser cannot receive push notifications.'; return; }
    if (Notification.permission === 'denied') { help.textContent = 'Blocked in the browser settings for this site. Allow notifications there, then come back.'; return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    const paint = () => { toggle.setAttribute('aria-checked', String(!!sub)); toggle.disabled = false; prefsEl.hidden = !sub;
      help.textContent = sub ? 'On for this device. Fridge warnings go to adults at 8 am; the reading nudge comes at 8 pm if nothing is checked off.' : 'Fridge warnings and reading nudges, sent to this device.' + (IOS ? ' Works from the Home Screen app.' : ''); };
    paint();
    toggle.onclick = async () => {
      toggle.disabled = true;
      try {
        if (sub) { await sub.unsubscribe(); try { await hub.request('/api/push/subscribe', { method: 'DELETE' }); } catch {} sub = null; hub.toast('Notifications off for this device.'); }
        else {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') { help.textContent = 'Notifications were not allowed.'; toggle.disabled = false; return; }
          const cfg = await hub.request('/api/push/config');
          if (!cfg.enabled) { help.textContent = 'The house server has no push keys yet.'; toggle.disabled = false; return; }
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(cfg.public_key) });
          await hub.request('/api/push/subscribe', { method: 'POST', body: { subscription: sub.toJSON() } });
          hub.toast('Notifications on for this device.');
        }
      } catch (e) { toggle.disabled = false; toggle.setAttribute('aria-checked', String(!!sub)); help.textContent = 'Could not turn notifications on: ' + (e.message || e) + (/permission denied|push service/i.test(e.message || '') ? ' — this browser could not reach its push service.' : ''); return; }
      paint();
    };
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => {
    if (!ev.data || ev.data.source !== 'hubsw') return;
    if (ev.data.type === 'open') { const h = new URL(ev.data.url).hash; if (h && location.hash !== h) location.hash = h; else if (h) { const id = h.slice(1); appById(id) ? openApp(id) : showTab(TABS.includes(id) ? id : 'home'); } }
  });

  // ── admin panel ───────────────────────────────────────────────
  async function renderAdmin() {
    const body = $('#admin-body'); if (!body) return;
    let list, usage;
    try { [list, usage] = await Promise.all([hub.profiles(), hub.request('/api/admin/usage')]); }
    catch (e) { body.innerHTML = `<p class="text-2">Could not load admin data: ${esc(e.message)}</p>`; return; }
    if (!body.isConnected) return;   // the Me tab was re-rendered (profile switched) while the admin data loaded
    const kindLbl = k => ({ adult: 'Adult', kid: 'Kid', kiosk: 'Display' })[k] || k;
    const day = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const nameOf = id => (list.find(x => x.id === id) || {}).name || id || '—';
    const chatRows = usage.chat.slice(0, 30), pushRows = usage.push.slice(0, 30);
    const me = hub.device && hub.device.id;
    body.innerHTML = `
      <h3 style="margin:var(--sp-2) 0">Profiles</h3>
      <ul class="list admin-people">${list.map(q => `<li class="row prow" style="--tint:${esc(q.color || FALLBACK)}">${avatar(q)}
        <div class="row-main"><div class="row-title">${esc(q.name)}${q.is_admin ? ' · admin' : ''}</div><div class="row-sub">${kindLbl(q.kind)}${q.kind === 'adult' ? (q.has_pin ? ' · PIN set' : ' · no PIN yet') : ''}</div></div>
        <button class="btn" data-edit="${esc(q.id)}">Edit</button>${q.kind === 'adult' && q.has_pin ? `<button class="btn btn-ghost" data-resetpin="${esc(q.id)}">Reset PIN</button>` : '<span></span>'}</li>`).join('')}</ul>
      <h3 style="margin:var(--sp-5) 0 var(--sp-2)">Pairing code</h3>
      <p class="help" style="margin:0 0 var(--sp-3)">New devices need it once. Rotating it does not unpair anything.</p>
      <div class="hstack"><button class="btn" id="rotate-choose">Choose a new code</button><button class="btn btn-ghost" id="rotate-gen">Generate one</button></div>
      <h3 style="margin:var(--sp-5) 0 var(--sp-2)">Devices</h3>
      <ul class="list">${usage.devices.length ? usage.devices.map(d => `<li class="row"><div class="row-main"><div class="row-title">${esc(d.name || 'Unnamed')}</div><div class="row-sub">Paired ${day(d.paired_at)} · seen ${ago(d.last_seen).replace(/^(d)/, '$1 ')}${/^d/.test(ago(d.last_seen)) ? ' ago' : ''}${d.id === me ? ' · this device' : ''}</div></div>
        ${d.id !== me ? `<button class="btn btn-ghost" data-unpair="${esc(d.id)}">Unpair</button>` : ''}</li>`).join('') : '<li class="row muted">No paired devices.</li>'}</ul>
      <h3 style="margin:var(--sp-5) 0 var(--sp-2)">Usage (30 days)</h3>
      <div class="grid-2">
      <table class="usage"><thead><tr><th>Day</th><th>Who</th><th>Chat messages</th></tr></thead><tbody>
        ${chatRows.length ? chatRows.map(r => `<tr><td>${esc(r.day)}</td><td>${esc(nameOf(r.profile_id))}</td><td>${r.messages}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">No chat yet.</td></tr>'}
      </tbody></table>
      <table class="usage"><thead><tr><th>Day</th><th>Who</th><th>Push sent</th><th>Kind</th></tr></thead><tbody>
        ${pushRows.length ? pushRows.map(r => `<tr><td>${esc(r.day)}</td><td>${esc(nameOf(r.profile_id))}</td><td>${r.ok}/${r.sends}</td><td>${esc(r.kind)}</td></tr>`).join('') : '<tr><td colspan="4" class="muted">No pushes yet.</td></tr>'}
      </tbody></table>
      </div>`;
    body.onclick = async ev => {
      const e = ev.target.closest('[data-edit]'); if (e) return editProfile(list.find(x => x.id === e.dataset.edit));
      const r = ev.target.closest('[data-resetpin]'); if (r) {
        const q = list.find(x => x.id === r.dataset.resetpin);
        if (!confirm(`Reset ${q.name}'s PIN? They will create a new one next time they tap their name.`)) return;
        try { await hub.request(`/api/admin/profiles/${q.id}/reset-pin`, { method: 'POST', body: {} }); hub.toast('PIN reset.'); renderAdmin(); } catch (err) { hub.toast(err.message); }
        return;
      }
      const u = ev.target.closest('[data-unpair]'); if (u) {
        if (!confirm('Unpair this device? It will need the pairing code again.')) return;
        try { await hub.request(`/api/admin/devices/${u.dataset.unpair}`, { method: 'DELETE' }); hub.toast('Device unpaired.'); renderAdmin(); } catch (err) { hub.toast(err.message); }
      }
    };
    body.querySelector('#rotate-gen').onclick = async () => {
      if (!confirm('Generate a new pairing code? The old one stops working for new devices.')) return;
      try { const r = await hub.request('/api/admin/pairing-code/rotate', { method: 'POST', body: {} });
        sheet(`<h2>New pairing code</h2><p class="text-2">Write it down — it is shown only once.</p><div class="well" style="font-family:var(--font-mono);font-size:var(--fs-2xl);text-align:center;letter-spacing:.08em;margin:var(--sp-4) 0">${esc(r.code)}</div><button class="btn btn-primary btn-block" data-close>Done</button>`);
      } catch (err) { hub.toast(err.message); }
    };
    body.querySelector('#rotate-choose').onclick = () => {
      const sh = sheet(`<h2>Choose a pairing code</h2><form id="rotform" class="stack" style="margin-top:var(--sp-3)"><input class="input" id="rotcode" placeholder="6 to 64 characters" minlength="6" maxlength="64" required autocomplete="off"><input class="input" id="rotcode2" placeholder="Type it again" required autocomplete="off"><p class="pin-msg" id="rotmsg"></p><button class="btn btn-primary btn-block" type="submit">Set pairing code</button></form>`);
      sh.el.querySelector('#rotform').addEventListener('submit', async ev => {
        ev.preventDefault();
        const a = sh.el.querySelector('#rotcode').value, b = sh.el.querySelector('#rotcode2').value;
        if (a !== b) { sh.el.querySelector('#rotmsg').textContent = "Those don't match."; return; }
        try { await hub.request('/api/admin/pairing-code/rotate', { method: 'POST', body: { code: a } }); sh.close(); hub.toast('Pairing code updated.'); }
        catch (err) { sh.el.querySelector('#rotmsg').textContent = err.message; }
      });
    };
  }
  function editProfile(q) {
    let color = q.color;
    const sh = sheet(`<h2>Edit ${esc(q.name)}</h2>
      <form id="pform" class="stack" style="margin-top:var(--sp-3)">
        <label class="field"><span class="label">Name</span><input class="input" id="pname" value="${esc(q.name)}" maxlength="40" required></label>
        <label class="field"><span class="label">Emoji</span><input class="input" id="pemoji" value="${esc(q.emoji)}" maxlength="8" style="font-size:var(--fs-xl)"></label>
        <div class="field"><span class="label">Photo</span><div class="hstack">${avatar(q)}<button class="btn" type="button" data-photo="pick">Choose a photo</button>${q.photo ? '<button class="btn btn-ghost" type="button" data-photo="remove">Remove</button>' : ''}</div></div>
        <div class="field"><span class="label">Colour</span><div class="swatches" id="swatches">${SWATCHES.map(c => `<button type="button" class="swatch${c === q.color ? ' on' : ''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>
        <label class="field"><span class="label">Kind</span><select class="select" id="pkind" ${q.is_admin ? 'disabled' : ''}>${['adult', 'kid', 'kiosk'].map(k => `<option value="${k}" ${q.kind === k ? 'selected' : ''}>${({ adult: 'Adult (PIN)', kid: 'Kid (no PIN, fewer apps)', kiosk: 'Display (read-only)' })[k]}</option>`).join('')}</select></label>
        <p class="pin-msg" id="pmsg"></p>
        <div class="hstack"><button class="btn btn-ghost grow" type="button" data-close>Cancel</button><button class="btn btn-primary grow" type="submit">Save</button></div>
      </form>`);
    sh.el.querySelector('#swatches').addEventListener('click', ev => { const b = ev.target.closest('.swatch'); if (!b) return; color = b.dataset.c; sh.el.querySelectorAll('.swatch').forEach(x => x.classList.toggle('on', x === b)); });
    sh.el.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-photo]'); if (!b) return;
      if (b.dataset.photo === 'remove') { try { await hub.removePhoto(q.id); hub.toast('Photo removed.'); sh.close(); renderMe(); } catch (e) { hub.toast(e.message); } return; }
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return; hub.toast('Uploading…', 60000); try { await hub.uploadPhoto(f, q.id); hub.toast('Photo saved.'); sh.close(); renderMe(); } catch (e) { hub.toast(e.message || 'Could not upload that.', 4000); } };
      inp.click();
    });
    sh.el.querySelector('#pform').addEventListener('submit', async ev => {
      ev.preventDefault();
      const body = { name: sh.el.querySelector('#pname').value.trim(), emoji: sh.el.querySelector('#pemoji').value.trim() || q.emoji, color, kind: sh.el.querySelector('#pkind').value };
      try {
        const r = await hub.request(`/api/admin/profiles/${q.id}`, { method: 'PUT', body });
        if (hub.profile && hub.profile.id === q.id) hub.setSession({ token: hub.session.token, profile: { ...hub.session.profile, ...r.profile } });
        sh.close(); hub.toast('Saved.'); renderMe(); renderBrand();
      } catch (err) { sh.el.querySelector('#pmsg').textContent = err.message; }
    });
  }

  // ── service worker ────────────────────────────────────────────
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) hub.toast('Hub updated — it will use the new version next time it opens.', 4000); });
      });
    }).catch(() => {});
  }

  // ── boot ──────────────────────────────────────────────────────
  await loadRegistry();
  syncThemeColor();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeColor);
  if (!hub.device) showPairing();
  else if (!hub.session) showPicker();
  else enterShell();

  // Keep the screen awake once the user has interacted (Safari needs a gesture).
  let lock = null;
  async function wake() { if (!('wakeLock' in navigator)) return; try { lock = await navigator.wakeLock.request('screen'); } catch {} }
  document.addEventListener('pointerdown', wake, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && lock) wake(); });
})();
</script>
</body>
</html>
