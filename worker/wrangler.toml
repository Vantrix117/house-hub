name = "house-hub-api"
main = "src/index.js"
compatibility_date = "2026-09-05"
workers_dev = true

[vars]
# Browser origins allowed to call the API. The GitHub Pages site plus the local dev server.
ALLOWED_ORIGINS = "https://vantrix117.github.io,http://localhost:8765,http://127.0.0.1:8765"

[observability]
enabled = true

# The code reads env.DB — this binding name must stay "DB".
[[d1_databases]]
binding = "DB"
database_name = "house-hub"
database_id = "c5410eee-9095-4092-84b0-dc534aded0d8"
