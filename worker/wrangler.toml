name = "house-hub-api"
main = "src/index.js"
compatibility_date = "2026-09-05"
workers_dev = true

[vars]
# Browser origins allowed to call the API. The GitHub Pages site plus the local dev server.
ALLOWED_ORIGINS = "https://vantrix117.github.io,http://localhost:8765,http://127.0.0.1:8765"
# Web Push. The matching private key is a secret: npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "BDLrsVIp1lqTMsTI3FhtB4IGqHSLGRGiEi63gNOW-ofDmSO0fpdCbuTwv2Mkhoy69cJHT9mQCAVinCGrfrmVi4U"
VAPID_SUBJECT = "mailto:catalystfarm1@gmail.com"

[observability]
enabled = true

# The code reads env.DB — this binding name must stay "DB".
[[d1_databases]]
binding = "DB"
database_name = "house-hub"
database_id = "c5410eee-9095-4092-84b0-dc534aded0d8"

# Reminders. One trigger every 15 minutes (P2-PWA-02: the park alert watches all day). The handler reads the New York
# time of each firing, so the 8:00 am / 8:00 pm jobs keep their local hour across DST; every other firing runs only the
# park alert and the personal prayer reminders (src/reminders.js jobsAt). A second trigger every minute runs only the
# "Timer done" push (batch 6, PWA-GAP-1: src/reminders.js timerJob); the 15-minute one runs the other jobs unchanged.
[triggers]
crons = ["*/15 * * * *", "* * * * *"]
